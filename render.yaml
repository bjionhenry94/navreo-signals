envVarGroups:
  - name: navreo-secrets
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: THEIRSTACK_API_KEY
        sync: false
      - key: PROSPEO_API_KEY
        sync: false
      - key: AI_ARK_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: HEYREACH_API_KEY
        sync: false
      - key: TRIGIFY_API_KEY
        sync: false
      - key: SMARTLEAD_API_KEY
        sync: false
      - key: BETTERCONTACT_API_KEY
        sync: false
      - key: MILLIONVERIFIER_API_KEY
        sync: false
      - key: LISTMINT_API_KEY
        sync: false
      - key: NOTION_API_KEY
        sync: false

services:
  # The web app + /api. Render injects $PORT; server.py binds 0.0.0.0.
  - type: web
    name: navreo-signals
    runtime: python
    plan: standard  # 2GB/1CPU — starter's 512MB OOM-killed in-process sweeps (2026-08-12)
    buildCommand: pip install -r requirements.txt
    startCommand: python app/server.py
    healthCheckPath: /healthz
    envVars:
      - fromGroup: navreo-secrets

  # The daily pull, formerly launchd. UTC schedule — 07:30 UTC ≈ the old
  # morning run. Adjust the cron to your preferred send-prep time.
  - type: cron
    name: navreo-signals-daily
    runtime: python
    plan: starter
    schedule: "0 */3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python app/run_daily.py
    envVars:
      - fromGroup: navreo-secrets

  # Daily Smartlead mailbox -> Supabase snapshot (mailboxes + mailbox_stats_daily).
  - type: cron
    name: navreo-mailbox-sync
    runtime: python
    plan: starter
    schedule: "30 4 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python app/sync_mailboxes.py
    envVars:
      - fromGroup: navreo-secrets

  # Google reply-rate cap tiering. MUST run after navreo-mailbox-sync (04:30):
  # it scores off that snapshot's trailing-30d columns, so an earlier slot would
  # re-tier the whole Google fleet on yesterday's numbers. 45min of headroom.
  - type: cron
    name: navreo-google-caps
    runtime: python
    plan: starter
    schedule: "15 5 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python app/run_google_caps.py
    envVars:
      - fromGroup: navreo-secrets

  # Outlook/Azure reply-rate cap tiering. Deliberately scheduled AFTER the
  # legacy pg_cron job (reply-caps-daily, 05:45) that drives the standalone
  # audit service: that engine ignores its own provider filter and on
  # 2026-07-26 set 132 Navreo GOOGLE boxes to 4/day. Running last means our
  # correctly-scoped engines get the final word each morning. Once the legacy
  # job is retired this can move earlier.
  - type: cron
    name: navreo-outlook-caps
    runtime: python
    plan: starter
    schedule: "0 6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python app/run_outlook_caps.py
    envVars:
      - fromGroup: navreo-secrets

  # Daily proof that the two engines are actually MOVING caps. Exists because
  # the legacy service reported success while doing nothing for three days
  # (2026-07-26 to 07-28) and the silence looked identical to a quiet day.
  # Runs after both engines. Exit 1 = something has stalled.
  - type: cron
    name: navreo-caps-check
    runtime: python
    plan: starter
    schedule: "30 6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python app/check_caps_moving.py
    envVars:
      - fromGroup: navreo-secrets

  # Live-confirmed collision census (the double-tap bar's true number). One full
  # Smartlead leads-export per active campaign, held in memory — too heavy for
  # the web instance, where it OOM-crash-looped the 512MB box ~120s after every
  # boot. Isolated here with the whole 512MB to itself; every 6h. The web app
  # (/api/collisions) just serves the value this writes to app_activity_log.
  - type: cron
    name: navreo-collision-census
    runtime: python
    plan: starter
    schedule: "45 */6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python app/run_collision_census.py
    envVars:
      - fromGroup: navreo-secrets

  # Notion <-> Smartlead <-> Supabase booked-lead sync (booked-sync-orchestrator
  # skill). Ratchet-only; pauses booked leads in every active campaign so we
  # never double-message someone we've already booked. Idles harmlessly until
  # NOTION_API_KEY lands in navreo-secrets. BOOKED_SYNC_DRY=1 keeps the first
  # live cycles write-free — flip to 0 after the dry diff is verified.
  - type: cron
    name: navreo-booked-sync
    runtime: python
    plan: starter
    schedule: "*/30 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python app/sync_booked.py
    envVars:
      - fromGroup: navreo-secrets
      - key: BOOKED_SYNC_DRY
        value: "1"
