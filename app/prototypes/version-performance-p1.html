<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Version performance P1 — Verdict first · Navreo</title>
<style>
@font-face{font-family:"Acid Grotesk";src:url("../fonts/AcidGrotesk-Normal.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap;}
:root{
  --orange:#FF4D00;--orange-600:#DB4100;--orange-100:#FFE4D6;
  --ink:#14110E;--ink-2:#3A332C;--ink-3:#6B6055;--brown-300:#C0B0A0;
  --cream:#F9F0E7;--cream-50:#FCF7F1;--card:#FFFFFF;--sunken:#F4ECE2;
  --line:#EBE1D5;--line-2:#DCC6AE;
  --green:#2E7D5B;--green-bg:#E4F1EA;--red:#C2371F;--red-bg:#F8E1DA;--amber:#8F6600;
  --font-sans:"DM Sans","Helvetica Neue",system-ui,sans-serif;
  --font-display:"Acid Grotesk","DM Sans",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.4;padding:40px 20px}
.wrap{max-width:820px;margin:0 auto}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.h1{font-family:var(--font-display);font-size:26px;letter-spacing:-.01em;margin:2px 0 0}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:16px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:600;color:var(--ink-3);background:var(--sunken);border:1px solid var(--line);padding:5px 11px;border-radius:999px}
/* verdict */
.verdict{background:var(--ink);color:var(--cream);border-radius:18px;padding:26px 28px;margin-bottom:14px}
.verdict .lead{font-family:var(--font-display);font-size:23px;line-height:1.22;letter-spacing:-.01em}
.verdict .lead b{color:#FFB98F}
.verdict .sub{font-size:14px;color:#D8CBBD;margin-top:9px;max-width:60ch}
/* meeting hero */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:14px}
.card-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:16px}
.mtg-top{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.mtg-big{font-family:var(--font-display);font-size:48px;line-height:1;letter-spacing:-.02em}
.mtg-cap{font-size:14px;color:var(--ink-2)}
.splitbar{height:26px;border-radius:8px;overflow:hidden;display:flex;background:var(--sunken)}
.splitbar span{display:flex;align-items:center;padding:0 12px;font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap}
.seg-1{background:var(--orange)}
.seg-2{background:var(--brown-300);color:var(--ink)}
.splitleg{display:flex;gap:20px;margin-top:12px;font-size:13px;color:var(--ink-2)}
.splitleg i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:7px;vertical-align:0}
/* head to head evidence */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.vcard{border:1px solid var(--line);border-radius:14px;padding:18px 20px;position:relative;background:var(--card)}
.vcard.win{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}
.vcard.lose{background:var(--cream-50)}
.vtag{position:absolute;top:14px;right:14px;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.vtag.win{background:var(--orange);color:#fff}
.vtag.lose{background:var(--red-bg);color:var(--red)}
.vname{font-family:var(--font-display);font-size:19px;margin-bottom:2px}
.vsub{font-size:12px;color:var(--ink-3);margin-bottom:16px}
.stat{margin-bottom:13px}
.stat .lbl{font-size:12px;color:var(--ink-3);margin-bottom:5px;display:flex;justify-content:space-between}
.stat .val{font-weight:700;color:var(--ink)}
.track{height:9px;border-radius:5px;background:var(--sunken);overflow:hidden}
.track i{display:block;height:100%;border-radius:5px;background:var(--orange)}
.vcard.lose .track i{background:var(--brown-300)}
/* action */
.action{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--orange-100);border:1px solid var(--line-2);border-radius:14px;padding:16px 20px;margin-top:14px;flex-wrap:wrap}
.action .txt{font-size:14.5px;font-weight:600;color:var(--ink)}
.action .txt span{display:block;font-size:12.5px;font-weight:500;color:var(--ink-2);margin-top:2px}
.btn{background:var(--orange);color:#fff;border:none;border-radius:999px;padding:11px 20px;font:600 13.5px var(--font-sans);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--orange-600)}
details{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
summary{font-size:12.5px;color:var(--ink-3);cursor:pointer;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"›";display:inline-block;margin-right:7px;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
details p{font-size:12.5px;color:var(--ink-3);margin-top:9px;line-height:1.55}
.foot{font-size:11.5px;color:var(--brown-300);margin-top:18px;text-align:center}
@media(max-width:640px){.grid2{grid-template-columns:1fr}.verdict .lead{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="eyebrow">Version performance</div><div class="h1">What's working</div></div>
    <div class="chip">Live from Smartlead · since relaunch</div>
  </div>

  <div class="verdict" id="verdict"></div>

  <div class="card">
    <div class="card-h">Where your calls come from</div>
    <div class="mtg-top"><div class="mtg-big" id="mtgTotal">–</div><div class="mtg-cap">calls booked</div></div>
    <div class="splitbar" id="splitbar"></div>
    <div class="splitleg" id="splitleg"></div>
  </div>

  <div class="card">
    <div class="card-h">Email 1 — A vs B, the two openers being tested</div>
    <div class="grid2" id="ab"></div>
    <div class="action" id="action"></div>
    <details>
      <summary>Why these numbers, and what we don't split</summary>
      <p id="why"></p>
    </details>
  </div>

  <div class="foot">A version needs about 300 sends before we call a winner — under that it reads "too early".</div>
</div>

<script>
const DATA={
  versions:[
    {step:1,label:"A",sent:1269,replies:20,positives:14,bounces:28},
    {step:1,label:"B",sent:1259,replies:18,positives:9,bounces:28},
    {step:2,label:"inline",inline:true,sent:1757,replies:22,positives:13,bounces:11}
  ],
  meetings:{total:16,by_step:{1:13,2:3}}
};
const FLOOR=300;
const pct=(n,d)=>d?(n/d*100):0;
const perPos=v=>v.positives>0?Math.round(v.sent/v.positives):null;
const early=v=>v.sent<FLOOR;
const A=DATA.versions[0],B=DATA.versions[1];
const m1=DATA.meetings.by_step[1]||0,m2=DATA.meetings.by_step[2]||0,mt=DATA.meetings.total;

// verdict
const winner=A.positives/A.sent>=B.positives/B.sent?A:B;
const loser=winner===A?B:A;
document.getElementById("verdict").innerHTML=
 `<div class="lead">Your calls come from <b>Email 1</b> — ${m1} of ${mt}. And <b>Version ${winner.label}</b> is your best opener.</div>`+
 `<div class="sub">${winner.label} gets a reply-you-want every ${perPos(winner)} emails; ${loser.label} needs ${perPos(loser)}. Both were sent to about the same number of people, so it's a fair fight — ${winner.label} simply wins.</div>`;

// meeting hero
document.getElementById("mtgTotal").textContent=mt;
const w1=Math.max(12,pct(m1,mt)),w2=Math.max(12,pct(m2,mt));
document.getElementById("splitbar").innerHTML=
 `<span class="seg-1" style="width:${w1}%">Email 1 · ${m1}</span>`+
 `<span class="seg-2" style="width:${w2}%">Email 2 · ${m2}</span>`;
document.getElementById("splitleg").innerHTML=
 `<div><i style="background:var(--orange)"></i>Email 1 booked ${m1} calls (${Math.round(pct(m1,mt))}%)</div>`+
 `<div><i style="background:var(--brown-300)"></i>Email 2 booked ${m2}</div>`;

// A vs B cards — positive rate + efficiency, bars scaled to the better of the two
function vcard(v,isWin){
  const pr=pct(v.positives,v.sent), maxPr=Math.max(pct(A.positives,A.sent),pct(B.positives,B.sent));
  const pp=perPos(v), bestpp=Math.min(perPos(A),perPos(B));
  const effWidth=pp?bestpp/pp*100:0; // shorter bar = worse; longer = closer to best
  return `<div class="vcard ${isWin?'win':'lose'}">
    <span class="vtag ${isWin?'win':'lose'}">${isWin?'Winner':'Losing'}</span>
    <div class="vname">Version ${v.label}</div>
    <div class="vsub">${v.sent.toLocaleString()} sent · ${v.positives} good replies</div>
    <div class="stat"><div class="lbl"><span>Warm reply rate</span><span class="val">${pr.toFixed(1)}%</span></div>
      <div class="track"><i style="width:${Math.max(6,pct(pr,maxPr)*.94)}%"></i></div></div>
    <div class="stat"><div class="lbl"><span>Emails per good reply <em style="font-style:normal;color:var(--brown-300);font-weight:600">· fewer is better</em></span><span class="val">${early(v)?'too early':pp}</span></div>
      <div class="track"><i style="width:${early(v)?0:Math.max(6,effWidth)}%"></i></div></div>
  </div>`;
}
document.getElementById("ab").innerHTML=vcard(winner,true)+vcard(loser,false);

// action
document.getElementById("action").innerHTML=
 `<div class="txt">Turn ${loser.label} off, put its sends behind ${winner.label}.<span>Same audience, better opener — the cheapest way to more calls.</span></div>`+
 `<button class="btn">Do this</button>`;

// why
document.getElementById("why").textContent=
 `Every number is Smartlead's own, since the last time this sequence was saved (saving resets the counters). "Good reply" is Smartlead's interested mark. Calls sit on the email that got the reply — Smartlead can't tell us which of A or B a caller first saw, so we never split Email 1's ${m1} calls between A and B by guess. We pick the winner on the signals we can trust: warm-reply rate and emails-per-good-reply, where ${winner.label} leads.`;
</script>
</body>
</html>
