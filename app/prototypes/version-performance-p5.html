<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Version performance P5 — Head to head · Navreo</title>
<style>
@font-face{font-family:"Acid Grotesk";src:url("../fonts/AcidGrotesk-Normal.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap;}
:root{
  --orange:#FF4D00;--orange-600:#DB4100;--orange-100:#FFE4D6;
  --ink:#14110E;--ink-2:#3A332C;--ink-3:#6B6055;--brown-300:#C0B0A0;
  --cream:#F9F0E7;--cream-50:#FCF7F1;--card:#FFFFFF;--sunken:#F1E7DB;
  --line:#EBE1D5;--line-2:#DCC6AE;--green:#2E7D5B;--red:#C2371F;--red-bg:#F8E1DA;
  --font-sans:"DM Sans","Helvetica Neue",system-ui,sans-serif;
  --font-display:"Acid Grotesk","DM Sans",sans-serif;--font-mono:"JetBrains Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.4;padding:40px 20px}
.wrap{max-width:800px;margin:0 auto}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.h1{font-family:var(--font-display);font-size:26px;letter-spacing:-.01em;margin:2px 0 0}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;gap:16px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:600;color:var(--ink-3);background:var(--sunken);border:1px solid var(--line);padding:5px 11px;border-radius:999px}
.verdict{font-family:var(--font-display);font-size:18px;line-height:1.3;background:var(--ink);color:var(--cream);border-radius:14px;padding:18px 22px;margin-bottom:18px}
.verdict b{color:#FFB98F}
.arena{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pickrow{display:flex;align-items:stretch}
.side{flex:1;padding:20px;text-align:center}
.side.left{border-right:1px solid var(--line)}
.side .who{font-family:var(--font-display);font-size:22px;margin-bottom:8px}
.side .score{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.side .score b{font-size:15px;color:var(--orange-600)}
.seg{display:inline-flex;background:var(--sunken);border-radius:999px;padding:3px;gap:2px;margin-top:12px}
.seg button{border:none;background:transparent;font:700 12px var(--font-sans);color:var(--ink-3);padding:5px 12px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.vs{align-self:center;font-family:var(--font-display);font-size:14px;color:var(--brown-300);padding:0 4px}
.rows{padding:6px 0}
.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:15px 20px;border-top:1px solid var(--line)}
.job{grid-column:1/-1;text-align:center;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:-6px;padding-top:4px}
.cell{text-align:center}
.cell .big{font-family:var(--font-display);font-size:22px;line-height:1}
.cell .cap{font-size:11px;color:var(--ink-3);margin-top:3px}
.cell.win .big{color:var(--orange-600)}
.wpill{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--orange);color:#fff;padding:2px 8px;border-radius:999px;margin-top:5px}
.tie{font-size:11px;color:var(--ink-3);text-align:center;grid-column:2}
.mid-i{width:26px;height:26px;border-radius:999px;background:var(--sunken);color:var(--ink-3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.shared{grid-column:1/-1;text-align:center;font-size:12px;color:var(--ink-3);background:var(--cream-50);border-radius:10px;padding:8px 12px}
.shared b{color:var(--ink-2)}
.action{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--orange-100);border-top:1px solid var(--line-2);padding:16px 20px;flex-wrap:wrap}
.action .txt{font-size:14px;font-weight:600}.action .txt span{display:block;font-size:12px;font-weight:500;color:var(--ink-2);margin-top:2px}
.btn{background:var(--orange);color:#fff;border:none;border-radius:999px;padding:10px 18px;font:600 13px var(--font-sans);cursor:pointer;white-space:nowrap}.btn:hover{background:var(--orange-600)}
.foot{font-size:11.5px;color:var(--brown-300);margin-top:16px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="eyebrow">Version performance</div><div class="h1">Head to head</div></div>
    <div class="chip">Live from Smartlead · since relaunch</div>
  </div>
  <div class="verdict" id="verdict"></div>
  <div class="arena">
    <div class="pickrow">
      <div class="side left"><div class="who" id="whoL">–</div><div class="score" id="scoreL"></div>
        <div class="seg" id="segL"></div></div>
      <div class="vs">vs</div>
      <div class="side"><div class="who" id="whoR">–</div><div class="score" id="scoreR"></div>
        <div class="seg" id="segR"></div></div>
    </div>
    <div class="rows" id="rows"></div>
    <div class="action" id="action"></div>
  </div>
  <div class="foot">Every number is Smartlead's own, since the sequence was last saved. A version under ~300 sends reads "too early".</div>
</div>
<script>
const DATA={
  versions:[
    {step:1,label:"A",sent:1269,replies:20,positives:14,bounces:28},
    {step:1,label:"B",sent:1259,replies:18,positives:9,bounces:28},
    {step:2,label:"inline",inline:true,sent:1757,replies:22,positives:13,bounces:11}
  ],
  meetings:{total:16,by_step:{1:13,2:3}}
};
const V={A:DATA.versions[0],B:DATA.versions[1],E2:DATA.versions[2]};
const KEYS=["A","B","E2"];
const nm=k=>k==="E2"?"Email 2":("Version "+k);
const stepOf=k=>k==="E2"?2:1;
const perPos=v=>v.positives>0?Math.round(v.sent/v.positives):null;
const m1=DATA.meetings.by_step[1]||0,m2=DATA.meetings.by_step[2]||0,mt=DATA.meetings.total;
let L="A",R="B";

function callsFor(k){return stepOf(k)===1?m1:m2;}
function jobs(lk,rk){
  const l=V[lk],r=V[rk];
  const sameStep=stepOf(lk)===stepOf(rk);
  return [
    {job:"Books calls", shared:sameStep,
      l:callsFor(lk), r:callsFor(rk), fmt:x=>x+"", cap:"on this email step",
      note:sameStep?`Both are on Email ${stepOf(lk)} — those ${callsFor(lk)} calls are shared, and Smartlead won't split them between openers.`:null},
    {job:"Warm reply rate", l:l.positives/l.sent*100, r:r.positives/r.sent*100, fmt:x=>x.toFixed(1)+"%", cap:"good replies ÷ sent"},
    {job:"Effort per good reply", l:perPos(l), r:perPos(r), fmt:x=>"1 / "+x, cap:"lower is better", lowerBetter:true},
    {job:"Emails sent", l:l.sent, r:r.sent, fmt:x=>x.toLocaleString(), cap:"the fairness check", neutral:true}
  ];
}
function seg(side){
  return KEYS.map(k=>`<button class="${(side==='L'?L:R)===k?'on':''}" data-side="${side}" data-k="${k}">${k==='E2'?'E2':k}</button>`).join("");
}
function render(){
  document.getElementById("whoL").textContent=nm(L);
  document.getElementById("whoR").textContent=nm(R);
  document.getElementById("segL").innerHTML=seg("L");
  document.getElementById("segR").innerHTML=seg("R");
  const js=jobs(L,R);
  const decided=js.filter(j=>!j.shared&&!j.neutral).length;
  let winsL=0,winsR=0;
  const rowsHtml=js.map(j=>{
    if(j.shared){
      return `<div class="row"><div class="job">${j.job}</div>
        <div class="shared">${j.note}</div></div>`;
    }
    let lWin=false,rWin=false;
    if(!j.neutral){
      if(j.lowerBetter){lWin=j.l<j.r;rWin=j.r<j.l;} else {lWin=j.l>j.r;rWin=j.r>j.l;}
      if(lWin)winsL++; if(rWin)winsR++;
    }
    return `<div class="row"><div class="job">${j.job}</div>
      <div class="cell ${lWin?'win':''}"><div class="big">${j.fmt(j.l)}</div><div class="cap">${j.cap}</div>${lWin?'<div class="wpill">better</div>':''}</div>
      <div class="mid-i">vs</div>
      <div class="cell ${rWin?'win':''}"><div class="big">${j.fmt(j.r)}</div><div class="cap">${j.cap}</div>${rWin?'<div class="wpill">better</div>':''}</div></div>`;
  }).join("");
  document.getElementById("rows").innerHTML=rowsHtml;
  document.getElementById("scoreL").innerHTML=`wins <b>${winsL}</b>`;
  document.getElementById("scoreR").innerHTML=`wins <b>${winsR}</b>`;
  // action: recommend the overall winner of the two shown
  const champKey=winsL>=winsR?L:R, dogKey=champKey===L?R:L;
  const champ=V[champKey],dog=V[dogKey];
  let msg;
  if(stepOf(L)===stepOf(R)){
    msg=`<div class="txt">Keep ${nm(champKey)}, retire ${nm(dogKey)}.<span>Same step, same audience — ${nm(champKey)} wins ${Math.max(winsL,winsR)} of ${decided} measures. Move the losing sends over.</span></div><button class="btn">Do this</button>`;
  } else {
    msg=`<div class="txt">${nm(champKey)} is the stronger step right now.<span>Different jobs in the sequence — keep both, but feed ${nm(champKey)} first.</span></div><button class="btn">Note it</button>`;
  }
  document.getElementById("action").innerHTML=msg;
}
document.getElementById("segL").addEventListener("click",pick);
document.getElementById("segR").addEventListener("click",pick);
function pick(e){const b=e.target.closest("button");if(!b)return;
  const k=b.dataset.k,side=b.dataset.side;
  if(side==="L"){if(k===R)R=L;L=k;} else {if(k===L)L=R;R=k;}
  render();}

const winner=(V.A.positives/V.A.sent>=V.B.positives/V.B.sent)?"A":"B",loser=winner==="A"?"B":"A";
document.getElementById("verdict").innerHTML=`Put any two versions side by side. Out of the box: <b>Version ${winner.label||winner}</b> beats ${loser} on the openers — and <b>Email 1</b> books ${m1} of your ${mt} calls.`;
render();
</script>
</body>
</html>
