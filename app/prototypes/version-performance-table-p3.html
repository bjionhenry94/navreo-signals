<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Version performance — Table T3 · Leaderboard · Navreo</title>
<style>
@font-face{font-family:"Acid Grotesk";src:url("../fonts/AcidGrotesk-Normal.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap;}
:root{
  --orange:#FF4D00;--orange-600:#DB4100;--orange-100:#FFE4D6;
  --ink:#14110E;--ink-2:#3A332C;--ink-3:#6B6055;--brown-300:#C0B0A0;
  --cream:#F9F0E7;--cream-50:#FCF7F1;--card:#FFFFFF;--sunken:#F4ECE2;
  --line:#EBE1D5;--line-2:#DCC6AE;--green:#2E7D5B;--green-bg:#E4F1EA;--red:#C2371F;--red-bg:#F8E1DA;
  --font-sans:"DM Sans","Helvetica Neue",system-ui,sans-serif;
  --font-display:"Acid Grotesk","DM Sans",sans-serif;--font-mono:"JetBrains Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.4;padding:40px 20px}
.wrap{max-width:900px;margin:0 auto}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.h1{font-family:var(--font-display);font-size:26px;letter-spacing:-.01em;margin:2px 0 0}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;gap:16px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:600;color:var(--ink-3);background:var(--sunken);border:1px solid var(--line);padding:5px 11px;border-radius:999px}
.callsstrip{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.callsstrip .lbl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.callbadge{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px}
.callbadge b{font-family:var(--font-display);font-size:16px}
.callbadge.lead{border-color:var(--orange);background:var(--orange-100)}
.sortrow{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.sortrow .lbl{font-size:12px;color:var(--ink-3);font-weight:600}
.sw{font:600 12.5px var(--font-sans);padding:7px 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);cursor:pointer}
.sw.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:600px}
thead th{text-align:right;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:13px 14px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
thead th.l{text-align:left}
thead th.hot{color:var(--orange-600)}
tbody td{padding:14px 14px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
tbody td.l{text-align:left}
tbody tr:last-child td{border-bottom:none}
.rankcell{font-family:var(--font-display);font-size:18px;color:var(--brown-300);width:40px}
tr.first .rankcell{color:var(--orange)}
tr.first{background:linear-gradient(90deg,rgba(255,77,0,.06),rgba(255,77,0,0))}
tr.last td{color:var(--ink-3);background:var(--cream-50)}
.vlabel{font-weight:700}.em{font-size:12px;color:var(--ink-3)}
.pill{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-left:6px}
.pill.win{background:var(--orange);color:#fff}.pill.cut{background:var(--red-bg);color:var(--red)}.pill.keep{background:var(--green-bg);color:var(--green)}
td.hot{font-family:var(--font-display);font-size:17px;color:var(--ink)}
tr.first td.hot{color:var(--orange-600)}
.act{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 18px;background:var(--orange-100);flex-wrap:wrap}
.act .txt{font-size:14px;font-weight:600}.act .txt span{display:block;font-size:12px;font-weight:500;color:var(--ink-2);margin-top:2px}
.btn{background:var(--orange);color:#fff;border:none;border-radius:999px;padding:10px 18px;font:600 13px var(--font-sans);cursor:pointer}.btn:hover{background:var(--orange-600)}
.foot{padding:13px 18px;font-size:11.5px;color:var(--ink-3);line-height:1.6;background:var(--cream-50);border-top:1px solid var(--line)}
.foot b{color:var(--ink-2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="eyebrow">Version performance</div><div class="h1">Best to worst</div></div>
    <div class="chip">Live from Smartlead · since relaunch</div>
  </div>
  <div class="callsstrip" id="calls"></div>
  <div class="sortrow"><span class="lbl">Rank by</span><span id="sort"></span></div>
  <div class="card">
    <div class="tscroll">
    <table>
      <thead><tr>
        <th class="l">#</th><th class="l">Version</th><th data-c="sent">Sent</th><th data-c="replies">Replies</th>
        <th data-c="positives">Positives</th><th data-c="warm">Warm %</th><th data-c="per">1 per</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table></div>
    <div class="act" id="act"></div>
    <div class="foot" id="foot"></div>
  </div>
</div>
<script>
const DATA={
  versions:[
    {step:1,label:"A",sent:1269,replies:20,positives:14,bounces:28},
    {step:1,label:"B",sent:1259,replies:18,positives:9,bounces:28},
    {step:2,label:"inline",inline:true,sent:1757,replies:22,positives:13,bounces:11}
  ],
  meetings:{total:16,by_step:{1:13,2:3}}
};
const FLOOR=300;
const perPos=v=>v.positives>0?Math.round(v.sent/v.positives):null;
const warm=v=>v.positives/v.sent*100;
const m1=DATA.meetings.by_step[1]||0,m2=DATA.meetings.by_step[2]||0,mt=DATA.meetings.total;
const val=(v,c)=>c==="warm"?warm(v):c==="per"?perPos(v):v[c];
const lowerBetter=c=>c==="per";
const METRICS=[{c:"positives",l:"Positives"},{c:"warm",l:"Warm %"},{c:"per",l:"Efficiency"},{c:"sent",l:"Sent"}];
let sortC="warm";

// calls strip (step level, honest)
document.getElementById("calls").innerHTML=`<span class="lbl">Calls booked</span>`+
  `<span class="callbadge lead">Email 1 <b>${m1}</b></span>`+
  `<span class="callbadge">Email 2 <b>${m2}</b></span>`+
  `<span class="em" style="font-size:12px;color:var(--ink-3)">· on the step that got the reply — Email 1's ${m1} are shared by A &amp; B</span>`;

document.getElementById("sort").innerHTML='<span class="sortrow" style="margin:0;display:inline-flex">'+
  METRICS.map(m=>`<button class="sw ${m.c===sortC?'on':''}" data-c="${m.c}">${m.l}</button>`).join("")+'</span>';

function render(){
  const rows=[...DATA.versions].sort((a,b)=>{
    const x=val(a,sortC),y=val(b,sortC);return lowerBetter(sortC)?x-y:y-x;});
  const n=rows.length;
  document.querySelectorAll("thead th").forEach(th=>th.classList.toggle("hot",th.dataset.c===sortC));
  document.getElementById("tbody").innerHTML=rows.map((v,i)=>{
    const early=v.sent<FLOOR;
    const first=i===0&&!early, last=i===n-1;
    const label=v.inline?"inline":v.label;
    let pill=early?'<span class="pill cut">too early</span>':first?'<span class="pill win">winner</span>':(last?'<span class="pill cut">cut</span>':(v.inline?'<span class="pill keep">keep</span>':''));
    const hot=c=>c===sortC?' hot':'';
    return `<tr class="${first?'first':''} ${last?'last':''}">
      <td class="l rankcell">${i+1}</td>
      <td class="l"><span class="vlabel">${label}</span> <span class="em">Email ${v.step}</span>${pill}</td>
      <td class="${hot('sent')}">${v.sent.toLocaleString()}</td>
      <td class="${hot('replies')}">${v.replies}</td>
      <td class="${hot('positives')}">${v.positives}</td>
      <td class="${hot('warm')}">${early?'—':warm(v).toFixed(1)+'%'}</td>
      <td class="${hot('per')}">${early?'early':'1 / '+perPos(v)}</td>
    </tr>`;
  }).join("");
  const best=rows[0],worst=rows[n-1];
  document.getElementById("act").innerHTML=`<div class="txt">Scale ${best.inline?'inline':best.label}, cut ${worst.inline?'inline':worst.label}.<span>Top of the board on ${METRICS.find(m=>m.c===sortC).l.toLowerCase()} — put the loser's sends behind the leader.</span></div><button class="btn">Do this</button>`;
}
document.getElementById("sort").addEventListener("click",e=>{const b=e.target.closest(".sw");if(!b)return;
  sortC=b.dataset.c;document.querySelectorAll(".sw").forEach(s=>s.classList.toggle("on",s===b));render();});
document.getElementById("foot").innerHTML=`Sorted best-to-worst by the metric you pick; the bottom row is the one to cut. <b>Warm %</b> = good replies ÷ sent. <b>1 per</b> = emails per good reply (lower is better). Meetings are shown above the table because a booking sits on the email step, not the version — Email 1's ${m1} calls are shared by A &amp; B and never split by guess. Since relaunch.`;
render();
</script>
</body>
</html>
