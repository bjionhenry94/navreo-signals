<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launching for Navreo — Progress rings</title>
<link rel="stylesheet" href="launch-dashboard-base.css">
<style>
  /* ===== launch-dashboard-p2 — the "Progress ring" grammar =================
     Every campaign is a card; the centrepiece is a circular ring showing overall
     launch progress. Completed arc green, active arc orange (breathes), rest faint.
     Tap the ring or a stage dot to flip the card to that stage's detail. All layout
     here is prototype-specific; colour tokens + atoms come from the linked base.css. */

  body{ overflow-x:hidden; }

  .ld-theme{ display:inline-flex; align-items:center; justify-content:center; }

  .ld-grid{
    display:grid; gap:16px;
    grid-template-columns:repeat(auto-fill, minmax(288px, 1fr));
  }

  .lc{ position:relative; padding:18px; min-width:0; min-height:326px; box-shadow:var(--shadow); }
  .lc-face{ min-width:0; }
  .lc-face[hidden]{ display:none; }

  /* ---- ring face ---------------------------------------------------------- */
  .lc-head{ min-width:0; }
  .lc-name{ font-size:15px; font-weight:500; color:var(--ink); line-height:1.2;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lc-caption{ font-size:12px; color:var(--ink-3); margin-top:3px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .ring-btn{ appearance:none; border:none; background:none; cursor:pointer; padding:0;
    display:block; margin:8px auto 0; position:relative; width:150px; height:150px; }
  .ring-svg{ display:block; transition:transform .18s ease; }
  .ring-btn:hover .ring-svg{ transform:scale(1.025); }
  .ring-btn:active .ring-svg{ transform:scale(.99); }
  .ring-center{ position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:0 30px;
    pointer-events:none; }
  .rc-big{ font-size:30px; line-height:1; color:var(--orange); }
  .rc-sub{ font-size:11px; color:var(--ink-3); margin-top:5px; line-height:1.2; }

  /* breathing of the active arc + its leading edge (opacity-only; rotation is kept) */
  @keyframes ld-ring-breathe{ 0%,100%{ opacity:.55 } 50%{ opacity:1 } }
  @keyframes ld-ring-ping{ 0%{ opacity:.55; r:5 } 70%,100%{ opacity:0; r:12 } }
  .ring-active{ animation:ld-ring-breathe 1.8s ease-in-out infinite; }
  .ring-ping{ animation:ld-ring-ping 2.2s ease-out infinite; }
  @media (prefers-reduced-motion:reduce){
    .ring-active{ animation:none; opacity:1 }
    .ring-ping{ animation:none; opacity:0 }
  }

  /* ---- stage row (skip-to-stage controls) --------------------------------- */
  .lc-stages{ display:flex; gap:4px; margin-top:16px; }
  .lc-stage{ flex:1 1 0; min-width:0; display:flex; flex-direction:column;
    align-items:center; gap:7px; background:none; border:none; cursor:pointer;
    padding:9px 2px; border-radius:10px; transition:background .15s ease; }
  .lc-stage:hover{ background:var(--bg-sunken); }
  .lc-stage .stagedot{ width:10px; height:10px; }
  .lc-stage .stagelabel{ font-size:10px; line-height:1; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; max-width:100%; }

  /* ---- foot --------------------------------------------------------------- */
  .lc-foot{ display:flex; align-items:center; justify-content:space-between; gap:8px;
    margin-top:16px; padding-top:14px; border-top:1px solid var(--line);
    font-size:12px; color:var(--ink-3); }
  .lc-reach .num{ font-size:14px; color:var(--ink-2); }
  .lc-tag{ background:var(--bg-sunken); border:1px solid var(--line); border-radius:999px;
    padding:3px 9px; color:var(--ink-3); font-size:11px; white-space:nowrap; flex:0 0 auto; }

  /* ---- detail face -------------------------------------------------------- */
  .lc-detail-head{ display:flex; align-items:center; gap:10px; }
  .lc-detail-title{ font-size:14px; font-weight:500; color:var(--ink); }
  .dstat{ display:inline-flex; align-items:center; gap:6px; font-size:11px; margin-left:auto;
    white-space:nowrap; }
  .dstat.done{ color:var(--green) } .dstat.active{ color:var(--orange) } .dstat.queued{ color:var(--ink-3) }
  .dstat-dot{ width:8px; height:8px; border-radius:50%; background:var(--orange); }
  .lc-detail-body{ margin-top:16px; }

  /* targeting */
  .t-count{ font-size:14px; color:var(--ink-2); }
  .t-count .num{ font-size:20px; color:var(--ink); }
  .bar{ height:7px; background:var(--bg-sunken); border-radius:999px; overflow:hidden; margin-top:9px; }
  .bar-fill{ height:100%; border-radius:999px; }
  .bar-fill.done{ background:var(--green); }
  .bar-fill.active{ background:var(--orange); }
  @keyframes ld-bar-pulse{ 0%,100%{ opacity:.6 } 50%{ opacity:1 } }
  .bar-fill.active.breathe-bar{ animation:ld-bar-pulse 1.8s ease-in-out infinite; }
  @media (prefers-reduced-motion:reduce){ .bar-fill.active.breathe-bar{ animation:none; opacity:1 } }
  .t-group{ margin-top:15px; }
  .microlabel{ font-size:10px; text-transform:uppercase; letter-spacing:.07em;
    color:var(--ink-3); margin-bottom:8px; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; }

  /* copy */
  .lc-detail-body .mailframe{ margin-top:2px; }
  .mailhead{ font-weight:500; color:var(--ink); }

  /* icebreaker */
  .ib-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .ib-line{ padding:9px 12px; background:var(--bg-sunken); border-left:2px solid var(--line-2);
    border-radius:8px; color:var(--ink-2); font-size:13px; line-height:1.4; }

  /* checks */
  .ck-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1px; }
  .ck-row{ display:flex; align-items:center; gap:11px; padding:9px 2px; }
  .ck{ width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .ck-dot{ width:10px; height:10px; border-radius:50%; }
  .ck.running .ck-dot{ background:var(--orange); }
  .ck.waiting .ck-dot{ background:transparent; border:1.5px solid var(--line-2); box-sizing:border-box; }
  .ck-label{ font-size:13px; color:var(--ink-2); }
  .ck.waiting ~ .ck-label, .ck.waiting + .ck-label{ color:var(--ink-3); }

  /* live */
  .live-status{ font-size:13px; color:var(--ink-2); margin-bottom:18px; line-height:1.5; }
  .switch{ display:inline-flex; align-items:center; gap:12px; background:none; border:none;
    cursor:pointer; padding:6px 2px; font:inherit; }
  .switch-track{ width:46px; height:26px; border-radius:999px; background:var(--bg-sunken);
    border:1px solid var(--line-2); position:relative; flex:0 0 auto;
    transition:background .2s ease, border-color .2s ease; }
  .switch.on .switch-track{ background:var(--orange); border-color:transparent; }
  .switch-knob{ position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%;
    background:#fff; border:1px solid var(--line-2); transition:transform .2s ease;
    box-shadow:0 1px 2px rgba(20,17,14,.18); }
  .switch.on .switch-knob{ transform:translateX(20px); border-color:transparent; }
  .switch-label{ font-size:13px; color:var(--ink-2); }
  @keyframes ld-sw-halo{ 0%{ box-shadow:0 0 0 0 var(--orange-100) } 70%,100%{ box-shadow:0 0 0 9px transparent } }
  .switch:not(.on) .switch-knob{ animation:ld-sw-halo 2.2s ease-out infinite; }
  @media (prefers-reduced-motion:reduce){ .switch:not(.on) .switch-knob{ animation:none } }

  /* queued placeholder */
  .queued-empty{ display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:9px; padding:38px 10px; }
  .queued-empty .stagedot{ width:12px; height:12px; }
  .qe-title{ font-size:14px; color:var(--ink-2); }
  .qe-sub{ font-size:12px; color:var(--ink-3); }

  /* shared focus ring for custom controls */
  .lc-stage:focus-visible, .ring-btn:focus-visible, .switch:focus-visible,
  .backbtn:focus-visible{ outline:none; box-shadow:0 0 0 3px var(--focus); border-radius:10px; }

  .icn{ display:inline-block; vertical-align:middle; }
</style>
</head>
<body>
  <div class="ld-app">
    <header class="ld-top">
      <div>
        <h1 class="ld-title">Launching for Navreo</h1>
        <div class="ld-sub" id="ldSub"></div>
      </div>
      <div class="ld-tools">
        <span class="ld-preview" id="ldPreview">preview data</span>
        <button class="ld-theme" id="themeBtn" type="button" aria-label="Switch to dark theme"></button>
      </div>
    </header>
    <main class="ld-grid" id="grid"></main>
  </div>

  <script src="launch-dashboard-fixture.js"></script>
  <script>
  (function(){
    "use strict";
    var LD = window.LD;
    if(!LD || !Array.isArray(LD.campaigns)){ return; }

    var C = 2 * Math.PI * 52;               // ring circumference (r = 52)

    /* ---- tiny helpers ----------------------------------------------------- */
    function esc(s){
      return String(s).replace(/[&<>"]/g, function(m){
        return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[m];
      });
    }
    function fmt(n){ return Number(n).toLocaleString("en-US"); }
    function stageStatus(i, active){ return i < active ? "done" : (i === active ? "active" : "queued"); }

    function iCheck(){
      return '<svg class="icn" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">'
        + '<path d="M13 4.5 6.5 11 3 7.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    }
    function iChevron(){
      return '<svg class="icn" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">'
        + '<path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    }
    function iSun(){
      return '<svg class="icn" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">'
        + '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>';
    }
    function iMoon(){
      return '<svg class="icn" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
        + '<path d="M20 14.6A8 8 0 1 1 9.4 4 6.5 6.5 0 0 0 20 14.6z"/></svg>';
    }

    /* ---- ring ------------------------------------------------------------- */
    function ringSVG(c){
      var done = c.active / 5;                                   // green fraction
      var act  = (c.active < 5) ? (c.pct / 100) / 5 : 0;         // orange (active) fraction
      var total = done + act;
      var ang = (-90 + total * 360) * Math.PI / 180;            // leading edge angle
      var lx = (60 + 52 * Math.cos(ang)).toFixed(2);
      var ly = (60 + 52 * Math.sin(ang)).toFixed(2);

      var track = '<circle cx="60" cy="60" r="52" fill="none" stroke="var(--st-queued)" stroke-width="8"/>';

      var green = done > 0
        ? '<circle cx="60" cy="60" r="52" fill="none" stroke="var(--st-done)" stroke-width="8" stroke-linecap="round"'
          + ' stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + (C * (1 - done)).toFixed(2) + '"'
          + ' transform="rotate(-90 60 60)"/>'
        : "";

      var orange = act > 0
        ? '<circle class="ring-active" cx="60" cy="60" r="52" fill="none" stroke="var(--st-active)" stroke-width="8" stroke-linecap="round"'
          + ' stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + (C * (1 - act)).toFixed(2) + '"'
          + ' transform="rotate(' + (-90 + done * 360).toFixed(2) + ' 60 60)"/>'
        : "";

      var lead = act > 0
        ? '<circle class="ring-ping" cx="' + lx + '" cy="' + ly + '" r="7" fill="none" stroke="var(--st-active)" stroke-width="2"/>'
          + '<circle cx="' + lx + '" cy="' + ly + '" r="4.5" fill="var(--st-active)"/>'
        : "";

      return '<svg class="ring-svg" viewBox="0 0 120 120" width="150" height="150" aria-hidden="true">'
        + track + green + orange + lead + '</svg>';
    }

    function centerText(c){
      if(c.active === 4){                                        // live stage is current
        var sent = (c.live && typeof c.live.sent === "number") ? c.live.sent : 0;
        return '<div class="rc-big num">Ready</div><div class="rc-sub">' + fmt(sent) + ' sent</div>';
      }
      var verb = LD.stages[c.active] ? LD.stages[c.active].verb : "";
      return '<div class="rc-big num">' + c.pct + '%</div><div class="rc-sub">' + esc(verb) + '</div>';
    }

    function dotsRow(c){
      var out = '<div class="lc-stages">';
      for(var i = 0; i < LD.stages.length; i++){
        var st = stageStatus(i, c.active);
        var breathe = st === "active" ? " breathe" : "";
        out += '<button class="lc-stage st-' + st + '" type="button" data-i="' + i + '"'
          + ' aria-label="See ' + esc(LD.stages[i].label) + '">'
          + '<span class="stagedot' + breathe + '"></span>'
          + '<span class="stagelabel">' + esc(LD.stages[i].label) + '</span>'
          + '</button>';
      }
      return out + '</div>';
    }

    /* ---- stage detail bodies --------------------------------------------- */
    function statusMark(st){
      if(st === "done")   return '<span class="dstat done">' + iCheck() + ' Done</span>';
      if(st === "active") return '<span class="dstat active"><span class="dstat-dot breathe"></span> In progress</span>';
      return '<span class="dstat queued">Not started</span>';
    }

    function targetingBody(c, st){
      var t = c.targeting;
      var on = (st === "active") ? " on" : "";
      var sig = t.signal.map(function(x){ return '<span class="chip' + on + '">' + esc(x) + '</span>'; }).join("");
      var roles = t.roles.map(function(x){ return '<span class="chip">' + esc(x) + '</span>'; }).join("");
      var pct = Math.round(t.found / t.target * 100);
      var fillCls = st === "active" ? "bar-fill active breathe-bar" : "bar-fill done";
      return ''
        + '<div class="t-count"><span class="num">' + fmt(t.found) + '</span> of <span class="num">' + fmt(t.target) + '</span> people</div>'
        + '<div class="bar"><div class="' + fillCls + '" style="width:' + pct + '%"></div></div>'
        + '<div class="t-group"><div class="microlabel">Signal</div><div class="chips">' + sig + '</div></div>'
        + '<div class="t-group"><div class="microlabel">Who we email</div><div class="chips">' + roles + '</div></div>';
    }

    function copyBody(c){
      return '<div class="mailframe">'
        + '<div class="mailhead">' + esc(c.copy.subject) + '</div>'
        + '<div class="mailbody">' + esc(c.copy.preview) + '</div>'
        + '</div>';
    }

    function icebreakerBody(c){
      var items = c.icebreaker.samples.map(function(x){ return '<li class="ib-line">' + esc(x) + '</li>'; }).join("");
      return '<ul class="ib-list">' + items + '</ul>';
    }

    function checksBody(c){
      var items = c.checks.items.map(function(it){
        var mark;
        if(it.state === "pass")      mark = '<span class="ck tick">' + iCheck() + '</span>';
        else if(it.state === "run")  mark = '<span class="ck running"><span class="ck-dot breathe"></span></span>';
        else                         mark = '<span class="ck waiting"><span class="ck-dot"></span></span>';
        return '<li class="ck-row">' + mark + '<span class="ck-label">' + esc(it.label) + '</span></li>';
      }).join("");
      return '<ul class="ck-list">' + items + '</ul>';
    }

    function liveBody(c){
      var l = c.live;
      var status = 'Paused in Smartlead · ' + esc(l.status) + ' · ' + fmt(l.sent) + ' sent';
      return '<div class="live-status">' + status + '</div>'
        + '<button class="switch" type="button" role="switch" aria-checked="false" data-switch aria-label="Switch on (preview — sends nothing)">'
        + '<span class="switch-track"><span class="switch-knob"></span></span>'
        + '<span class="switch-label">Switch on</span>'
        + '</button>';
    }

    function queuedBody(s){
      return '<div class="queued-empty">'
        + '<span class="stagedot"></span>'
        + '<div class="qe-title">Not started yet</div>'
        + '<div class="qe-sub">' + esc(s.verb) + '</div>'
        + '</div>';
    }

    function detailHTML(c, i){
      var s = LD.stages[i];
      var st = stageStatus(i, c.active);
      var body;
      if(st === "queued")   body = queuedBody(s);
      else if(i === 0)      body = targetingBody(c, st);
      else if(i === 1)      body = copyBody(c);
      else if(i === 2)      body = icebreakerBody(c);
      else if(i === 3)      body = checksBody(c);
      else                  body = liveBody(c);

      return '<div class="lc-detail-head">'
        + '<button class="backbtn" type="button" data-back aria-label="Back to progress">' + iChevron() + ' Back</button>'
        + '<span class="lc-detail-title">' + esc(s.label) + '</span>'
        + statusMark(st)
        + '</div>'
        + '<div class="lc-detail-body">' + body + '</div>';
    }

    /* ---- card wiring ------------------------------------------------------ */
    function openStage(el, c, i){
      var ring = el.querySelector(".lc-ring");
      var detail = el.querySelector(".lc-detail");
      detail.innerHTML = detailHTML(c, i);
      detail.querySelector("[data-back]").addEventListener("click", function(){ closeStage(el); });
      var sw = detail.querySelector("[data-switch]");
      if(sw){ sw.addEventListener("click", function(){ toggleSwitch(sw); }); }
      ring.hidden = true;
      detail.hidden = false;
      var back = detail.querySelector(".backbtn");
      if(back){ back.focus(); }
    }
    function closeStage(el){
      el.querySelector(".lc-detail").hidden = true;
      var ring = el.querySelector(".lc-ring");
      ring.hidden = false;
      var rb = ring.querySelector(".ring-btn");
      if(rb){ rb.focus(); }
    }
    function toggleSwitch(sw){
      var on = sw.getAttribute("aria-checked") === "true";
      sw.setAttribute("aria-checked", on ? "false" : "true");
      sw.classList.toggle("on", !on);
      var lbl = sw.querySelector(".switch-label");
      if(lbl){ lbl.textContent = on ? "Switch on" : "On"; }
      /* preview only — nothing is sent */
    }

    function buildCard(c){
      var el = document.createElement("article");
      el.className = "lc card";

      var activeLabel = LD.stages[c.active] ? LD.stages[c.active].label : "current stage";

      el.innerHTML = ''
        + '<div class="lc-face lc-ring">'
        +   '<div class="lc-head">'
        +     '<div class="lc-name">' + esc(c.name) + '</div>'
        +     '<div class="lc-caption">' + esc(c.caption) + '</div>'
        +   '</div>'
        +   '<button class="ring-btn" type="button" aria-label="See ' + esc(activeLabel) + '">'
        +     ringSVG(c)
        +     '<span class="ring-center">' + centerText(c) + '</span>'
        +   '</button>'
        +   dotsRow(c)
        +   '<div class="lc-foot">'
        +     '<span class="lc-reach"><span class="num">' + fmt(c.net) + '</span> people</span>'
        +     '<span class="lc-tag">' + esc(c.tag) + '</span>'
        +   '</div>'
        + '</div>'
        + '<div class="lc-face lc-detail" hidden></div>';

      el.querySelector(".ring-btn").addEventListener("click", function(){ openStage(el, c, c.active); });
      var stageBtns = el.querySelectorAll(".lc-stage");
      for(var k = 0; k < stageBtns.length; k++){
        (function(btn){
          btn.addEventListener("click", function(){ openStage(el, c, parseInt(btn.getAttribute("data-i"), 10)); });
        })(stageBtns[k]);
      }
      return el;
    }

    /* ---- mount ------------------------------------------------------------ */
    var grid = document.getElementById("grid");
    LD.campaigns.forEach(function(c){ grid.appendChild(buildCard(c)); });

    var sub = document.getElementById("ldSub");
    if(sub){ sub.textContent = LD.campaigns.length + " campaigns mid-launch · updated " + (LD.updated || ""); }

    var pv = document.getElementById("ldPreview");
    if(pv && !LD.preview){ pv.hidden = true; }

    /* ---- theme ------------------------------------------------------------ */
    var themeBtn = document.getElementById("themeBtn");
    function setTheme(t){
      document.documentElement.dataset.theme = t;
      themeBtn.innerHTML = (t === "dark") ? iSun() : iMoon();
      themeBtn.setAttribute("aria-label", (t === "dark") ? "Switch to light theme" : "Switch to dark theme");
    }
    var theme = "light";
    setTheme(theme);
    themeBtn.addEventListener("click", function(){
      theme = (theme === "light") ? "dark" : "light";
      setTheme(theme);
    });
  })();
  </script>
</body>
</html>
