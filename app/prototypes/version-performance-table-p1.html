<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Version performance — Table T1 · Verdict table · Navreo</title>
<style>
@font-face{font-family:"Acid Grotesk";src:url("../fonts/AcidGrotesk-Normal.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap;}
:root{
  --orange:#FF4D00;--orange-600:#DB4100;--orange-100:#FFE4D6;
  --ink:#14110E;--ink-2:#3A332C;--ink-3:#6B6055;--brown-300:#C0B0A0;
  --cream:#F9F0E7;--cream-50:#FCF7F1;--card:#FFFFFF;--sunken:#F4ECE2;
  --line:#EBE1D5;--line-2:#DCC6AE;--green:#2E7D5B;--green-bg:#E4F1EA;--red:#C2371F;--red-bg:#F8E1DA;--amber:#8F6600;
  --font-sans:"DM Sans","Helvetica Neue",system-ui,sans-serif;
  --font-display:"Acid Grotesk","DM Sans",sans-serif;--font-mono:"JetBrains Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.4;padding:40px 20px}
.wrap{max-width:900px;margin:0 auto}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.h1{font-family:var(--font-display);font-size:26px;letter-spacing:-.01em;margin:2px 0 0}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;gap:16px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:600;color:var(--ink-3);background:var(--sunken);border:1px solid var(--line);padding:5px 11px;border-radius:999px}
.verdict{display:flex;align-items:center;gap:14px;font-family:var(--font-display);font-size:18px;line-height:1.3;background:var(--ink);color:var(--cream);border-radius:12px;padding:15px 20px;margin-bottom:14px}
.verdict .dot{flex:0 0 auto;width:9px;height:9px;border-radius:999px;background:var(--orange);box-shadow:0 0 0 4px rgba(255,77,0,.25)}
.verdict b{color:#FFB98F}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:600px}
thead th{text-align:right;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:14px 14px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
thead th.l{text-align:left}
tbody td{padding:15px 14px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
tbody td.l{text-align:left}
tbody tr:last-child td{border-bottom:none}
.em{font-family:var(--font-display);font-size:15px}
.ver{display:inline-flex;align-items:center;gap:8px}
.vlabel{font-weight:700}
.pill{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.pill.win{background:var(--orange);color:#fff}
.pill.cut{background:var(--red-bg);color:var(--red)}
.pill.keep{background:var(--green-bg);color:var(--green)}
tr.win{background:linear-gradient(90deg,rgba(255,77,0,.06),rgba(255,77,0,0))}
tr.win td:first-child{box-shadow:inset 3px 0 0 var(--orange)}
tr.lose td{color:var(--ink-3)}
.big{font-family:var(--font-display);font-size:17px;color:var(--ink)}
tr.lose .big{color:var(--ink-3)}
.win .big{color:var(--orange-600)}
.sub{font-size:11px;color:var(--brown-300)}
.dotcell{color:var(--brown-300)}
.mtg{font-family:var(--font-display);font-size:17px}
.mtg.has{color:var(--ink)}
.act{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 18px;background:var(--orange-100);flex-wrap:wrap}
.act .txt{font-size:14px;font-weight:600}.act .txt span{display:block;font-size:12px;font-weight:500;color:var(--ink-2);margin-top:2px}
.btn{background:var(--orange);color:#fff;border:none;border-radius:999px;padding:10px 18px;font:600 13px var(--font-sans);cursor:pointer;white-space:nowrap}.btn:hover{background:var(--orange-600)}
.foot{padding:14px 18px;font-size:11.5px;color:var(--ink-3);line-height:1.6;background:var(--cream-50);border-top:1px solid var(--line)}
.foot b{color:var(--ink-2)}
@media(max-width:640px){thead th:nth-child(4),tbody td:nth-child(4){display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="eyebrow">Version performance</div><div class="h1">The table, with the answer on top</div></div>
    <div class="chip">Live from Smartlead · since relaunch</div>
  </div>
  <div class="verdict" id="verdict"><span class="dot"></span><span id="vtext"></span></div>
  <div class="card">
    <div class="tscroll">
    <table>
      <thead><tr>
        <th class="l">Email</th><th class="l">Version</th><th>Sent</th><th>Replies</th>
        <th>Positives</th><th>Warm %</th><th>1 per</th><th>Meetings</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table></div>
    <div class="act" id="act"></div>
    <div class="foot" id="foot"></div>
  </div>
</div>
<script>
const DATA={
  versions:[
    {step:1,label:"A",sent:1269,replies:20,positives:14,bounces:28},
    {step:1,label:"B",sent:1259,replies:18,positives:9,bounces:28},
    {step:2,label:"inline",inline:true,sent:1757,replies:22,positives:13,bounces:11}
  ],
  meetings:{total:16,by_step:{1:13,2:3}}
};
const FLOOR=300;
const perPos=v=>v.positives>0?Math.round(v.sent/v.positives):null;
const warm=v=>v.positives/v.sent*100;
const A=DATA.versions[0],B=DATA.versions[1];
const m1=DATA.meetings.by_step[1]||0,m2=DATA.meetings.by_step[2]||0,mt=DATA.meetings.total;
const winner=warm(A)>=warm(B)?A:B, loser=winner===A?B:A;

const seenStep={};
document.getElementById("tbody").innerHTML=DATA.versions.map(v=>{
  const early=v.sent<FLOOR;
  const isWin=v===winner, isLose=v===loser;
  const cls=isWin?"win":isLose?"lose":"";
  const label=v.inline?"inline":v.label;
  let pill="";
  if(early) pill='<span class="pill cut">too early</span>';
  else if(isWin) pill='<span class="pill win">winner</span>';
  else if(isLose) pill='<span class="pill cut">cut</span>';
  else if(v.inline) pill='<span class="pill keep">keep</span>';
  // meetings on the step's first row; dot for repeats
  const sk=String(v.step); let mcell;
  if(!seenStep[sk]){seenStep[sk]=true;const n=DATA.meetings.by_step[sk]||0;
    mcell=`<span class="mtg ${n?'has':''}">${n||0}</span>`;}
  else mcell='<span class="dotcell" title="Same email step as the row above — calls are counted once per step, not per version">·</span>';
  return `<tr class="${cls}">
    <td class="l"><span class="em">Email ${v.step}</span></td>
    <td class="l"><span class="ver"><span class="vlabel">${label}</span>${pill}</span></td>
    <td><span class="big">${v.sent.toLocaleString()}</span></td>
    <td>${v.replies}</td>
    <td><span class="big">${v.positives}</span></td>
    <td>${early?'<span class="sub">—</span>':warm(v).toFixed(1)+'%'}</td>
    <td>${early?'<span class="sub">early</span>':'1 / '+perPos(v)}</td>
    <td>${mcell}</td>
  </tr>`;
}).join("");

document.getElementById("vtext").innerHTML=`<b>Version ${winner.label}</b> is your best opener — a good reply every <b>${perPos(winner)}</b> emails vs ${loser.label}'s ${perPos(loser)}. Your calls come from <b>Email 1</b> (${m1} of ${mt}).`;
document.getElementById("act").innerHTML=`<div class="txt">Turn ${loser.label} off, send more ${winner.label}.<span>Same audience, same fair test — ${winner.label} just converts better.</span></div><button class="btn">Do this</button>`;
document.getElementById("foot").innerHTML=`<b>Warm %</b> = good replies ÷ sent (Smartlead's interested mark). <b>1 per</b> = emails needed for one good reply — lower is better. <b>Meetings</b> sit on the email step, not the version: Email 1's ${m1} calls come from A and B together, so we count them once on the step and don't split them by guess. Numbers reset when the sequence is re-saved — read as since relaunch.`;
</script>
</body>
</html>
