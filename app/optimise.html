<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optimisation cockpit · Navreo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family:"Acid Grotesk";
    src:url("../fonts/AcidGrotesk-Normal.otf") format("opentype");
    font-weight:400; font-style:normal; font-display:swap;
  }
  /* Tokens mirror campaigns.html (the detailed campaign view) so the two
     pages read as one product. The cockpit-only pin keeps its orange accents. */
  :root{
    --nav-white:#FFFFFF; --nav-ink:#14110E; --nav-ink-2:#3A332C; --nav-ink-3:#6B6055;
    --nav-orange:#FF4D00; --nav-orange-100:#FFE4D6; --nav-orange-600:#DB4100; --orange-700:#A83100;
    --info:#2563EB;
    --sunken:#F7F7F6; --neutral-warm:#C9C4BC; --track-bg:#EFEDEA;
    --bg:var(--nav-white); --bg-elevated:var(--nav-white);
    --fg:var(--nav-ink); --fg-muted:var(--nav-ink-2); --fg-subtle:var(--nav-ink-3);
    --success:#2E7D5B; --success-bg:#E2F1E9; --success-bd:rgba(46,125,91,0.32);
    --warning:#8F6600; --warning-bg:#F8EAC4; --warning-bd:rgba(143,102,0,0.34);
    --danger:#C2371F;  --danger-bg:#F7DCD5;  --danger-bd:rgba(194,55,31,0.34);
    --border:#ECECEA; --border-strong:#DDDDDA;
    --chip-active-bg:var(--nav-ink); --chip-active-fg:var(--nav-white);
    --cream:#F9F0E7;
    --font-sans:"DM Sans","Helvetica Neue",system-ui,sans-serif;
    --font-display:"Acid Grotesk","DM Sans",sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",monospace;
    --r-md:8px; --r-lg:12px; --r-pill:999px;
    --ease-out:cubic-bezier(0.2,0.7,0.2,1); --dur-2:180ms;
    --radius:14px; --focus:0 0 0 3px rgba(255,77,0,.32);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--font-sans); background:var(--bg); color:var(--fg);
    line-height:1.5; letter-spacing:-.015em; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}
  .tnum{font-variant-numeric:tabular-nums}
  .wrap{max-width:940px; margin:0 auto; padding:32px clamp(18px,4vw,40px) 96px}

  /* ── dashboard header ─────────────────────────────── */
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--orange-700)}
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin:10px 0 4px}
  h1{font-family:var(--font-display);font-weight:400;font-size:30px;letter-spacing:-.03em;line-height:1.1}
  .head-sub{font-size:13px;color:var(--fg-subtle);margin-top:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
  .pill .dot{width:6px;height:6px;border-radius:999px;background:currentColor}
  .pill.g{background:var(--success-bg);color:#195C3F}
  .pill.n{background:#F2F2F0;color:var(--fg-muted)}
  a.slink{color:var(--fg-subtle);text-decoration:none;font-size:12.5px;font-weight:500;border-bottom:1px solid var(--border-strong)}
  a.slink:hover{color:var(--fg)}

  /* ── the pinned reminder (sticky, on every tab) ──── */
  .pinwrap{position:sticky;top:0;z-index:40;padding-top:14px;background:linear-gradient(var(--bg) 72%,rgba(255,255,255,0))}
  .pin{
    border:1px solid var(--nav-orange-100); border-left:4px solid var(--nav-orange);
    background:linear-gradient(180deg,#FFF9F5,#FFFFFF);
    border-radius:var(--radius); padding:18px 20px;
    box-shadow:0 8px 24px rgba(255,77,0,.07);
  }
  .pin.done{border-color:var(--success-bd);border-left-color:var(--success);background:linear-gradient(180deg,#F3FAF6,#fff);box-shadow:none}
  .pin-top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .pin-kick{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--orange-700)}
  .pin.done .pin-kick{color:var(--success)}
  .pin-min{margin-left:auto;background:none;border:1px solid var(--border-strong);border-radius:8px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--fg-subtle);flex:none}
  .pin-min:hover{background:#fff;color:var(--fg)}
  .pin-min svg{width:16px;height:16px;transition:transform .2s}
  /* minimised: collapse to a slim one-line bar so there's room to navigate */
  .pin.collapsed{padding:12px 20px}
  .pin.collapsed .pin-why,.pin.collapsed .pin-proof,.pin.collapsed .pin-note,.pin.collapsed .pin-foot{display:none}
  .pin.collapsed .pin-top{margin-bottom:4px}
  .pin.collapsed .pin-job{font-size:14.5px;margin-top:2px}
  .pin.collapsed .pin-min svg{transform:rotate(180deg)}
  .pin-job{font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.35;color:var(--fg)}
  .pin-why{font-size:14px;color:var(--fg-muted);margin-top:8px;max-width:64ch}
  .pin-note{font-size:12.5px;color:var(--fg-subtle);margin-top:12px;display:flex;align-items:center;gap:8px}
  .pin-note svg{width:14px;height:14px;flex:none;color:var(--fg-subtle)}
  .pin-proof{margin-top:15px;padding-top:15px;border-top:1px solid var(--nav-orange-100)}
  .pin.done .pin-proof{border-top-color:var(--success-bd)}
  .pin-foot{display:flex;justify-content:flex-end;margin-top:16px}
  /* glanceable proof: reply rate by version (unique to the pin — no repeated raw stats) */
  .vbars{display:flex;flex-direction:column;gap:8px;max-width:480px}
  .vbars-h{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-subtle);margin-bottom:2px}
  .vbar{display:flex;align-items:center;gap:10px;font-size:12.5px}
  .vb-l{width:74px;color:var(--fg-muted);font-weight:500}
  .vb-l b{font-weight:600}
  .vb-t{flex:1;height:9px;border-radius:999px;background:#EEE8E1;overflow:hidden}
  .vb-f{height:100%;border-radius:999px;background:#CDBFB0;transition:width .5s cubic-bezier(.2,.8,.3,1)}
  .vb-f.win{background:var(--success)}
  .vb-v{width:64px;text-align:right;font-variant-numeric:tabular-nums;color:var(--fg-subtle);font-weight:500}

  .btn{
    border:1px solid var(--border-strong);background:transparent;color:var(--fg);
    border-radius:999px;padding:11px 20px;font:600 14px var(--font-sans);letter-spacing:-.005em;
    cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
  }
  .btn:hover{background:var(--sunken)}
  .btn:focus-visible{outline:none;box-shadow:var(--focus)}
  .btn svg{width:16px;height:16px;flex:none}
  .btn.primary{background:var(--nav-orange);border-color:var(--nav-orange);color:var(--cream)}
  .btn.primary:hover{background:var(--nav-orange-600)}
  .btn.done{background:var(--success);border-color:var(--success);color:#fff;cursor:default}
  .btn.done:hover{background:var(--success)}

  /* ── tabs (campaign-detail look) ─────────────────── */
  .campaign-tabs{display:flex;gap:22px;border-bottom:1px solid var(--border);margin:22px 0 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .campaign-tab{background:none;border:none;padding:12px 2px 11px;font-size:0.86rem;font-weight:600;color:var(--fg-subtle);
    border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;cursor:pointer}
  .campaign-tab:hover{color:var(--fg)}
  .campaign-tab.is-active{color:var(--fg);border-bottom-color:var(--nav-orange)}
  .tab-count{font-variant-numeric:tabular-nums;color:var(--fg-subtle);font-weight:500}
  .campaign-page-body{margin-top:22px}

  /* ── cards (campaign-detail look) ─────────────────── */
  .ov-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px 22px 22px;margin-bottom:18px}
  .ov-card:last-child{margin-bottom:0}
  .card-title{font-family:var(--font-display);font-weight:400;font-size:1.05rem;letter-spacing:-.01em;color:var(--fg)}
  .card-subtitle{font-size:0.78rem;color:var(--fg-subtle);margin-top:3px}
  .lw-loading{padding:38px 0;text-align:center;color:var(--fg-subtle);font-size:14px}
  .ring-caption{font-size:0.55rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--fg-subtle);white-space:nowrap}
  .sample-footer{margin-top:10px;font-size:0.76rem;color:var(--fg-subtle)}
  a.action-link{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--border-strong);
    border-radius:var(--r-pill);background:var(--bg);color:var(--fg-muted);font-size:0.78rem;font-weight:600;
    cursor:pointer;white-space:nowrap;text-decoration:none;
    transition:background var(--dur-2) var(--ease-out),border-color var(--dur-2) var(--ease-out),color var(--dur-2) var(--ease-out)}
  a.action-link:hover{background:var(--sunken);border-color:var(--nav-ink-3);color:var(--fg)}
  a.action-link--bare{border:none;background:none;padding:0;border-radius:0;color:var(--nav-orange-600)}
  a.action-link--bare:hover{background:none;text-decoration:underline;color:var(--nav-orange-600)}

  /* ── The glance, P5 "clean scoreboard" (matches campaigns.html) ── */
  .gv-head{display:flex;align-items:baseline;gap:8px}
  .gv-info{display:inline}
  .gv-info>summary{list-style:none;cursor:pointer;width:16px;height:16px;border-radius:999px;border:1px solid var(--border-strong);color:var(--fg-subtle);font-size:0.62rem;font-style:italic;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
  .gv-info>summary::-webkit-details-marker{display:none}
  .gv-info[open]{display:block;margin-top:8px}
  .gv-info p{margin:0;font-size:0.78rem;color:var(--fg-subtle);line-height:1.5;max-width:68ch}
  .gv-pill{display:inline-flex;align-items:center;gap:6px;font-size:0.74rem;font-weight:700;padding:4px 11px;border-radius:999px;margin-top:16px}
  .gv-pill::before{content:"";width:7px;height:7px;border-radius:999px;background:currentColor}
  .gv-pill.gv-good{background:var(--success-bg);color:var(--success)}
  .gv-pill.gv-avg{background:var(--warning-bg);color:var(--warning)}
  .gv-pill.gv-bad{background:var(--danger-bg);color:var(--danger)}
  .gv-pill.gv-neutral{background:var(--sunken);color:var(--fg-subtle)}
  .gv-card .gv-word{font-family:var(--font-display);font-weight:400;font-size:clamp(1.6rem,3.4vw,2.1rem);letter-spacing:-.02em;line-height:1.05;margin:18px 0 9px}
  .gv-word.gv-good{color:var(--success)}
  .gv-word.gv-avg{color:var(--warning)}
  .gv-word.gv-bad{color:var(--danger)}
  .gv-word.gv-neutral{color:var(--fg)}
  .gv-sub{font-size:0.98rem;color:var(--fg-muted);margin:0}
  .gv-sub b{color:inherit;font-family:var(--font-display);font-weight:400}
  .gv-quad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:end;margin-top:26px}
  .gv-n{font-family:var(--font-display);font-weight:400;font-size:clamp(1.9rem,4.2vw,2.5rem);letter-spacing:-.02em;line-height:1;color:var(--fg)}
  .gv-n.gv-good{color:var(--success)}
  .gv-n.gv-avg{color:var(--warning)}
  .gv-n.gv-bad{color:var(--danger)}
  .gv-c{font-family:var(--font-display);font-weight:400;font-size:1.05rem;color:var(--fg-subtle);margin-left:7px}
  .gv-l{display:block;font-size:0.76rem;color:var(--fg-subtle);margin-top:5px}
  .gv-aud{margin-top:22px;padding-top:18px;border-top:1px solid var(--border)}
  .gv-audh{display:flex;justify-content:space-between;font-size:0.84rem;color:var(--fg-subtle);margin-bottom:9px}
  .gv-audh b{color:var(--fg);font-family:var(--font-display);font-weight:400}
  .gv-stack{height:12px;border-radius:999px;overflow:hidden;display:flex;background:var(--track-bg)}
  .gv-stack i{height:100%;display:block}
  .gv-legend{display:flex;gap:18px;margin-top:11px;font-size:0.78rem;color:var(--fg-subtle);flex-wrap:wrap}
  .gv-legend span{display:inline-flex;align-items:center;gap:7px}
  .gv-legend i{width:10px;height:10px;border-radius:3px}
  .gv-legend b{color:var(--fg);font-family:var(--font-display);font-weight:400}
  @media (max-width:640px){.gv-quad{grid-template-columns:repeat(2,1fr);gap:16px}}

  /* ── Messaging: version performance table (campaign-detail look) ── */
  .leads-table-wrap{overflow-x:auto;margin-top:14px}
  table.leads-table{width:100%;border-collapse:collapse;font-size:0.82rem;min-width:480px}
  table.leads-table th,table.leads-table td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border)}
  table.leads-table th{font-size:0.65rem;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-subtle);font-weight:600}
  table.leads-table tbody tr:last-child td{border-bottom:none}
  table.version-perf-table th.tnum,table.version-perf-table td.tnum{text-align:right}
  table.version-perf-table tr.vp-band td{background:var(--sunken);font-size:0.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-muted);padding-top:7px;padding-bottom:7px}
  table.version-perf-table tr.vp-band td.vp-l{text-align:left}
  table.version-perf-table tr.vp-band .ring-caption{text-transform:none;letter-spacing:0}
  .vp-best{display:inline-block;margin-left:6px;font-size:0.55rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--nav-orange);padding:1px 6px;border-radius:999px;vertical-align:1px}
  .vp-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:7px;vertical-align:middle}
  .vp-dot--on{background:#2E7D5B}
  .vp-dot--off{background:#C0B0A0}
  .vp-combos{margin-top:22px}
  .vp-combos-h{font-size:0.8rem;font-weight:600;color:var(--fg);margin-bottom:2px}
  .vp-combos-h .ring-caption{text-transform:none;letter-spacing:0;font-weight:500}
  table.version-perf-table tr.vp-win{background:linear-gradient(90deg,rgba(255,77,0,0.06),transparent)}
  table.version-perf-table tr.vp-win td:first-child{box-shadow:inset 3px 0 0 var(--nav-orange)}
  .vp-sib{text-transform:none;letter-spacing:0;opacity:.75}

  /* ── Messaging: "the sequence" Smartlead-editor-like step rail ── */
  .seq-rail{margin-top:16px;display:flex;flex-direction:column}
  .seq-step{border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px 18px;background:var(--sunken)}
  .seq-step-header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:14px}
  .seq-step-title{font-family:var(--font-display);font-weight:400;font-size:1rem;letter-spacing:-.01em;color:var(--fg)}
  .seq-version-pills{display:flex;flex-wrap:wrap;gap:6px}
  .seq-pill{min-width:30px;padding:5px 10px;border-radius:var(--r-pill);border:1px solid var(--border-strong);background:var(--bg);
    color:var(--fg-muted);font-size:0.76rem;font-weight:700;text-align:center;cursor:pointer;
    transition:background var(--dur-2) var(--ease-out),color var(--dur-2) var(--ease-out),border-color var(--dur-2) var(--ease-out)}
  .seq-pill:hover{border-color:var(--nav-ink-3);color:var(--fg)}
  .seq-pill.is-active{background:var(--chip-active-bg);border-color:var(--chip-active-bg);color:var(--chip-active-fg)}
  .seq-pill--off{opacity:.66;font-style:italic}
  .seq-pill--del{opacity:.5;text-decoration:line-through}
  .seq-pill--off.is-active,.seq-pill--del.is-active{opacity:1}
  .seq-fail{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
  .seq-connector{align-self:flex-start;margin:4px 0 4px 18px;padding:6px 0 6px 16px;border-left:2px dashed var(--border-strong);
    font-size:0.74rem;font-weight:600;color:var(--fg-subtle);display:flex;align-items:center}
  .seq-subject{font-size:0.9rem;color:var(--fg);margin:0 0 10px}
  .seq-subject strong{font-weight:700}
  .seq-subject-none{color:var(--fg-subtle);font-weight:400;font-style:italic}
  .seq-body-scroll{max-height:260px;overflow-y:auto;font-size:0.85rem;line-height:1.6;color:var(--fg-muted);
    background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px}
  .seq-body-scroll p{margin:0 0 10px}
  .seq-body-scroll p:last-child{margin-bottom:0}
  .mergetag{font-family:var(--font-mono);font-size:0.85em;color:var(--fg-subtle);background:var(--track-bg);padding:1px 5px;border-radius:4px;white-space:nowrap}
  @media (max-width:480px){
    .seq-step{padding:14px 14px 16px}
    .seq-body-scroll{max-height:220px}
    .mergetag{white-space:normal}
  }

  /* ── leads tab: the leads hub, mirrored from the campaign detail view ── */
  .section-label{font-size:0.68rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--fg-subtle);margin-bottom:10px}
  .sources-section{margin-bottom:22px}
  .source-list-cards{display:flex;flex-direction:column;gap:8px;margin-top:2px}
  .source-list-card--link{text-decoration:none;cursor:pointer}
  .source-list-card--link:hover{border-color:var(--nav-ink-3)}
  .source-list-card{display:flex;align-items:baseline;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;
    background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--r-lg);padding:13px 16px}
  .source-list-name{font-weight:600;color:var(--fg);font-size:0.9rem}
  .source-list-meta{font-size:0.78rem;color:var(--fg-subtle);white-space:nowrap}
  .sig-row{display:block}
  .sig-row-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .sig-main{min-width:0;flex:1 1 auto}
  .sig-chip{font-size:0.66rem;font-weight:700;letter-spacing:0.08em;padding:3px 8px;border-radius:6px;text-transform:uppercase;background:#FFE4D6;color:#C23D00}
  .sig-chip--fixed{background:var(--border-strong);color:var(--fg-subtle)}
  .sig-tgl{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:0.76rem;font-weight:600;color:var(--success);position:relative}
  .sig-tgl input{position:absolute;opacity:0}
  .sig-tgl .sig-knob{width:34px;height:20px;border-radius:999px;background:var(--border-strong);position:relative;transition:background 0.15s}
  .sig-tgl .sig-knob::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left 0.15s}
  .sig-tgl input:checked + .sig-knob{background:var(--success)}
  .sig-tgl input:checked + .sig-knob::after{left:16px}
  .sig-primary{background:var(--nav-orange) !important;border-color:var(--nav-orange) !important;color:#fff !important}
  .sig-body{border-top:1px solid var(--border);margin-top:12px;padding-top:12px;width:100%}
  .sig-ice{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .sig-ice input[type="text"]{flex:1 1 240px;font-family:inherit;font-size:0.82rem;padding:9px 12px;
    border:1px solid var(--border-strong);border-radius:9px;color:var(--fg-muted);background:var(--bg)}
  .sources-empty{padding:18px;text-align:center;border:1px dashed var(--border-strong);border-radius:var(--r-lg);color:var(--fg-subtle);font-size:0.85rem}
  .action-state-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--border-strong);
    border-radius:var(--r-pill);background:var(--bg);color:var(--fg-muted);font-size:0.78rem;font-weight:600;
    cursor:pointer;white-space:nowrap;font-family:inherit;
    transition:background var(--dur-2) var(--ease-out),border-color var(--dur-2) var(--ease-out),color var(--dur-2) var(--ease-out)}
  .action-state-btn:hover{background:var(--sunken);border-color:var(--nav-ink-3);color:var(--fg)}
  button.action-link{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--border-strong);
    border-radius:var(--r-pill);background:var(--bg);color:var(--fg-muted);font-size:0.78rem;font-weight:600;
    cursor:pointer;white-space:nowrap;font-family:inherit;
    transition:background var(--dur-2) var(--ease-out),border-color var(--dur-2) var(--ease-out),color var(--dur-2) var(--ease-out)}
  button.action-link:hover{background:var(--sunken);border-color:var(--nav-ink-3);color:var(--fg)}

  /* Live-audience grid: lists.html's datagrid, verbatim look (tokens are
     lists.html/navreo.css literals so the grids render identically). */

  .cl-grid .gridwrap{position:relative;border:1px solid var(--line);border-radius:12px;overflow:auto;max-width:100%;max-height:68vh}
  .cl-grid table.datagrid{border-collapse:collapse;font-size:12.5px;width:max-content;min-width:100%;font-family:var(--gfont-sans);letter-spacing:-0.015em;line-height:1.45}
  .cl-grid .datagrid th{position:sticky;top:0;background:var(--bg-sunken);z-index:5;text-align:left;padding:0;border-bottom:1px solid var(--line-2)}
  .cl-grid .datagrid th .thwrap{display:flex;align-items:center;gap:5px;padding:8px 10px;cursor:pointer;user-select:none;white-space:nowrap}
  .cl-grid .datagrid th .thwrap:hover{background:var(--line)}
  .cl-grid .datagrid th .thlbl{font-size:11px;font-weight:500;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-3)}
  .cl-grid .datagrid th .sortarrow{display:inline-flex;align-items:center;color:var(--orange-700);opacity:0;transition:opacity .12s}

  .cl-grid .datagrid th .filt-btn.active{color:var(--orange-700)}
  .cl-grid .datagrid th.chkcol,.cl-grid .datagrid td.chkcol{position:sticky;left:0;background:var(--bg-sunken);text-align:center;padding:6px 4px;width:32px;z-index:6}

  .cl-grid .datagrid th.gutter,.cl-grid .datagrid td.gutter{position:sticky;left:32px;background:var(--bg-sunken);color:var(--ink-3);text-align:right;padding:6px 10px;font-family:var(--gfont-mono);font-size:11px;z-index:4}

  .cl-grid .datagrid td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}

  .clg-popover{position:absolute;z-index:60;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(20,17,14,.14);min-width:200px;padding:6px;font-family:var(--gfont-sans)}
  .clg-popover.filtinput-pop{padding:8px}
  .clg-popover.filtinput-pop input{width:180px;border:1px solid var(--line-2);border-radius:7px;padding:6px 9px;font-size:12.5px;font-family:inherit}
  .clg-popover.filtinput-pop .row{display:flex;gap:6px;margin-top:8px}
  .clg-popover.colpop{max-height:320px;overflow-y:auto}
  .clg-popover.colpop label{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:13px;border-radius:7px;cursor:pointer}
  .clg-popover.colpop label:hover{background:var(--bg-sunken)}

  .clg-popover.sortpop .p-field:last-child{margin-bottom:0}
  .clg-popover.sortpop label{display:block;font-size:11px;color:var(--ink-3);font-weight:500;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
  .clg-popover.sortpop select{width:100%;border:1px solid var(--line-2);border-radius:7px;padding:6px 9px;font-size:12.5px;font-family:inherit;background:transparent;color:var(--ink)}
  .clg-popover.sortpop .dirtoggle{display:flex;gap:6px}
  .clg-popover.sortpop .dirtoggle button{flex:1;border:1px solid var(--line-2);background:transparent;border-radius:7px;padding:6px 0;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
  .clg-popover.sortpop .dirtoggle button.on{background:var(--ink);border-color:var(--ink);color:var(--cream)}

    padding:18px 20px;font-family:inherit;font-size:14px;font-weight:700;color:var(--fg-subtle);
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;
    margin-top:12px;transition:border-color .15s,color .15s,background .15s}
  .add-tile:hover{border-color:var(--nav-orange);color:var(--nav-orange-600);background:#FFF8F4}
  .add-tile .plus{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--nav-orange);
    color:#fff;align-items:center;justify-content:center;font-size:15px;font-weight:700;
    transition:transform .15s;flex:0 0 auto}
  .add-tile:hover .plus{transform:scale(1.08)}
  .add-tile.copied{border-style:solid;border-color:#2F9E44;color:#195C3F;background:#E2F1E9}
  .add-tile.copied .plus{background:#2F9E44}

  .hidden{display:none}
  /* toast */
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);
    background:var(--nav-ink);color:var(--cream);font-size:13px;font-weight:500;padding:12px 20px;
    border-radius:999px;transition:transform .28s cubic-bezier(.2,.9,.3,1.2);z-index:90;box-shadow:0 10px 30px rgba(20,17,14,.25)}
  .toast.on{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app"><div class="wrap" style="padding-top:60px"><p class="card-subtitle">Loading the optimisation…</p></div></div>
<script>

const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (n)=> (n==null||isNaN(n))?"—":Number(n).toLocaleString();
const pct = (n,d,p)=> d? +(100*n/d).toFixed(p==null?1:p) : null;
const ratio = (sent,rep)=> rep>0 ? ("1 in "+Math.round(sent/rep).toLocaleString()) : "—";
const qp = new URLSearchParams(location.search);
const CID = qp.get("c"); const NID = qp.get("nid");
const getJSON = (u)=>fetch(u,{cache:"no-store"}).then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); });
/* one-page cockpit: tiny caches so tab flips don't refetch */
const CACHE = { messaging:null, seqcopy:null, detail:null, live:null,
                messagingBusy:false, seqcopyBusy:false };

function pickPrimary(rows){
  if(NID){ const m=rows.find(r=>String(r.id)===String(NID)); if(m) return m; }
  const rank = {High:3, Medium:2, Low:1};
  const actionable = rows.filter(r=> (r.finding_type||"")!=="performing");
  const pool = actionable.length?actionable:rows;
  // prefer a row that carries per-variant data, then priority, then newest
  return pool.slice().sort((a,b)=>{
    const av=(a.variants&&a.variants.length)?1:0, bv=(b.variants&&b.variants.length)?1:0;
    if(av!==bv) return bv-av;
    const ap=rank[a.priority]||0, bp=rank[b.priority]||0;
    if(ap!==bp) return bp-ap;
    return String(b.created_at||"").localeCompare(String(a.created_at||""));
  })[0];
}

/* Display-only merge-tag cleanup (house rule: never show raw tags).
   "{{first_name}}" -> "First name", and leftover BARE snake_case artifacts
   ("Hi first_name, ...") collapse the same way. Used ONLY when painting
   variant names/labels on this page - never on any payload sent anywhere
   (the only outbound call here is markDone's status PATCH). */
function humanField(f){
  const t=String(f||"").replace(/[{}]/g,"").trim().replace(/_+/g," ").trim();
  return t ? t.charAt(0).toUpperCase()+t.slice(1).toLowerCase() : "";
}
function humanTags(s){
  return String(s==null?"":s)
    .replace(/\{\{\s*([^{}]+?)\s*\}\}/g,(m,f)=>humanField(f))
    .replace(/\b([a-z][a-z0-9]*(?:_[a-z0-9]+)+)\b/g,(m,f)=>humanField(f));
}

function cleanWhy(detail){
  // drop the header line + "Priority:" line, keep the bullet sentences as plain prose
  const lines=(detail||"").split(/\n+/).map(s=>s.trim()).filter(Boolean)
     .filter(l=>!/^priority:/i.test(l) && !/\|\s*[\d,]+\s+sent/i.test(l));
  const bullets=lines.filter(l=>l.startsWith("-")).map(l=>l.replace(/^-\s*/,""));
  const txt=(bullets.length?bullets:lines).join(" ");
  return esc(txt);
}

function barsFrom(variants){
  const vs=(variants||[]).map(v=>({label:v.angle||"", rate: v.sent>0? v.replies/v.sent:0,
     sent:v.sent, rep:v.replies, win:(v.flags||[]).includes("winner")}))
     .filter(v=>v.sent>0).sort((a,b)=>b.rate-a.rate).slice(0,3);
  if(!vs.length) return "";
  const max=vs[0].rate||1;
  const shortLabel=(a,i)=>{ const s=humanTags((a||"").split("/")[0].trim()); return s? s.slice(0,26) : ("Version "+String.fromCharCode(65+i)); };
  const rows=vs.map((v,i)=>`<div class="vbar"><span class="vb-l">${v.win?("<b>"+esc(shortLabel(v.label,i))+"</b>"):esc(shortLabel(v.label,i))}</span>`
     +`<div class="vb-t"><div class="vb-f${v.win?" win":""}" style="width:${Math.max(8,Math.round(v.rate/max*100))}%"></div></div>`
     +`<span class="vb-v">${esc(ratio(v.sent,v.rep))}</span></div>`).join("");
  return `<div class="pin-proof"><div class="vbars"><div class="vbars-h">Which version is winning · reply rate · higher = better</div>${rows}</div></div>`;
}

/* ── Overview: the glance card (P5 clean scoreboard, mirrors campaigns.html
   verdict tiering — sends-per-positive: <=1,500 good / 1,500-2,500 average /
   >2,500 poor) ─────────────────────────────────────────────────────────── */
function glanceHTML(r){
  const sent=r.sent||0, rep=r.replied||0, pos=r.positive||0, mtg=r.meetings||0;
  const replyPct = sent? pct(rep,sent,1) : null;
  const gSpp = pos ? Math.round(sent/pos) : null;
  const gPosPct = (pos && rep) ? pct(pos,rep,1) : null;
  let gClass,gWord,gPill,gSub;
  if(!sent){
    gClass="gv-neutral"; gWord="Not sending yet."; gPill="Draft";
    gSub="No emails have gone out on this campaign yet.";
  }else if(!pos){
    gClass="gv-bad"; gWord="Nothing landed yet."; gPill="No positives";
    gSub="No positives yet from "+fmt(sent)+" emails sent.";
  }else if(gSpp<=1500){
    gClass="gv-good"; gWord="It’s working."; gPill="Healthy";
    gSub="1 positive every <b>"+fmt(gSpp)+" emails</b> — good, under the 1,500 line.";
  }else if(gSpp<=2500){
    gClass="gv-avg"; gWord="Ticking along."; gPill="Average";
    gSub="1 positive every <b>"+fmt(gSpp)+" emails</b> — average (1,500–2,500).";
  }else{
    gClass="gv-bad"; gWord="Underperforming."; gPill="Needs work";
    gSub="1 positive every <b>"+fmt(gSpp)+" emails</b> — high, over the 2,500 line.";
  }
  const gSync="Campaign-to-date, from the daily Smartlead sync. Positives = Smartlead’s interested mark. "
    +"Under 1,500 emails per positive is good, 1,500–2,500 average, above that poor.";
  return '<div class="ov-card gv-card"><div class="gv-head"><div class="card-title" style="margin:0">The campaign at a glance</div>'
    +'<details class="gv-info"><summary aria-label="about these numbers">i</summary><p>'+gSync+'</p></details></div>'
    +'<span class="gv-pill '+gClass+'">'+esc(gPill)+'</span>'
    +'<p class="gv-word '+gClass+'">'+gWord+'</p>'
    +'<p class="gv-sub">'+gSub+'</p>'
    +'<div class="gv-quad">'
    +'<div class="gv-q"><span class="gv-n tnum">'+fmt(sent)+'</span><span class="gv-l">Sent</span></div>'
    +'<div class="gv-q"><span class="gv-n tnum">'+(replyPct!=null? replyPct+"%" : fmt(rep))+'</span>'+(replyPct!=null?'<span class="gv-c tnum">'+fmt(rep)+'</span>':"")+'<span class="gv-l">Replied</span></div>'
    +'<div class="gv-q"><span class="gv-n tnum '+gClass+'">'+fmt(pos)+'</span>'+(gPosPct!=null?'<span class="gv-c tnum">'+gPosPct+'%</span>':"")+'<span class="gv-l">Positives</span></div>'
    +'<div class="gv-q"><span class="gv-n tnum'+(mtg>0?" gv-good":"")+'">'+fmt(mtg)+'</span><span class="gv-l">Meetings</span></div>'
    +'</div>'
    +'<div class="gv-aud" id="ovm-status"><p class="lw-loading">Loading the audience&hellip;</p></div>'
    +'</div>';
}

/* Audience split: exact platform split first (/api/cockpit/live-status),
   contact-record estimate as the honest fallback — same sources and same
   never-silent rules as the campaign page. */
function paintAudience(){
  const ov=$("ovm-status");
  if(!ov) return;
  const live=(CACHE.live||{}).lead_stats;
  const d=CACHE.detail||{};
  const liveTried = CACHE.liveTried===true;
  const A_DONE="#2E7D5B", A_PROG="#A7CDB8", A_NOT="#D9D6D1", A_BLK="var(--danger)", A_STOP="#8A8681";
  let s=null, note="";
  if(live && live.total){
    s={ done:live.completed||0, prog:(live.inprogress||0)+(live.paused||0),
        not:live.notStarted||0, blk:live.blocked||0, stop:live.stopped||0, tot:live.total };
  }else if((d.lead_statuses||[]).length){
    const aBy={}; (d.lead_statuses||[]).forEach(r=>{ aBy[r.k]=(aBy[r.k]||0)+(r.n||0); });
    const done=aBy.COMPLETED||0, prog=(aBy.INPROGRESS||0)+(aBy.STARTED||0)+(aBy.PAUSED||0), blk=aBy.BLOCKED||0;
    const acc=done+prog+blk;
    const base=Math.max(acc,(d.leads||{}).total||0);
    s={ done:done, prog:prog, not:Math.max(0,base-acc), blk:blk, stop:0, tot:base };
    note = liveTried
      ? '<p class="card-subtitle" style="margin-top:6px">Contact-record estimate &mdash; the platform\'s exact split couldn\'t be checked right now (includes leads since removed from the platform).</p>'
      : '<p class="card-subtitle" style="margin-top:6px">Contact-record estimate &mdash; checking the platform\'s exact split&hellip;</p>';
  }else if(liveTried && CACHE.detailTried){
    ov.innerHTML='<p class="card-subtitle">The audience split couldn\'t be loaded right now. It will refresh on the next visit.</p>';
    return;
  }else return; /* still loading — a source is yet to report */
  const pc=(n)=> s.tot? (100*n/s.tot).toFixed(1) : "0";
  const seg=(n,col)=> n>0? '<i style="width:'+pc(n)+'%;background:'+col+'"></i>' : "";
  const leg=(n,col,lab)=> n>0? '<span><i style="background:'+col+'"></i>'+lab+' <b class="tnum">'+fmt(n)+'</b></span>' : "";
  const compPct= s.tot? Math.round(100*s.done/s.tot) : 0;
  ov.innerHTML='<div class="gv-audh"><span>Who we\'re working &mdash; <b class="tnum">'+fmt(s.tot)+'</b> people</span><span><b class="tnum">'+compPct+'%</b> completed</span></div>'
    +'<div class="gv-stack">'+seg(s.done,A_DONE)+seg(s.prog,A_PROG)+seg(s.not,A_NOT)+seg(s.stop,A_STOP)+seg(s.blk,A_BLK)+'</div>'
    +'<div class="gv-legend">'+leg(s.done,A_DONE,"Completed")+leg(s.prog,A_PROG,"In progress")+leg(s.not,A_NOT,"Not started")+leg(s.stop,A_STOP,"Stopped")+leg(s.blk,A_BLK,"Blocked")+'</div>'+note;
}
function hydrateAudience(campaignId){
  getJSON("/api/cockpit/live-status?ids="+encodeURIComponent(campaignId))
    .then(r=>{ CACHE.liveTried=true; CACHE.live=((r||{}).campaigns||{})[campaignId]||null; paintAudience(); })
    .catch(()=>{ CACHE.liveTried=true; paintAudience(); });
  getJSON("/api/cockpit/campaign-detail?id="+encodeURIComponent(campaignId))
    .then(d=>{ CACHE.detailTried=true; if(d && !d.degraded) CACHE.detail=d; paintAudience(); paintSources(); })
    .catch(()=>{ CACHE.detailTried=true; paintAudience(); paintSources(); });
}

/* ── Messaging: version performance (ported from the campaign page, including
   the variant-action seams: live on/off toggle + scale-the-winner. Every write
   goes through the same /variant-action endpoint, typed-confirm gated.) ───── */
function versionTableHTML(versions, note, meetings, combinations, cid){
  const hasMeet=!!(meetings&&(meetings.by_step||meetings.by_variant));
  const byVar=(meetings&&meetings.by_variant)||{};
  const clusters=(meetings&&meetings.clusters)||{};
  function rateSpan(n,d){ return (d&&n)? ' <span class="ring-caption">'+(n/d*100).toFixed(1)+'%</span>':''; }
  function perPos(v){ return (v.positives>0&&v.sent)? fmt(Math.round(v.sent/v.positives)) : '<span class="ring-caption">'+(v.sent<300?'early':'—')+'</span>'; }
  const repOf={}, membersOf={}; let hasGroup=false;
  Object.keys(clusters).forEach(sk=>{
    (clusters[sk]||[]).forEach(cl=>{
      membersOf[sk+'|'+cl.rep]=cl.labels||[cl.rep];
      if((cl.labels||[]).length>1) hasGroup=true;
      (cl.labels||[cl.rep]).forEach(l=>{ repOf[sk+'|'+l]=cl.rep; });
    });
  });
  const sentByRep={};
  versions.forEach(v=>{
    if(v.inline||v.label==null) return;
    const rep=repOf[String(v.step)+'|'+v.label]||v.label;
    const kk=String(v.step)+'|'+rep;
    sentByRep[kk]=(sentByRep[kk]||0)+(v.sent||0);
  });
  const byStep={};
  versions.forEach(v=>{ const k=v.step!=null?String(v.step):'?'; (byStep[k]=byStep[k]||[]).push(v); });
  const stepKeys=Object.keys(byStep).sort((a,b)=>(parseInt(a,10)||0)-(parseInt(b,10)||0));
  /* best opener: Email-1, active, with positives, fewest sends per positive */
  let best=null;
  (byStep['1']||[]).forEach(v=>{
    if(v.disabled||v.inline||!(v.positives>0)||!v.sent) return;
    const pp=v.sent/v.positives;
    if(best===null||pp<best.pp) best={label:v.label,pp:pp};
  });
  const rows=stepKeys.map(sk=>{
    const vs=byStep[sk].slice().sort((a,b)=>(a.label==null?'￿':String(a.label)).localeCompare(b.label==null?'￿':String(b.label)));
    const band='<tr class="vp-band"><td class="vp-l" colspan="7">Email '+esc(sk)
      +' <span class="ring-caption">'+vs.length+' variant'+(vs.length===1?'':'s')+'</span></td></tr>';
    const body=vs.map(v=>{
      const label=v.inline?'inline':(v.label||'?');
      const isBest=best&&sk==='1'&&!v.disabled&&!v.inline&&v.label===best.label;
      const rep=(!v.inline&&v.label!=null)?(repOf[sk+'|'+v.label]||v.label):null;
      const isRep=rep!=null&&rep===v.label;
      const siblings=rep!=null?(membersOf[sk+'|'+rep]||[v.label]).length>1:false;
      let meetCell, pmCell='';
      if(!hasMeet){ meetCell=''; }
      else if(rep==null){ meetCell='<span class="ring-caption">&middot;</span>'; }
      else if(!isRep){ meetCell='<span class="ring-caption vp-sib">= '+esc(rep)+'</span>'; }
      else{
        const mv=byVar[sk+'|'+rep]||0;
        meetCell= mv>0? fmt(mv) : '<span class="ring-caption">0</span>';
        const cs=sentByRep[sk+'|'+rep]||v.sent;
        if(mv&&cs) pmCell=fmt(Math.round(cs/mv));
      }
      /* live on/off TOGGLE wherever the true split is known (campaign-page
         parity): deleted -> dot--off (can't re-enable a purged variant);
         split unknown -> honest dot, never a guessing toggle. */
      let stateCell;
      if(v.inline) stateCell='';
      else if(v.disabled) stateCell=' <span class="vp-dot vp-dot--off" title="deleted in Smartlead"></span>';
      else if(v.split==null||v.variant_id==null||cid==null)
        stateCell=' <span class="vp-dot vp-dot--on" title="active"></span>';
      else{
        const on=v.split>0;
        stateCell=' <button type="button" class="vaw-toggle'+(on?' is-on':'')
          +'" data-vaw-toggle data-step="'+esc(String(sk))+'" data-vlabel="'+esc(String(v.label))
          +'" data-split="'+v.split+'" aria-pressed="'+(on?'true':'false')
          +'" title="'+(on?'Sending ('+v.split+'% of Email '+esc(String(sk))+') — click to switch off'
                          :'Switched off — click to give it a share again')
          +'"><span class="vaw-knob"></span></button>';
      }
      /* the proven best opener gets the explicit scale control */
      let scaleBtn='';
      if(isBest&&v.split!=null&&v.split>0&&v.split<100&&cid!=null)
        scaleBtn=' <button type="button" class="vaw-mini" data-vaw-scale data-step="'+esc(String(sk))
          +'" data-vlabel="'+esc(String(v.label))+'" data-split="'+v.split
          +'">Send 100% of Email '+esc(String(sk))+' to it</button>';
      return '<tr>'
        +'<td data-label="Version">'+esc(label)+stateCell
          +(isBest?' <span class="vp-best">best</span>':'')+scaleBtn
          +(isRep&&siblings?' <span class="ring-caption" title="'+esc((membersOf[sk+'|'+rep]||[]).join(', '))+' are the same copy">+'+((membersOf[sk+'|'+rep]||[]).length-1)+' same</span>':'')+'</td>'
        /* a deleted variant's counters were PURGED by Smartlead, not zero */
        +(v.stats_purged
          ? '<td class="tnum" data-label="Sent"><span class="ring-caption" title="Smartlead purges a variant\'s counters when it is deleted — it did send before deletion">&mdash;</span></td>'
            +'<td class="tnum" data-label="Replies"><span class="ring-caption">&mdash;</span></td>'
            +'<td class="tnum" data-label="Positives"><span class="ring-caption">&mdash;</span></td>'
          : '<td class="tnum" data-label="Sent">'+fmt(v.sent)+'</td>'
            +'<td class="tnum" data-label="Replies">'+fmt(v.replies)+rateSpan(v.replies,v.sent)+'</td>'
            +'<td class="tnum" data-label="Positives">'+fmt(v.positives)+rateSpan(v.positives,v.sent)+'</td>')
        +'<td class="tnum" data-label="Sent / positive">'+(v.stats_purged?'<span class="ring-caption">&mdash;</span>':perPos(v))+'</td>'
        +'<td class="tnum" data-label="Meetings">'+meetCell+'</td>'
        +'<td class="tnum" data-label="Sent / meeting">'+pmCell+'</td></tr>';
    }).join('');
    return band+body;
  }).join('');
  /* combinations: opener → follow-up paths deduced from booked replies */
  let comboHTML='';
  if(combinations&&Object.keys(combinations).length){
    const crows=Object.keys(combinations).map(k=>{
      const p=k.split('>');
      return { e1:p[0], e2:p[1], mt:combinations[k], snt:(sentByRep['1|'+p[0]]||0)+(sentByRep['2|'+p[1]]||0) };
    }).sort((a,b)=>b.mt-a.mt||String(a.e1).localeCompare(String(b.e1)));
    const bestMt=crows.reduce((m,c)=>Math.max(m,c.mt),0);
    comboHTML='<div class="vp-combos"><div class="vp-combos-h">Best combination <span class="ring-caption">the opener the booker saw &rarr; the follow-up · sent counts both emails</span></div>'
      +'<div class="leads-table-wrap"><table class="leads-table version-perf-table"><thead><tr><th>Combination</th><th class="tnum">Sent</th><th class="tnum">Meetings</th><th class="tnum">Sent / meeting</th></tr></thead><tbody>'
      +crows.map(c=>{
        const isb=c.mt===bestMt&&c.mt>0;
        return '<tr'+(isb?' class="vp-win"':'')+'><td data-label="Combination">'+esc(c.e1)+' <span class="ring-caption">&rarr;</span> '+esc(c.e2)+(isb?' <span class="vp-best">best</span>':'')+'</td>'
          +'<td class="tnum" data-label="Sent">'+(c.snt?fmt(c.snt):'<span class="ring-caption">—</span>')+'</td>'
          +'<td class="tnum" data-label="Meetings">'+fmt(c.mt)+'</td>'
          +'<td class="tnum" data-label="Sent / meeting">'+(c.mt&&c.snt?fmt(Math.round(c.snt/c.mt)):'<span class="ring-caption">—</span>')+'</td></tr>';
      }).join('')+'</tbody></table></div></div>';
  }
  let meetNote='';
  if(hasMeet){
    const tot=meetings.total||0, att=meetings.attributed||0, rem=meetings.removed||0;
    const traceless=Math.max(0,tot-att-rem);
    meetNote=fmt(tot)+' meeting'+(tot===1?'':'s')+' on this campaign, one per person. '
      +fmt(att)+' traced to the copy each booker quoted back in their reply'
      +(rem?'; '+fmt(rem)+' came from an opener since removed from the sequence (its copy is gone from Smartlead, so it has no row above)':'')
      +(traceless?'; '+fmt(traceless)+" didn't quote enough to place":'')+'. '
      +(hasGroup?'Variants with identical copy count as one version — the meetings show on the active label and the rest read “= it”. ':'')
      +"A booked call runs through an opener and a follow-up, so a version's Meetings counts every call whose journey passed through it.";
  }
  return '<div class="leads-table-wrap"><table class="leads-table version-perf-table">'
    +'<thead><tr><th>Version</th><th class="tnum">Sent</th><th class="tnum">Replies</th><th class="tnum">Positives</th><th class="tnum">Sent / positive</th><th class="tnum">Meetings</th><th class="tnum">Sent / meeting</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table></div>'+comboHTML
    +(meetNote?'<p class="sample-footer">'+esc(meetNote)+'</p>':'')
    +(note?'<p class="sample-footer">'+esc(note)+'</p>':'');
}

function vawPost(url, body){
  return fetch(url,{
    method:"POST", credentials:"same-origin",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body||{})
  }).then(r=>r.json().catch(()=>({ok:false,message:"bad response ("+r.status+")"})));
}
function vawChangeV(from, to){
  return '<span class="old">'+esc(String(from))+'</span><span class="arr">&rarr;</span>'+esc(String(to));
}
const VAW_IDNOTE="Saved the ID-intact way: fresh pull, every step & version ID echoed back, so all history is kept.";

/* Typed-token confirm modal — same contract as the campaign page. */
function vawModal(opts){
  const ov=document.createElement("div");
  ov.className="vaw-overlay";
  const linesHTML=(opts.lines||[]).map(l=>'<div class="vaw-line"><span class="k">'+esc(l[0])+'</span><span class="v">'+l[1]+'</span></div>').join("");
  ov.innerHTML='<div class="vaw-modal" role="dialog" aria-modal="true">'
    +'<h3>'+esc(opts.title)+'</h3>'
    +'<p class="vaw-sub">'+esc(opts.sub||"")+'</p>'
    +(opts.body||"")
    +(linesHTML?'<div class="vaw-lines">'+linesHTML+'</div>':"")
    +(opts.idnote?'<p class="vaw-idnote">&#128274; '+esc(opts.idnote)+'</p>':"")
    +'<div class="vaw-token"><span class="vaw-token-lbl">Type <b>'+esc(opts.token)+'</b> to confirm:</span>'
    +'<input type="text" autocomplete="off" spellcheck="false" aria-label="confirmation word"></div>'
    +'<div class="vaw-err"></div>'
    +'<div class="vaw-foot"><button type="button" class="vaw-btn" data-x>Cancel</button>'
    +'<button type="button" class="vaw-btn '+(opts.danger?"vaw-btn--danger":"vaw-btn--primary")
    +'" data-go disabled>'+esc(opts.confirmLabel||"Confirm — write it")+'</button></div></div>';
  document.body.appendChild(ov);
  const input=ov.querySelector("input"), go=ov.querySelector("[data-go]"),
        err=ov.querySelector(".vaw-err"), modal=ov.querySelector(".vaw-modal");
  function close(){ ov.remove(); document.removeEventListener("keydown", onKey); }
  function onKey(e){ if(e.key==="Escape") close(); }
  document.addEventListener("keydown", onKey);
  ov.addEventListener("mousedown",(e)=>{ if(e.target===ov) close(); });
  ov.querySelector("[data-x]").addEventListener("click", close);
  input.addEventListener("input",()=>{ go.disabled=input.value.trim().toUpperCase()!==opts.token; });
  input.focus();
  go.addEventListener("click",()=>{
    if(go.disabled) return;
    go.disabled=true; go.textContent="Writing…"; err.textContent="";
    opts.run().then(resp=>{
      if(!resp||resp.ok===false){
        err.textContent=(resp&&resp.message)||"The write was refused - nothing changed.";
        go.disabled=false; go.textContent=opts.confirmLabel||"Confirm — write it";
        return;
      }
      const rec=opts.receipt?opts.receipt(resp):{title:"Saved",lines:[],foot:""};
      modal.innerHTML='<div class="vaw-receipt"><h4>&#10003; '+esc(rec.title)+'</h4>'
        +'<div class="vaw-lines">'+(rec.lines||[]).map(l=>'<div class="vaw-line"><span class="k">'+esc(l[0])+'</span><span class="v">'+l[1]+'</span></div>').join("")+'</div>'
        +(rec.foot?'<p class="vaw-idnote">'+rec.foot+'</p>':"")+'</div>'
        +'<div class="vaw-foot"><button type="button" class="vaw-btn vaw-btn--primary" data-x2>Done</button></div>';
      modal.querySelector("[data-x2]").addEventListener("click", close);
      if(opts.after) opts.after(resp);
    }).catch(e2=>{
      err.textContent="Couldn't reach the tool: "+((e2&&e2.message)||"network error");
      go.disabled=false; go.textContent=opts.confirmLabel||"Confirm — write it";
    });
  });
}

/* caches out, fresh hydrate in — after ANY successful write */
function vawRefreshCampaign(){
  CACHE.messaging=null; CACHE.seqcopy=null;
  CACHE.messagingBusy=false; CACHE.seqcopyBusy=false;
  if(ROW){ hydrateMessaging(ROW); hydrateSequenceCopy(ROW); }
}

function vawWireMessaging(root, c){
  root.querySelectorAll("[data-vaw-toggle]").forEach(t=>{
    t.addEventListener("click",()=>{
      const on=t.classList.contains("is-on");
      const step=t.getAttribute("data-step"), lab=t.getAttribute("data-vlabel");
      const split=parseInt(t.getAttribute("data-split"),10)||0;
      vawModal(on?{
        title:"Switch off Version "+lab+" on Email "+step+"?",
        sub:(c.name||"Campaign "+c.id)+" · campaign "+c.id,
        lines:[["Version "+lab+" share",vawChangeV(split+"%","0%")],
               ["Its "+split+"% goes to","the other live versions"],
               ["Copy / subject","untouched"]],
        idnote:VAW_IDNOTE, token:"DISABLE", danger:true,
        confirmLabel:"Confirm — switch it off",
        run:()=>vawPost("/api/campaigns/"+c.id+"/variant-action",
          {action:"disable", email:+step, variant_label:lab, confirm:"DISABLE"}),
        receipt:(resp)=>({
          title:"Version "+lab+" switched off — IDs intact, history kept",
          lines:Object.keys(resp.after||{}).map(k=>["Version "+k+" share",vawChangeV((resp.before||{})[k]+"%",(resp.after||{})[k]+"%")]),
          foot:"It stopped sending but keeps its stats — switch it back on any time."
        }),
        after:()=>vawRefreshCampaign()
      }:{
        title:"Switch Version "+lab+" back on (Email "+step+")?",
        sub:(c.name||"Campaign "+c.id)+" · campaign "+c.id,
        lines:[["Version "+lab+" share",vawChangeV("0%","an equal share")],
               ["Every live version","rebalanced to equal shares"],
               ["Copy / subject","untouched"]],
        idnote:VAW_IDNOTE, token:"ENABLE", danger:false,
        confirmLabel:"Confirm — switch it on",
        run:()=>vawPost("/api/campaigns/"+c.id+"/variant-action",
          {action:"enable", email:+step, variant_label:lab, confirm:"ENABLE"}),
        receipt:(resp)=>({
          title:"Version "+lab+" is sending again",
          lines:Object.keys(resp.after||{}).map(k=>["Version "+k+" share",vawChangeV((resp.before||{})[k]+"%",(resp.after||{})[k]+"%")]),
          foot:"Same version ID as before — its new sends stack onto its old history."
        }),
        after:()=>vawRefreshCampaign()
      });
    });
  });
  root.querySelectorAll("[data-vaw-scale]").forEach(b=>{
    b.addEventListener("click",()=>{
      const step=b.getAttribute("data-step"), lab=b.getAttribute("data-vlabel");
      const split=parseInt(b.getAttribute("data-split"),10)||0;
      vawModal({
        title:"Send 100% of Email "+step+" to Version "+lab+"?",
        sub:(c.name||"Campaign "+c.id)+" · campaign "+c.id,
        lines:[["Version "+lab+" share",vawChangeV(split+"%","100%")],
               ["Every other version on Email "+step,vawChangeV("their shares","0% (kept, not deleted)")],
               ["Copy / subject","untouched"]],
        idnote:VAW_IDNOTE, token:"SCALE", danger:false,
        confirmLabel:"Confirm — send it everything",
        run:()=>vawPost("/api/campaigns/"+c.id+"/variant-action",
          {action:"scale_winner", email:+step, variant_label:lab, confirm:"SCALE"}),
        receipt:(resp)=>({
          title:"Version "+lab+" now takes all of Email "+step,
          lines:Object.keys(resp.after||{}).map(k=>["Version "+k+" share",vawChangeV((resp.before||{})[k]+"%",(resp.after||{})[k]+"%")]),
          foot:"The others are paused at 0% with their IDs and history intact."
        }),
        after:()=>vawRefreshCampaign()
      });
    });
  });
}
/* ══ end variant-action-wire ══════════════════════════════════════════════ */

function coOf(r){ return { id:r.campaign_id, name:r.campaign_name }; }

function hydrateMessaging(r){
  const root=$("messaging-root");
  if(!root) return;
  const apply=(m)=>{
    CACHE.messagingBusy=false;
    const el=$("messaging-root");
    if(!el) return;
    if(!m||m.degraded||!(m.versions||[]).length){
      /* honest fallback: the optimiser's own per-variant split from the daily crunch */
      const fb=(r.variants||[]).filter(v=>v.sent>0);
      if(fb.length){
        el.innerHTML=versionTableHTML(fb.map(v=>({
          step:v.email, label:humanTags((v.angle||"").split("/")[0].trim()).slice(0,30)||"?",
          sent:v.sent, replies:v.replies, positives:(v.positives!=null?v.positives:(v.pos||0))
        })),"Smartlead is unreachable right now; this table is the optimiser's daily split.");
      }else{
        el.innerHTML='<p class="card-subtitle">No version stats available: Smartlead is unreachable and no daily split exists for this campaign yet.</p>';
      }
      return;
    }
    el.innerHTML=versionTableHTML(m.versions,m.note,m.meetings,m.combinations,r.campaign_id);
    vawWireMessaging(el, coOf(r));
  };
  if(CACHE.messaging){ apply(CACHE.messaging); return; }
  if(CACHE.messagingBusy) return;
  CACHE.messagingBusy=true;
  const fetchIt=(isRetry)=>{
    getJSON("/api/cockpit/messaging?id="+encodeURIComponent(r.campaign_id)).then(m=>{
      const healthy=m&&!m.degraded&&(m.versions||[]).length;
      if(healthy) CACHE.messaging=m;
      else if(!isRetry){ setTimeout(()=>{ if(!CACHE.messaging) fetchIt(true); },7000); return apply(m); }
      apply(m);
    }).catch(()=>{
      if(!isRetry){ setTimeout(()=>{ if(!CACHE.messaging) fetchIt(true); },7000); }
      apply(null);
    });
  };
  fetchIt(false);
}

/* ── Messaging: "the sequence" — read-only mirror of the live Smartlead copy,
   spintax resolved to one clean rendering (house rule: copy is read resolved,
   never raw). Ported from the campaign page. ─────────────────────────────── */
function resolveSpin(text){
  const tags=[];
  let t=(text||"").replace(/\{\{[^}]+\}\}|%signature%/g,(m)=>{ tags.push(m); return "\x00"+(tags.length-1)+"\x00"; });
  let prev;
  do{
    prev=t;
    t=t.replace(/\{([^{}|]*(?:\|[^{}]*)+)\}/g,(_,opts)=>opts.split("|")[0]);
  }while(t!==prev);
  return t.replace(/\x00(\d+)\x00/g,(_,i)=>tags[+i]);
}
function seqRichText(text){
  const marked=esc(text||"").replace(/\{\{[^}]+\}\}|%signature%/g,(m)=>'<span class="mergetag">'+m+'</span>');
  return marked.split(/\n\s*\n/).map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join("");
}
function sequenceCopyHTML(sc){
  const steps=sc.steps||[];
  const parts=[];
  steps.forEach((s,si)=>{
    const stepNo=s.step!=null?s.step:"?";
    /* live first, then switched-off (0% split), then deleted — labelled */
    const vRank=(v)=> v.deleted?2:(v.split===0?1:0);
    const variants=(s.variants||[]).slice().sort((a,b)=>vRank(a)-vRank(b));
    const vTag=(v)=> v.deleted?" (deleted)":v.split===0?" (off)":"";
    let pills="";
    if(variants.length>1){
      pills='<div class="seq-version-pills" aria-label="Email '+esc(stepNo)+' versions">'
        +variants.map((v,vi)=>'<button type="button" class="seq-pill'+(vi===0?" is-active":"")
          +(v.deleted?" seq-pill--del":v.split===0?" seq-pill--off":"")
          +'" data-step="'+esc(stepNo)+'" data-vidx="'+vi+'" aria-pressed="'+(vi===0?"true":"false")+'">'
          +esc((v.label||"?")+vTag(v))+'</button>').join("")+'</div>';
    }
    const panels=variants.map((v,vi)=>{
      const subj=v.subject
        ? '<span class="seq-subject-text">'+seqRichText(resolveSpin(v.subject)).replace(/^<p>|<\/p>$/g,"")+'</span>'
        : '<span class="seq-subject-text seq-subject-none">(no subject, reply in thread)</span>';
      const body=v.body
        ? seqRichText(resolveSpin(v.body))
        : '<p class="card-subtitle">'+(v.deleted
            ? "This variant was deleted; Smartlead no longer stores its copy."
            : "No copy stored for this variant.")+'</p>';
      return '<div class="seq-version-panel" data-step="'+esc(stepNo)+'" data-vidx="'+vi+'"'+(vi===0?"":" hidden")+'>'
        +(v.deleted?'<p class="card-subtitle">Deleted variant &mdash; no longer sending.</p>'
          : v.split===0?'<p class="card-subtitle">Switched off (0% of sends) &mdash; kept here so you can still read it.</p>':"")
        +'<p class="seq-subject"><strong>Subject:</strong> '+subj+'</p>'
        +'<div class="seq-body-scroll">'+body
        +(v.truncated?'<p class="card-subtitle">&hellip; copy truncated &mdash; open the sequence in Smartlead for the rest.</p>':"")
        +'</div></div>';
    }).join("");
    parts.push('<div class="seq-step"><div class="seq-step-header"><span class="seq-step-title">Email '+esc(stepNo)+'</span>'+pills+'</div>'
      +'<div class="seq-body">'+panels+'</div></div>');
    const next=steps[si+1];
    if(next&&next.delay_days!=null)
      parts.push('<div class="seq-connector">Wait '+esc(next.delay_days)+' day'+(next.delay_days===1?'':'s')+'</div>');
  });
  return '<p class="card-subtitle">Read-only mirror of what\'s live in Smartlead: steps, wait gaps, subjects and bodies. Click a version pill to see its copy. Spun lines are shown as one clean rendering.</p>'
    +'<div class="seq-rail">'+parts.join("")+'</div>';
}
function hydrateSequenceCopy(r){
  const id=r.campaign_id;
  const root=()=>$("sequence-root");
  const done=()=>{ CACHE.seqcopyBusy=false; };
  const apply=(sc)=>{
    const el=root();
    if(!el){ done(); return; }
    el.setAttribute("data-seqcopy","1");
    if(sc.empty){
      el.innerHTML='<p class="card-subtitle">No sequence set up in Smartlead yet for this campaign.</p>';
      done(); return;
    }
    el.innerHTML=sequenceCopyHTML(sc);
    el.querySelectorAll(".seq-pill").forEach(pill=>{
      pill.addEventListener("click",()=>{
        const step=pill.closest(".seq-step");
        if(!step) return;
        const vidx=pill.getAttribute("data-vidx");
        step.querySelectorAll(".seq-pill").forEach(p=>{
          const on=p===pill;
          p.classList.toggle("is-active",on);
          p.setAttribute("aria-pressed",on?"true":"false");
        });
        step.querySelectorAll(".seq-version-panel").forEach(panel=>{
          panel.hidden = panel.getAttribute("data-vidx")!==vidx;
        });
      });
    });
    done();
  };
  const fail=()=>{
    done();
    const el=root();
    if(!el) return;
    el.setAttribute("data-seqcopy","1");
    el.innerHTML='<div class="seq-fail">'
      +'<p class="card-subtitle">Couldn\'t pull the live copy from Smartlead just now. Nothing is wrong with the campaign &mdash; the platform didn\'t answer in time.</p>'
      +'<button type="button" class="btn" id="seq-retry">Try again</button></div>';
    const b=$("seq-retry");
    if(b) b.addEventListener("click",start);
  };
  const attempt=(i)=>{
    getJSON("/api/cockpit/sequence-copy?id="+encodeURIComponent(id)).then(sc=>{
      const healthy=sc&&!sc.degraded&&((sc.steps||[]).length||sc.empty);
      if(healthy){ CACHE.seqcopy=sc; apply(sc); return; }
      if(i<2) setTimeout(()=>attempt(i+1), i===0?3000:7000);
      else fail();
    }).catch(()=>{
      if(i<2) setTimeout(()=>attempt(i+1), i===0?3000:7000);
      else fail();
    });
  };
  const start=()=>{
    const el=root();
    if(el&&!el.querySelector(".seq-rail")) el.innerHTML='<p class="card-subtitle">Pulling the live copy&hellip;</p>';
    attempt(0);
  };
  if(CACHE.seqcopy){ apply(CACHE.seqcopy); return; }
  if(CACHE.seqcopyBusy) return;
  CACHE.seqcopyBusy=true;
  start();
}

    e.stopPropagation();
    const pop=clgPop(e.currentTarget,"colpop",CLG_COLS.map(c=>
      '<label><input type="checkbox" data-viscol="'+esc(c.k)+'"'+(CLG.visible[c.k]?" checked":"")+'> '+esc(c.lbl)+'</label>').join(""));
    pop.querySelectorAll("[data-viscol]").forEach(chk=>{
      chk.addEventListener("change",()=>{
        CLG.visible[chk.getAttribute("data-viscol")]=chk.checked;
        clgRender();
      });
    });
  };
  document.getElementById("clg-startrow").onchange=function(){
    CLG.start=Math.max(1,parseInt(this.value,10)||1); clgRender();
  };
  document.getElementById("clg-rowsinput").onchange=function(){
    /* the page-weight law: the grid never renders more than CLG_CAP rows */
    CLG.per=Math.min(CLG_CAP,Math.max(1,parseInt(this.value,10)||CLG_CAP)); clgRender();
  };
  const rp=document.getElementById("clg-repliers");
  if(rp) rp.onclick=clgToggleRepliers;
  document.getElementById("clg-prev").onclick=()=>{ CLG.start=Math.max(1,CLG.start-CLG.per); clgRender(); };
  document.getElementById("clg-next").onclick=()=>{ CLG.start=CLG.start+CLG.per; clgRender(); };
  const sa=document.getElementById("clg-selall");
  if(sa) sa.onchange=function(){
    clgView().slice(CLG.start-1,CLG.start-1+CLG.per).forEach((l,i)=>{
      const key=l.email||String(CLG.start-1+i);
      if(sa.checked) CLG.selected[key]=true; else delete CLG.selected[key];
    });
    clgRender();
  };
  root.querySelectorAll(".clg-rowchk").forEach(chk=>{
    chk.addEventListener("change",()=>{
      const k=chk.getAttribute("data-key");
      if(chk.checked) CLG.selected[k]=true; else delete CLG.selected[k];
      clgRender();
    });
  });
}

    +"and lead performance - who replied, who was positive, who booked (use lilly-optimiser + lilly-data). "

function clgCopyPrompt(c, btn){
  const txt=addLeadsPrompt(c);
  const done=()=>{
    btn.innerHTML='<span class="plus">✓</span> Brief copied — paste into Claude Code';
    btn.classList.add("copied");
    setTimeout(()=>{
      btn.innerHTML='<span class="plus">＋</span> Add more leads';
      btn.classList.remove("copied");
    },2600);
  };
  const fallback=()=>{
    const ta=document.createElement("textarea");
    ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ /* no clipboard: nothing to show */ }
    ta.remove();
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done,fallback);
  }else fallback();
}

/* ── Sources section (campaign-page parity): drafted/tool sources with pool
   cards + signal rows, then push-history cards from the contact record. ── */
function sigMech(s){
  const m=String(s.mechanism||s.type||"").toLowerCase();
  return (m==="hiring"||m==="engagement"||m==="followers"||m==="lookalike")?m:"";
}
function isFixedList(s){
  return String(s.mechanism||s.type||"").toLowerCase()==="fixed_list";
}
function fixedRepull(s){
  const r=(s.params||{}).repull;
  return (r&&typeof r==="object"&&Object.keys(r).length)?r:null;
}
function sigAgo(iso){
  if(!iso) return "";
  const ms=Date.now()-new Date(iso).getTime();
  if(!(ms>=0)) return "";
  const mins=Math.round(ms/60000);
  if(mins<60) return mins+" min ago";
  const hrs=Math.round(mins/60);
  if(hrs<48) return hrs+" h ago";
  return Math.round(hrs/24)+" days ago";
}
function sigToast(msg){
  let t=document.getElementById("sig-toast");
  if(t) t.remove();
  t=document.createElement("div");
  t.id="sig-toast";
  t.style.cssText="position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;"
    +"background:#141414;color:#fff;border-radius:12px;padding:12px 18px;font-size:0.9rem;"
    +"box-shadow:0 8px 28px rgba(0,0,0,.25);max-width:92vw;text-align:center";
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.remove(); },6000);
}
function sigPost(url, body){
  return fetch(url,{
    method:"POST", credentials:"same-origin",
    headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)
  }).then(r=>r.json().catch(()=>({})).then(j=>{
    if(!r.ok||j.ok===false) throw new Error((j&&j.message)||"Request failed");
    return j;
  }));
}
function sigRehydrate(c){

function bindSigRows(c){
  const root=document.getElementById("draft-sources-root");
  if(!root||root._sigBound) return;
  root._sigBound=true;
  root.addEventListener("click",(ev)=>{
    const btn=ev.target.closest?ev.target.closest("[data-sig-more],[data-sig-pull],[data-sig-dup],[data-sig-ice-save]"):null;
    if(!btn) return;
    const row=btn.closest("[data-sig-row]");
    if(btn.hasAttribute("data-sig-more")){
      const body=row.querySelector(".sig-body");
      body.hidden=!body.hidden;
      btn.innerHTML=body.hidden?"&#9662;":"&#9652;";
      return;
    }
    if(btn.hasAttribute("data-sig-pull")){
      const pid=btn.getAttribute("data-sig-pull");
      btn.disabled=true;
      btn.textContent="Pulling…";
      sigPost("/api/sources/pull",{id:pid}).then(j=>{
        sigToast(j&&j.message?j.message:"Pull finished — the numbers refresh in a moment");
        sigRehydrate(c);
      }).catch(e=>{
        btn.disabled=false;
        btn.textContent="Find people again";
        sigToast(e.message||"Couldn't pull — try again");
      });
      return;
    }
    if(btn.hasAttribute("data-sig-dup")){
      btn.disabled=true;
      sigPost("/api/sources/duplicate",{id:btn.getAttribute("data-sig-dup")}).then(()=>{
        sigToast("Source duplicated — same targeting, nothing pulled yet");
        sigRehydrate(c);
      }).catch(e=>{
        btn.disabled=false;
        sigToast(e.message||"Couldn't duplicate — try again");
      });
      return;
    }
    if(btn.hasAttribute("data-sig-ice-save")){
      const iid=btn.getAttribute("data-sig-ice-save");
      const inp=row.querySelector('[data-sig-ice="'+iid+'"]');
      btn.disabled=true;
      sigPost("/api/sources/update",{id:iid,icebreaker:inp.value}).then(()=>{
        btn.disabled=false;
        sigToast("Icebreaker saved — used on this source's next pull");
      }).catch(e=>{
        btn.disabled=false;
        sigToast(e.message||"Couldn't save the icebreaker");
      });
    }
  });
  root.addEventListener("change",(ev)=>{
    const inp=ev.target;
    if(!inp.hasAttribute||!inp.hasAttribute("data-sig-live")) return;
    const on=inp.checked;
    inp.disabled=true;
    sigPost("/api/sources/update",{id:inp.getAttribute("data-sig-live"),active:on}).then(()=>{
      inp.disabled=false;
      sigToast(on?"Signal on — it keeps finding people in the background"
        :"Signal off — nothing pulls until you turn it back on");
    }).catch(e=>{
      inp.checked=!on;
      inp.disabled=false;
      sigToast(e.message||"Couldn't update the signal");
    });
  });
}
function maybeSourcesEmpty(){
  const d=document.getElementById("draft-sources-root");

  if(!d||!s||!e) return;

function poolNoteHTML(pool){
  const j=pool.active_job;
  if(j){
    const st={selecting:"Selecting the next batch…",sweeping:"Checking for people we shouldn't contact…",
              verifying:"Verifying emails",uploading:"Adding verified people"}[j.stage]||"Working…";
    const pr=j.progress&&j.progress.total?" "+fmt(j.progress.done)+"/"+fmt(j.progress.total):"";
    return st+pr;
  }
  const lb=pool.last_batch;
  if(lb){
    if(!(lb.verify_failed||lb.live_dropped))
      return '<span style="color:#2F9E44">✓</span> Last add: all '+fmt(lb.pushed)+" passed the checks";
    return "Last add: "+fmt(lb.pushed)+" verified added &middot; "+fmt(lb.verify_failed)
      +" failed verification &middot; "+fmt(lb.live_dropped)+" dropped as collisions";
  }
  return "";
}
function paintPoolCard(c, pool){
  const card=document.querySelector('[data-pool="'+pool.id+'"]');
  if(!card) return;
  card.querySelector("[data-pool-note]").innerHTML=poolNoteHTML(pool);
  const act=card.querySelector("[data-pool-act]");
  if(pool.active_job){
    act.innerHTML='<span class="source-list-meta">Working&hellip;</span>';

  act.querySelector("[data-pool-add]").onclick=function(e){
    e.preventDefault();
    const btn=this;
    const prompt="Pull more · "+(c.name||("campaign "+c.id))+" (campaign "+c.id+")\n\n"
      +"Run the pull-more wizard for source pool "+pool.id+" — campaign "+c.id+". "
      +"Right now: "+fmt(pool.pulled_ok)+" pulled, "+fmt(pool.remaining)
      +" not yet pulled of "+fmt(pool.total_pool)+". "
      +"Walk me through choosing how many to add (presets 500 / 1,000 / 2,000), tell me the estimated "
      +"email-verification credit spend BEFORE anything runs, then run the gated pull and report how many "
      +"were added, failed verification, or dropped as collisions. /pull-more-wizard";
    const fallbackPopover=()=>{
      const pop=document.createElement("div");
      pop.style.cssText="position:absolute;z-index:30;background:#fff;border:1px solid var(--border-strong);"
        +"border-radius:12px;padding:14px;box-shadow:0 6px 24px rgba(0,0,0,.12);width:340px;max-width:92vw";
      pop.innerHTML='<div class="source-list-name" style="display:block;margin-bottom:6px">Copy this, paste into Claude</div>'
        +'<textarea readonly style="width:100%;height:120px;font:12px/1.45 ui-monospace,monospace;border:1px solid var(--border-strong);border-radius:8px;padding:8px;resize:none;color:var(--fg-subtle)"></textarea>';
      pop.querySelector("textarea").value=prompt;
      const r=btn.getBoundingClientRect();
      pop.style.left=Math.max(10,r.right-350)+"px";
      pop.style.top=(r.bottom+window.scrollY+6)+"px";
      document.body.appendChild(pop);
      pop.querySelector("textarea").select();
      setTimeout(()=>{
        document.addEventListener("click",function close(ev){
          if(!pop.contains(ev.target)&&ev.target!==btn){ pop.remove(); document.removeEventListener("click",close); }
        });
      },0);
    };
    const old=btn.textContent;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(prompt).then(()=>{
        btn.textContent="Copied ✓";
        setTimeout(()=>{ btn.textContent=old; },2500);
        sigToast("Prompt copied — paste it into Claude. It confirms the amount and credit spend, then runs the checked pull.");
      }).catch(fallbackPopover);
    }else{
      fallbackPopover();
    }
  };
}
function poolCardPoll(c, poolId){
  setTimeout(()=>{
    getJSON("/api/pool-pulls").then(d=>{
      const pool=((d&&d.pools)||[]).find(p=>p.id===poolId);
      const card=document.querySelector('[data-pool="'+poolId+'"]');
      if(!pool||!card) return;
      card.querySelector("[data-pool-note]").innerHTML=poolNoteHTML(pool);
      const metas=card.querySelectorAll(".source-list-meta");
      if(!pool.active_job){
        metas[0].innerHTML=fmt(pool.pulled_ok)+" pulled &middot; "+fmt(pool.remaining)
          +" not yet pulled of "+fmt(pool.total_pool)
          +' &middot; <a class="action-link" href="/app/lists.html#'+esc(pool.list_id)+'">View the list</a>';
        paintPoolCard(c, pool);
        return;
      }
      poolCardPoll(c, poolId);
    }).catch(()=>{ poolCardPoll(c, poolId); });
  },4000);
}
function hydrateDraftSources(c){
  if(!CACHE.slimSourcesP) CACHE.slimSourcesP=getJSON("/api/sources?slim=1").catch(()=>null);
  Promise.all([CACHE.slimSourcesP, getJSON("/api/pool-pulls").catch(()=>null)])
    .then(rs=>{
      const all=rs[0];
      const pools=((rs[1]||{}).pools)||[];
      const mine=(Array.isArray(all)?all:[]).filter(s=>String(s.campaign_id)==="camp-sl-"+c.id);
      const sec=document.getElementById("draft-sources-section");
      if(!sec) return;
      if(!mine.length){ maybeSourcesEmpty(); return; }
      function poolOf(s){
        return pools.find(p=>p.list_id===s.list_id&&String(p.campaign_id)===String(c.id))||null;
      }
      document.getElementById("draft-sources-root").innerHTML='<div class="source-list-cards">'+mine.map(s=>{
        const pool=poolOf(s);
        if(pool){
          const pct=pool.total_pool?Math.max(0.4,pool.pulled_ok/pool.total_pool*100):0;
          const fx=isFixedList(s);

            +'<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">'
            +'<span style="min-width:0"><span class="source-list-name">'+esc(s.name||"Source")+'</span>'
            +(fx?' <span class="sig-chip sig-chip--fixed" title="A one-off list: these people were pulled once on a set of filters. It is not a signal - nothing new arrives tomorrow, and nothing runs in the background.">Fixed list</span>':"")
            +'</span>'
            +'<div style="display:flex;align-items:center;gap:8px;flex:0 0 auto">'
            +(s.list_id?'<a class="action-link" href="/app/lists.html#'+esc(s.list_id)+'">View the list</a>':"")
            +'<span data-pool-act></span></div></div>'
            +'<div style="height:8px;border-radius:4px;background:var(--border-strong);overflow:hidden;margin:10px 0 5px">'
            +'<i style="display:block;height:100%;width:'+pct.toFixed(1)+'%;background:#E8590C"></i></div>'
            +'<div class="source-list-meta" style="display:flex;justify-content:space-between;gap:10px">'
            +'<span><b style="color:var(--fg)">'+fmt(pool.pulled_ok)+'</b> pulled</span>'
            +'<span><b style="color:var(--fg)">'+fmt(pool.remaining)+'</b> still available</span></div>'
            +(fx?'<span class="source-list-meta" style="display:block;margin-top:6px">One-off list &middot; the people still available were bought in the same pull; nothing new arrives.</span>':"")
            +'<span class="source-list-meta" data-pool-note style="display:block;margin-top:6px">'+poolNoteHTML(pool)+'</span></div>';
        }
        if(isFixedList(s)) return fixedRowHTML(c,s);
        if(sigMech(s)) return sigRowHTML(c,s);
        const n=s.total!=null?s.total:((s.prospects||[]).length||null);
        const inner='<span class="source-list-name">'+esc(s.name||"Source")+'</span>'
          +'<span class="source-list-meta">'+(n!=null?"~"+fmt(n)+" people staged":"Sized on the first pull")
          +" &middot; drafted, nothing sends"
          +(s.list_id?' &middot; <span class="action-link">View the list</span>':"")+'</span>';
        return s.list_id
          ?'<a class="source-list-card source-list-card--link" href="/app/lists.html#'+esc(s.list_id)+'">'+inner+'</a>'
          :'<div class="source-list-card">'+inner+'</div>';
      }).join("")+'</div>';
      mine.forEach(s=>{
        const pool=poolOf(s);
        if(pool) paintPoolCard(c,pool);
      });
      bindSigRows(c);
      maybeSourcesEmpty();
    });

function render(r){
  const sent=r.sent||0, rep=r.replied||0;
  const rr=(r.reply_rate!=null)? r.reply_rate : (sent? (rep/sent*100):0);
  const job = esc((r.suggested_action||r.title||"Review this campaign")).replace(/^(\w)/,c=>c.toUpperCase());
  const why = cleanWhy(r.detail) || `${fmt(sent)} emails, ${fmt(rep)} replies (${(+rr).toFixed(2)}%). ${esc(r.title||"")}`;
  const bars = barsFrom(r.variants);
  const seqUrl = r.smartlead_url? r.smartlead_url.replace("/analytics","/sequences") : "";
  const app = `
  <div class="wrap">
    <div class="eyebrow">Optimisation cockpit</div>
    <div class="head"><div>
      <h1>${esc(r.campaign_name||("Campaign "+r.campaign_id))}</h1>
      <div class="head-sub"><span class="pill g"><span class="dot"></span> Running</span>
        <span>${esc(r.client||"Navreo")} · campaign <span class="tnum">${esc(r.campaign_id)}</span></span><span>·</span>
        ${r.smartlead_url?`<a class="slink" href="${esc(r.smartlead_url)}" target="_blank" rel="noopener">Open in Smartlead ↗</a>`:""}</div>
    </div></div>
    <div class="pinwrap"><div class="pin" id="pin">
      <div class="pin-top"><span class="pin-kick" id="pin-kick">You're working on this</span>
        <button class="pin-min" onclick="togglePin()" aria-label="Minimise" title="Minimise so you have room to navigate">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg></button></div>
      <div class="pin-job" id="pin-job">${job}</div>
      <div class="pin-why">${why}</div>
      ${bars}
      <div class="pin-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> This is a suggestion — nothing changes until you action it in Smartlead.</div>
      <div class="pin-foot"><button class="btn primary" id="done-btn" onclick="markDone('${esc(r.id)}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> Mark this optimisation done</button></div>
    </div></div>
    <nav class="campaign-tabs" role="tablist" aria-label="Campaign sections">
      <button class="campaign-tab is-active" data-tab="overview" onclick="showTab('overview')">Overview</button>
      <button class="campaign-tab" data-tab="messaging" onclick="showTab('messaging')">Messaging</button>
      <button class="campaign-tab" data-tab="leads" onclick="showTab('leads')">Leads <span class="tab-count tnum" id="leads-tabcount">(${fmt(sent)})</span></button></nav>
    <div class="campaign-page-body">
    <section class="tab-panel" data-tab="overview">
      ${glanceHTML(r)}
    </section>
    <section class="tab-panel hidden" data-tab="messaging">
      <div class="ov-card"><div class="card-title">Version performance</div>
        <p class="card-subtitle">Every version, one row per email step &mdash; send/reply counters from Smartlead, meetings from our reply archive (positives = Smartlead's interested mark).</p>
        <div id="messaging-root"><p class="lw-loading">Pulling live version stats from Smartlead&hellip;</p></div></div>
      <div class="ov-card"><div class="card-title">The sequence</div>
        <div id="sequence-root"><p class="card-subtitle">Loading&hellip;</p></div>
        <p class="sample-footer">The live copy itself stays in Smartlead (the only safe place to edit it).${seqUrl?' <a class="action-link action-link--bare" href="'+esc(seqUrl)+'" target="_blank" rel="noopener">Open the sequence in Smartlead</a>':""}</p></div>
    </section>
    <section class="tab-panel hidden" data-tab="leads">
      <div class="ov-card cl-grid"><div class="clg-head"><div class="card-title" style="margin:0">Live audience</div>
        <button class="btn" id="clg-download" title="Download every lead in this campaign as CSV — includes which source list each lead came from"><span class="dlicon"></span> Download</button></div>
        <div id="leads-grid"><p class="lw-loading">Pulling the live audience from Smartlead&hellip;</p></div></div>
      <div class="sources-section" id="draft-sources-section"><div class="section-label">Previously uploaded lists</div>
        <div id="draft-sources-root"></div><div id="sources-root"><p class="lw-loading">Loading&hellip;</p></div>
        <div id="sources-empty"></div>
        <button class="add-tile" id="al-add" title="Copies the add-more-leads brief for this campaign — paste it into Claude Code"><span class="plus">＋</span> Add more leads</button></div>
    </section>
    </div>
  </div>
  <div class="toast" id="toast">✓ Marked done — staged for approval</div>`;
  return app;
}

function emptyState(msg){
  return `<div class="wrap"><div class="eyebrow">Optimisation cockpit</div>
    <div class="ov-card" style="margin-top:20px"><div class="card-title">Nothing to work on here</div>
    <div class="card-subtitle">${esc(msg||("No open optimisation found for campaign "+(CID||"")+". It may already be actioned, or this campaign has no flags right now."))}</div></div></div>`;
}

// ── interactions ──
let ROW=null; /* the pinned optimisation, for lazy tab hydration */
function togglePin(){ $("pin").classList.toggle("collapsed"); }
function showTab(name){
  document.querySelectorAll(".tab-panel").forEach(p=>p.classList.toggle("hidden", p.getAttribute("data-tab")!==name));
  document.querySelectorAll(".campaign-tab").forEach(t=>t.classList.toggle("is-active", t.getAttribute("data-tab")===name));
  if(name==="messaging" && ROW){ hydrateMessaging(ROW); hydrateSequenceCopy(ROW); }
  if(name==="leads" && ROW){ hydratePlatformLeads(coOf(ROW)); hydrateDraftSources(coOf(ROW)); paintSources(); }
}
function toast(msg){ const t=$("toast"); if(!t) return; t.textContent=msg; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),2600); }
async function markDone(nid){
  const pin=$("pin"), btn=$("done-btn");
  if(pin.classList.contains("done")) return;
  btn.disabled=true;
  try{
    const r=await fetch(`/api/notifications/${encodeURIComponent(nid)}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:"actioned"})});
    if(!r.ok) throw new Error("bad status");
    pin.classList.add("done"); $("pin-kick").textContent="Done — staged for approval";
    btn.className="btn done"; btn.textContent="✓ Done"; toast("✓ Marked done — staged for approval");
  }catch(e){ btn.disabled=false; toast("Couldn't mark done — try again"); }
}

async function boot(){
  if(!CID && !NID){ $("app").innerHTML=emptyState("Open this page with ?c=<campaign id> (or ?nid=<optimisation id>)."); return; }
  try{
    const url = NID ? `/api/notifications?id=${encodeURIComponent(NID)}` : `/api/notifications?campaign_id=${encodeURIComponent(CID)}`;
    let data = await fetch(url,{cache:"no-store"}).then(r=>r.json());
    let rows = Array.isArray(data)?data:(data.items||data.data||data.rows||[]);
    rows = rows.filter(r=>(r.status||"new")==="new" || NID);
    if(!rows.length){ $("app").innerHTML=emptyState(); return; }
    const row=pickPrimary(rows);
    ROW=row;
    $("app").innerHTML = render(row);
    /* every tab hydrates from the same cockpit endpoints as the campaign
       page; the leads hub prefetches so the tab is ready when clicked */
    hydrateAudience(row.campaign_id);
    hydrateMessaging(row);
    hydrateSequenceCopy(row);
    hydratePlatformLeads(coOf(row));
    hydrateDraftSources(coOf(row));
  }catch(e){ $("app").innerHTML=emptyState("Couldn't load this optimisation ("+esc(e.message||e)+")."); }
}
boot();

</script>
</body>
</html>
