:root{
  --orange:#FF4D00;--orange-600:#DB4100;--orange-100:#FFE4D6;
  --ink:#14110E;--ink-2:#3A332C;--ink-3:#6B6055;
  --cream:#F7F7F6;--cream-50:#F7F7F6;--light-200:#DDDDDA;  /* beige retired → tool neutral (black/white/orange) */
  --bg:#FFFFFF;--card:#FFFFFF;--line:#ECECEA;--line-2:#DDDDDA;
  --green:#2E7D5B;--amber:#8F6600;
  --font-sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-display:"Acid Grotesk","DM Sans",system-ui,sans-serif;--radius:12px;
}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{font-family:var(--font-sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.55;}
a{color:inherit;text-decoration:none}
.app{display:grid;grid-template-columns:312px 1fr;height:100%;}
/* ---------- sidebar (the idea list = the "other pages"); warm, not gray ---------- */
.side{background:var(--bg);border-right:1px solid var(--line);padding:22px 14px;overflow:auto;}
.brand{display:flex;align-items:baseline;gap:8px;padding:2px 10px 14px;}
.brand b{font-family:var(--font-display);font-size:20px;letter-spacing:-.02em;}
.brand .ey{font-size:10.5px;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase;}
.client{margin:0 10px 12px;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:12px;}
.client .lbl{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);}
.client .name{font-size:14.5px;font-weight:600;margin-top:3px;}
.sechead{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);padding:8px 12px 6px;}
.im{display:block;position:relative;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px;transition:.13s;}
.im:hover{background:var(--cream-50);border-color:var(--line);}
.im-name{font-size:14px;font-weight:600;line-height:1.3;margin:0;}
.im-caption{font-size:12.5px;color:var(--ink-3);margin:3px 0 10px;}
.kpill-wrap{margin:0 0 10px;}
.kpill{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border-radius:999px;padding:3px 10px;}
.kpill-list{color:var(--orange-600);background:var(--orange-100);}
.kpill-live{color:var(--green);background:rgba(46,125,91,.13);}
.kdot{width:7px;height:7px;border-radius:50%;background:var(--green);position:relative;flex:none;}
.kdot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--green);animation:kpulse 1.6s ease-out infinite;}
@keyframes kpulse{0%{transform:scale(1);opacity:.7;}70%{transform:scale(2.6);opacity:0;}100%{opacity:0;}}
@media (prefers-reduced-motion:reduce){.kdot::after{animation:none;}}
.im-count{display:flex;align-items:center;gap:8px;margin:0 0 9px;font-size:12.5px;color:var(--ink-3);}
.im-number{font-family:var(--font-display);font-size:16px;letter-spacing:-.02em;color:var(--ink);}
.im-type{display:inline-flex;font-size:11px;font-weight:600;color:var(--ink-2);background:transparent;border:1px solid var(--line-2);border-radius:999px;padding:3px 10px;margin:0 0 10px;}
.im-track{display:flex;gap:3px;}
.im-track i{flex:1;height:4px;border-radius:2px;background:var(--line-2);}
/* active card (default = first; :has lights the targeted one) */
.im.on{background:var(--bg);border-color:var(--line-2);}
.im.on::before{content:"";position:absolute;left:-14px;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--orange);}
/* ---------- workspace ---------- */
.work{overflow:auto;}
.idea-view{display:none;}   /* shown by the checked idea radio — see ideanav_css() */
.wrap{max-width:860px;padding:30px 40px 90px;}
.wtop{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.status{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;}
.h1{font-family:var(--font-display);font-size:32px;letter-spacing:-.03em;line-height:1.08;margin:22px 0;}
.recc{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--orange-600);background:var(--orange-100);border-radius:999px;padding:3px 10px;margin-left:10px;vertical-align:middle;}
.capline{font-size:14px;color:var(--ink-3);margin-top:6px;}
.tabin{position:absolute;width:0;height:0;opacity:0;pointer-events:none;}
.tabs{display:flex;gap:7px;flex-wrap:wrap;}
.tabs label{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;transition:.12s;}
.tabs label:hover{border-color:var(--line-2);}
.tabs .ring{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line-2);}
.toptabs{margin-bottom:22px;}
.typetag{display:inline-flex;align-items:center;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--ink-2);background:var(--cream-50);border:1px solid var(--line-2);border-radius:999px;padding:5px 13px;margin-left:12px;vertical-align:middle;white-space:nowrap;}
.desc{font-size:17px;line-height:1.55;color:var(--ink);max-width:640px;margin:0 0 4px;letter-spacing:-.01em;}
.desc b{background:linear-gradient(transparent 62%, var(--orange-100) 62%);font-weight:600;}
.panels{margin-top:0;}
.panel{display:none;}
.eyb{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:0 0 12px;}
.chip{display:inline-flex;font-size:13.5px;padding:6px 12px;border-radius:9px;background:var(--cream-50);border:1px solid var(--line);color:var(--ink-2);}
.chip-sub{color:var(--ink-3);} .chip-more{color:var(--ink-3);background:transparent;}
.tgt-meta{font-size:13px;color:var(--ink-2);margin:0;}
.tgt-note{font-size:12.5px;color:var(--ink-3);margin:14px 0 0;line-height:1.5;max-width:640px;}
.share-box{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);}

function tgtLabel(k){return TGT_LABELS[k]||"What we target";}
const TGT_TYPES={targeted_list:"Niche list",lookalike:"Lookalike",prospeo_signal:"Buying signal",hiring_signal:"Hiring signal",engagement_signal:"Engagement signal",followers:"Follower audience",news_intent:"News signal",recontact:"Re-approach",events:"Event audience"};
function tgtType(x){const k=x.targeting&&x.targeting.kind;return TGT_TYPES[k]?`<div class="mech">${esc(TGT_TYPES[k])}</div>`:'';}
// Sidebar card pill (Bjion, 2026-08-03): a SIGNAL is live + monitored, so green
// with a pulsing dot and "LIVE - <name>"; a fixed list is a one-off pull, so a
// plain orange pill, no dot.
const SIGNAL_NAMES={prospeo_signal:"Buying signal",hiring_signal:"Hiring signal",engagement_signal:"Social Engagement",news_intent:"In the news"};
const LIST_NAMES={targeted_list:"Targeted list",lookalike:"Lookalike list",followers:"Follower list",recontact:"Re-approach list",events:"Event list"};
function kindPill(x){
  const t=x.targeting||{};const k=t.kind;if(!k)return '';
  if(SIGNAL_NAMES[k]){
    // name the SPECIFIC signal (targeting.signal) when the run gives one,
    // e.g. "Runs a sales stack", falling back to the generic type name.
    const name=t.signal||SIGNAL_NAMES[k];
    return `<p class="kpill-wrap"><span class="kpill kpill-live"><span class="kdot"></span>LIVE - ${esc(name)}</span></p>`;
  }
  return `<p class="kpill-wrap"><span class="kpill kpill-list">${esc(LIST_NAMES[k]||'Targeted list')}</span></p>`;
}
function grpChip(c){const i=String(c).indexOf(' — ');if(i<0)return `<span class="chip">${esc(c)}</span>`;return `<span class="chip">${esc(String(c).slice(0,i))}<span class="chip-sub"> — ${esc(String(c).slice(i+3))}</span></span>`;}
function grpSection(label,chips){return (label&&chips&&chips.length)?`<div class="sect"><p class="eyb">${esc(label)}</p><div class="chips">${chips.map(grpChip).join('')}</div></div>`:'';}
// Data-driven Targeting: render whatever labelled groups the idea supplies (each
// falling back to its per-kind default), so the Targeting page fits every campaign
// use-case (niche list, buying/hiring/engagement/news signal, followers, lookalike,
// recontact, events) rather than the frozen lookalike headers. Legacy anchors/cases
// runs are shimmed into groups so they render unchanged.
function targetingSections(x){
  const t=x.targeting||{};
  let groups=Array.isArray(t.groups)?t.groups.slice():[];
  if(!groups.length){
    if(x.anchors&&x.anchors.length)groups.push({label:tgtLabel(t.kind||'lookalike'),chips:x.anchors});
    if(x.cases&&x.cases.length)groups.push({label:'Case studies we pull',chips:x.cases});
  }
  let h=groups.map(g=>grpSection(g.label||tgtLabel(t.kind),g.chips)).join('');
  if(((t.roles)||[]).length)h+=`<div class="sect"><p class="eyb">Decision-makers we email</p><div class="chips">${rolesChips(x)}</div></div>`;
  if(typeof t.meta==='string'&&t.meta.trim())h+=`<div class="sect"><p class="eyb">Scope</p><p class="tgt-meta">${esc(t.meta)}</p></div>`;
  else if(Array.isArray(t.meta)&&t.meta.length)h+=`<div class="sect"><p class="eyb">Scope</p><p class="tgt-meta">${t.meta.map(m=>esc(m[0])+': '+esc(m[1])).join('  ·  ')}</p></div>`;
  if(t.note)h+=`<p class="tgt-note">${esc(t.note)}</p>`;
  return h;
}
function versionFrame(x){
  // client mode: the email body is editable in place; Save posts a copy-edit
  const ed=CLIENT_MODE?' contenteditable="true" data-edit="email" spellcheck="true"':'';
  return `<div class="mail"><div class="mh">Subject: ${highlightTokensHtml(x.subject||x.caption||'')}</div><div class="mb"${ed}>${highlightTokensHtml(x.email||'')}</div></div>`;}
// The email SEQUENCE: each step (First email, Follow-up, …) has its own copy
// variations shown as tabs. Derived from older shapes (versions[] + followup)
// for back-compat. sequence[0].versions[0] is the primary (mirrors idea.email).
function sequenceOf(x){
  if(Array.isArray(x.sequence)&&x.sequence.length)return x.sequence;
  const step1={name:'First email',versions:(Array.isArray(x.versions)&&x.versions.length)
    ?x.versions:[{subject:x.subject||x.caption||'',email:x.email||''}]};
  const seq=[step1];
  if(x.followup)seq.push({name:'Follow-up',versions:[{subject:'',email:x.followup}]});
  return seq;
}
function primaryVersion(x){return (((sequenceOf(x)[0]||{}).versions||[])[0])||{};}
function mailFrameHl(subject,email,editKey){
  const ed=(CLIENT_MODE&&editKey)?` contenteditable="true" data-edit="${editKey}" spellcheck="true"`:'';
  const head=subject?`Subject: ${highlightTokensHtml(subject)}`:'Sent a few days later, same thread';
  return `<div class="mail"><div class="mh">${head}</div><div class="mb"${ed}>${highlightTokensHtml(email)}</div></div>`;}
// "Share a link" on the Summary page (Bjion, 2026-08-02): GTME-only by design —
// the Summary tab never renders in client mode. Mints this board's client
// permalink (copy-edit-only view) and puts it on the clipboard.
function shareBlock(){
  if(CLIENT_MODE)return '';
  return `<div class="share-box"><p class="share-head">Share with your client</p>`
    +`<p class="share-sub">They get this board with just Targeting, Icebreaker and Copy. They can edit the emails; they never see Build.</p>`
    +`<div class="actions-center"><button class="btn-ink" id="gtme-share-link">Share a link</button></div>`
    +`<p class="share-out" id="share-out"></p></div>`;
}
// Final launch sign-off code (Bjion, 2026-08-03): a stable per-idea-per-run
// code the GTME pastes into chat to authorise the build (create campaign +
// pull the list + run the checks). Deterministic so it's the same every render.
function launchCode(x){
  const s=(SERVED_RUN_ID||RUN_ID||'')+':'+(x.id||'');
  let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}
  return 'LAUNCH-'+('000000'+h.toString(36).toUpperCase()).slice(-6);
}
async function gtmeShareLink(btn){
  const rid=SERVED_RUN_ID||RUN_ID;
  const out=document.querySelector('#share-out');
  if(!rid){if(out)out.textContent='This board needs its own page first — ask in chat to republish it.';return;}
  btn.disabled=true;btn.textContent='Making your link…';
  try{
    const r=await fetch('/api/strategy/share',{method:'POST',credentials:'include',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({run_id:rid})});
    const j=await r.json();
    btn.disabled=false;
    if(!j.ok){btn.textContent='Share a link';if(out)out.textContent=j.message||'Could not make the link, try again.';return;}
    const full=location.origin+j.url;
    let copied=false;
    try{await navigator.clipboard.writeText(full);copied=true;}catch(e){}
    btn.textContent=copied?'Link copied':'Share a link';
    if(out)out.innerHTML=(copied?'On your clipboard, ready to send: ':'Copy this and send it: ')
      +`<a href="${esc(full)}" target="_blank" rel="noopener">${esc(full)}</a>`;
    setTimeout(()=>{btn.textContent='Share a link';},5000);
  }catch(e){btn.disabled=false;btn.textContent='Share a link';if(out)out.textContent='Could not make the link, try again.';}
}
async function persistVisibleEdits(x){
  const eds=[...document.querySelectorAll('.mb[data-edit]')].filter(el=>el.dataset.dirty==='1'&&el.innerText.trim());
  for(const el of eds){
    try{await fetch('/api/strategy/copy-edit',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({run_id:SERVED_RUN_ID||RUN_ID,ideaId:x.id,field:el.dataset.edit,value:el.innerText.trim(),share:SHARE})});
      el.dataset.dirty='';}catch(e){}
  }
}
async function clientSaveCopy(x,btn){
  const eds=[...document.querySelectorAll('.mb[data-edit]')].filter(el=>el.innerText.trim());
  if(!eds.length){btn.textContent='Nothing to save';return;}
  btn.disabled=true;btn.textContent='Saving…';
  try{
    for(const el of eds){
      const r=await fetch('/api/strategy/copy-edit',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({run_id:SERVED_RUN_ID||RUN_ID,ideaId:x.id,field:el.dataset.edit,value:el.innerText.trim(),share:SHARE})});
      const j=await r.json();
      if(!j.ok){btn.disabled=false;btn.textContent=(j.message||'Could not save, try again');return;}
    }
    btn.disabled=false;btn.textContent='Saved — your team will see this';
    setTimeout(()=>{btn.textContent='Save my edits';},4000);
  }catch(e){btn.disabled=false;btn.textContent='Could not save, try again';}
}

/* Summary page — up to 5 real mapped people per idea (run.people[idea.id]),
   every merge field resolved: what actually lands in their inbox. */
const LINE_ORDER=['safe','detail','colleague'];
function summaryProspects(x){
  let arr=(PEOPLE[x.id]||[]).slice(0,5);
  if(!arr.length&&x.firstName)arr=[{first:x.firstName,title:'',company:x.company||'',lines:{}}];
  return arr;
}
function openerFor(p){
  const L=p.lines||{};
  for(const k of LINE_ORDER)if(L[k])return L[k];
  return "Apologies if this isn't relevant, wasn't sure who at "+(p.company||"your company")+" was the best person for this.";
}
function resolvedEmail(x,p){
  const opener=openerFor(p);
  if(x.email){
    return String(x.email)
      .replace(/\{\{?first(_name)?\}?\}/gi,p.first||'')
      .replace(/\{\{?company\}?\}/gi,p.company||'')
      .replace(/\{\{?icebreaker\}?\}/gi,opener)
      .replace(/\{\{?colleague\}?\}/gi,COLLEAGUES[x.id]||'a colleague')
      .replace(/%signature%/gi,"Bjion\nNavreo");
  }
  const parts=[opener,x.pain||'',x.offer||''].filter(Boolean);
  return "Hey "+(p.first||'there')+",\n\n"+parts.join("\n\n")+"\n\nWorth a quick chat?\n\nBjion\nNavreo";
}
// Summary email as HTML with every SUBSTITUTED variable highlighted (Bjion,
// 2026-08-03): escape the whole template first, THEN swap tokens for
// highlighted, escaped per-person values — so the reader sees exactly which
// words are personalised for this prospect. esc() leaves {tokens} intact,
// which is what makes replace-after-escape safe.
function _mvar(v){return `<span class="mvar">${esc(v)}</span>`;}
// Copy tab shows the TEMPLATE: highlight the merge TOKENS themselves so the GTME
// sees what is personalised (the real values aren't known until we have a person).
function highlightTokensHtml(t){
  return esc(String(t||''))
    .replace(/\{\{?first(_name)?\}?\}/gi,m=>`<span class="mvar">${m}</span>`)
    .replace(/\{\{?company\}?\}/gi,m=>`<span class="mvar">${m}</span>`)
    .replace(/\{\{?icebreaker\}?\}/gi,m=>`<span class="mvar">${m}</span>`)
    .replace(/\{\{?colleague\}?\}/gi,m=>`<span class="mvar">${m}</span>`)
    .replace(/%signature%/gi,m=>`<span class="mvar">${m}</span>`)
    .replace(/\n/g,'<br>');
}
// Summary shows the RESOLVED email for one person, with every substituted value highlighted.
function resolvedTextHtml(text,x,p){
  const opener=openerFor(p);
  if(text){
    return esc(String(text))
      .replace(/\{\{?first(_name)?\}?\}/gi,_mvar(p.first||''))
      .replace(/\{\{?company\}?\}/gi,_mvar(p.company||''))
      .replace(/\{\{?icebreaker\}?\}/gi,_mvar(opener))
      .replace(/\{\{?colleague\}?\}/gi,_mvar(COLLEAGUES[x.id]||'a colleague'))
      .replace(/%signature%/gi,_mvar('Bjion')+'<br>'+_mvar('Navreo'))
      .replace(/\n/g,'<br>');
  }
  const parts=[_mvar(opener),esc(x.pain||''),esc(x.offer||'')].filter(s=>s&&s!=='<span class="mvar"></span>');
  return 'Hey '+_mvar(p.first||'there')+',<br><br>'+parts.join('<br><br>')+'<br><br>Worth a quick chat?<br><br>Bjion<br>Navreo';
}
function resolvedEmailHtml(x,p){return resolvedTextHtml(primaryVersion(x).email||x.email,x,p);}
function resolvedSubjectHtml(x,p){
  const s=String(primaryVersion(x).subject||x.subject||x.caption||'');
  const cap=s.charAt(0).toUpperCase()+s.slice(1);
  return esc(cap)
    .replace(/\{\{?first(_name)?\}?\}/gi,_mvar(p.first||''))
    .replace(/\{\{?company\}?\}/gi,_mvar(p.company||''));
}
function openerRows(){return ICEB.map((o,i)=>{const name=o[0],rec=o[1],plain=o[2],ex=o[3];
  const recH=rec?' <span class="ib-rec">Recommended</span>':'';const up=i===0?' disabled':'';const dn=i===ICEB.length-1?' disabled':'';
  return `<div class="opener-row"><div class="opener-order"><span class="opos">${i+1}</span><button class="oarrow"${up}>▲</button><button class="oarrow"${dn}>▼</button></div>`
    +`<div class="opener-body"><p class="ib-name">${esc(name)}${recH}</p><p class="ib-plain">${esc(plain)}</p><p class="ib-example">"${esc(ex)}"</p></div><span class="otog">On</span></div>`;}).join('');}

function panelHTML(x){
  if(tab==='tgt') return `<div class="desc">${esc(cap120(x.who||''))}</div><div class="tgt-hero">${tgtType(x)}${numBig(x)}</div>${targetingSections(x)}`;
  if(tab==='copy'){
    const seq=sequenceOf(x);const AZ='ABCDEFGHIJ';
    let h=`<p class="copy-heading">Your emails</p>`
      +`<p class="copy-sub">Each email in the sequence has a few versions we rotate so no two sends look the same. The follow-up goes to anyone who doesn't reply.</p>`;
    seq.forEach((step,si)=>{
      const vs=step.versions||[];const sel=Math.min(copyVer[si]||0,Math.max(0,vs.length-1));
      h+=`<p class="mail-label">${esc(step.name||('Email '+(si+1)))}</p>`;
      if(vs.length>1){
        h+=`<div class="ver-tabs">`+vs.map((v,vi)=>`<button class="ver-tab${vi===sel?' on':''}" data-si="${si}" data-vi="${vi}">Version ${AZ[vi]}</button>`).join('')+`</div>`;
      }
      const v=vs[sel]||{};

    h+=(CLIENT_MODE
        ?`<div class="actions-center"><button class="btn-ink" id="client-save-copy">Save my edits</button></div>`
         +`<p class="hooknote" style="margin-top:10px">Click into an email above to edit it. Saving shares it with your team.</p>`

  }
  if(tab==='first') return `<p class="copy-heading">The opener</p><div class="opener-list">${openerRows()}</div>`
    +`<p class="hooknote" style="margin-top:16px">We try these in order for each person, and always have the safe opener as backup.</p>`
    +`<div class="actions-center"><button class="btn-ink">Next: your emails</button></div>`;
  if(tab==='build'){
    // Summary = P4 "Filmstrip" (Bjion's pick, 2026-08-02): people strip on top,
    // the selected person's fully-resolved email below, website + LinkedIn links
    // (person's own if the run supplies them, safe search links otherwise).
    const ppl=summaryProspects(x);if(sIdx>=ppl.length)sIdx=0;
    if(!ppl.length)return `<p class="eyb">Summary</p><div class="ph">Once this idea has its people mapped, real examples show up here.</div>`
      +shareBlock();
    const pr=ppl[sIdx];
    const more=Math.max(0,(x.reachablePool||x.net||0)-ppl.length);
    // each person's own links live IN their thumbnail (Bjion, 2026-08-03):
    // their real website/LinkedIn if the run supplies them, safe search links
    // otherwise. stopPropagation so opening a link doesn't also switch cards.
    const purl=p=>({
      w:p.website||('https://www.google.com/search?q='+encodeURIComponent(p.company||p.first||'')),
      l:p.linkedin||('https://www.linkedin.com/search/results/all/?keywords='+encodeURIComponent(p.company||p.first||''))});
    const strip=ppl.map((p,i)=>{const u=purl(p);return `<div class="sum-card ${i===sIdx?'on':''}" data-i="${i}"><span class="sum-av">${esc((p.first||'?')[0])}</span><div class="sum-cbody"><div class="sum-cnm">${esc(p.first)}</div><div class="sum-ccm">${esc(p.company||'')}</div><div class="sum-clinks"><a href="${esc(u.w)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Website ↗</a><a href="${esc(u.l)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">LinkedIn ↗</a></div></div></div>`;}).join('')
      +(more?`<div class="sum-more">+ ${num(more)} more like them</div>`:'');
    return `<p class="eyb">Summary</p>`
      +`<p class="sum-lead">This goes to <b>${num(x.reachablePool||x.net)}</b> people. Tap one to read their email.</p>`
      +`<div class="sum-strip">${strip}</div>`
      +`<div class="sum-meta"><span class="mt">${esc(pr.first)}${pr.title?' — '+esc(pr.title):''}${pr.company?', '+esc(pr.company):''}</span></div>`
      +sequenceOf(x).map((step,si)=>{
        const v=(step.versions||[])[0]||{};
        const head=si===0?`Subject: <span class="ms">${resolvedSubjectHtml(x,pr)}</span>`:'Sent a few days later, same thread';
        return `<p class="mail-label">${esc(step.name||('Email '+(si+1)))}</p>`
          +`<div class="mail"><div class="mh">${head}</div><div class="mb">${resolvedTextHtml(v.email,x,pr)}</div></div>`;
      }).join('')
      +`<p class="sum-note">${esc(pr.first)} gets this version — their name, their company, their opener. Nothing generic.</p>`
      +shareBlock();
  }
  const p=x.reachablePool||x.net;
  const cks=checksFor(x);
  const doneN=cks.filter(c=>c[2]).length;
  const phrase=`Launch "${x.name}" · code ${launchCode(x)}`;
  const goBlock=CLIENT_MODE?'':`<div class="launch-go">`
    +`<p class="lg-head">Give the final go-ahead</p>`
    +`<p class="lg-sub">Nothing pulls, builds or sends until you paste this line into the chat:</p>`
    +`<div class="lg-code"><code id="lg-phrase">${esc(phrase)}</code><button class="lg-copy" id="lg-copy">Copy</button></div>`
    +`</div>`;
  return `<p class="eyb">Launch</p>`
    +goBlock
    +`<div class="livebanner">Not live yet. The campaign turns on when you give the go-ahead above, and nothing sends until then.</div>`
    +`<div class="checks">`+cks.map(c=>`<div class="chk${c[2]?' done':''}"><span class="ck">${c[2]?'✓':''}</span><div><div class="cl">${c[0]}</div><div class="cn">${esc(c[1])}</div></div><span class="chk-state${c[2]?' is-done':''}">${c[2]?'Done':'Ran before launch'}</span></div>`).join('')+`</div>`;
}

  const cards=IDEAS.map((x,i)=>{const service=(x.service||'').replace('->','→');
    return `<div class="im ${i===active?'active':''}" data-i="${i}"><p class="im-name">${esc(x.name)}</p>`
      +`<p class="im-caption">${esc(x.caption||'')}</p>`
      +kindPill(x)
      +`<p class="im-count"><span class="im-number">${num(x.net||x.reachablePool)}</span> reachable</p>`

  side.innerHTML=(client?`<div class="client"><div class="lbl">Building for</div><div class="name">${esc(client)}</div></div>`:'')
    +`<div class="sechead">${IDEAS.length} campaign idea${IDEAS.length===1?'':'s'}</div>${cards}`;
  side.querySelectorAll('.im').forEach(c=>c.onclick=()=>{active=+c.dataset.i;tab='tgt';sIdx=0;copyVer={};render();});
}
function renderWorkspace(){
  const x=IDEAS[active];
  if(!x){work.innerHTML='<div class="empty-pick">Pick an idea on the left.</div>';return;}
  const pills=`<div class="tabs">`+TABS.map(t=>`<label class="${t[0]===tab?'active':''}" data-tab="${t[0]}"><span class="ring"></span>${esc(t[1])}</label>`).join('')+`</div>`;
  work.innerHTML=`<div class="wrap">${pills}<h1 class="h1">${esc(x.name)}</h1><div class="panels"><section class="panel">${panelHTML(x)}</section></div></div>`;
  work.querySelectorAll('.tabs label').forEach(l=>l.onclick=()=>{tab=l.dataset.tab;renderWorkspace();});
  const csb=work.querySelector('#client-save-copy');
  if(csb)csb.onclick=()=>clientSaveCopy(x,csb);
  const shb=work.querySelector('#gtme-share-link');
  if(shb)shb.onclick=()=>gtmeShareLink(shb);
  // version tabs: switch which variation shows for a sequence step. In client
  // mode, persist any edit in the visible email before switching so it isn't lost.
  work.querySelectorAll('.ver-tab').forEach(t=>t.onclick=async()=>{
    if(CLIENT_MODE)await persistVisibleEdits(x);
    copyVer[+t.dataset.si]=+t.dataset.vi;renderWorkspace();});
  if(CLIENT_MODE)work.querySelectorAll('.mb[data-edit]').forEach(el=>el.oninput=()=>{el.dataset.dirty='1';});
  const lgc=work.querySelector('#lg-copy');
  if(lgc)lgc.onclick=async()=>{const t=(work.querySelector('#lg-phrase')||{}).textContent||'';
    try{await navigator.clipboard.writeText(t);lgc.textContent='Copied';setTimeout(()=>{lgc.textContent='Copy';},3000);}catch(e){lgc.textContent='Select and copy';}};
  work.querySelectorAll('.sum-card').forEach(c=>c.onclick=()=>{sIdx=+c.dataset.i;renderWorkspace();});
}
function render(){renderSidebar();renderWorkspace();}

function fmtTime(u){try{const d=u?new Date(u):new Date();return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
function addUpdate(note,updated){
  const chip=document.createElement('div');
  chip.className='tchip';
  chip.innerHTML=`<span class="lt-dot"></span><span>${note?'<b>'+esc(note)+'</b>':'Updated from chat'} · ${fmtTime(updated)}</span>`;
  toast.prepend(chip);
  // depth fade: newest bright, older ones fade back as they're pushed down/out
  const kids=[...toast.children];
  requestAnimationFrame(()=>{chip.classList.add('in');
    // newest bright; each older one fades harder, so it's pushed out of view
    kids.forEach((c,i)=>{c.style.opacity=String(Math.max(0,1-i*0.22));});});
  if(kids.length>10)kids.slice(10).forEach(c=>c.remove()); // hard cap so the DOM never grows unbounded
}

  setTimeout(()=>p.classList.remove('spot'),1700);}
function goFocus(idx,vt){active=idx;tab=vt;sIdx=0;render();spotlightPanel();}
function showCatchup(idx,vt,note){let c=document.getElementById('catchup');
  if(!c){c=document.createElement('button');c.id='catchup';document.body.appendChild(c);}
  c.textContent=(note?note+' ':'Catch up ')+'↗';
  c.onclick=()=>{c.classList.remove('show');goFocus(idx,vt);};
  c.classList.add('show');clearTimeout(c._h);c._h=setTimeout(()=>c.classList.remove('show'),9000);}
function followFocus(foc){
  if(!foc||!foc.view)return;
  const vt=VIEW_TAB[foc.view];if(!vt)return; // 'board' etc. -> chip only, no jump
  const idx=foc.ideaId?IDEAS.findIndex(i=>i.id===foc.ideaId):active;
  if(idx<0)return;
  if(Date.now()-lastTouch<10000){showCatchup(idx,vt,foc.note);return;} // hand on board -> hold
  goFocus(idx,vt);
}
let SERVED_RUN_ID='';
async function fetchRun(){
  // never re-render over a client's half-typed edit — the poll catches up
  // on the next tick after they click away
  if(CLIENT_MODE&&document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.edit)return;
  try{
    const q=new URLSearchParams();
    if(RUN_ID)q.set('id',RUN_ID);
    if(SHARE)q.set('share',SHARE);
    const r=await fetch('/api/strategy/run'+(q.toString()?'?'+q.toString():''),{credentials:'include',cache:'no-store'});
    if(!r.ok){
      if(r.status===401&&CLIENT_MODE){boot.querySelector('p').textContent='This link has expired. Ask your contact for a fresh one.';}
      return;
    }
    const j=await r.json();const run=j.run||j;const ideas=(run&&run.ideas)||[];
    SERVED_RUN_ID=j.run_id||RUN_ID||'';
    const foc=j.focus||run.focus||{};
    const fp=JSON.stringify(ideas)+'|'+JSON.stringify(run.people||{})+'|'+(j.updated||run.updated||'')+'|'+(foc.ts||'')+'|'+(foc.note||'');
    if(fp===lastFP)return;
    const first=lastFP===null;
    IDEAS=ideas;client=run.client||run.clientLabel||client;
    RUN_META={checks:(run&&run.checks)||{}};
    PEOPLE=run.people||{};COLLEAGUES=run.colleagues||{};
    if(active>=IDEAS.length)active=0;
    render();boot.classList.add('gone');
    if(!first){addUpdate(foc.note||'',foc.ts||j.updated||run.updated);followFocus(foc);}
    lastFP=fp;
  }catch(e){/* keep last good board */}
}
fetchRun();
// hidden tabs skip the 5s poll — the visibilitychange re-fetch below catches
// the board up the moment the tab is shown again
setInterval(()=>{ if (document.hidden) return; fetchRun(); },5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)fetchRun();});
</script></body></html>
