<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Target · Navreo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="navreo.css">
<style>
/* Team Target — the team's shared monthly meetings board. Data (all live):
   /api/team-target/data (read), /api/team-target/meeting + /status (writes).
   Only ATTENDED meetings count toward the target of 4 per active client
   (owner ruling 2026-09-17). Design follows the P1 "scoreboard" prototype. */
.app > main{min-width:0}                 /* let the flex child shrink below content width */
.tt-wrap{max-width:1180px;margin:0 auto;padding:0 22px 60px;min-width:0}
.tt-tabs{min-width:0}
.tt-head{display:flex;align-items:center;gap:14px;padding:22px 0 4px}
.tt-head h1{font-family:var(--font-display);font-weight:400;font-size:24px;letter-spacing:-.02em;margin:0}
.tt-head .mo{color:var(--ink-3);font-size:15px}
.tt-head .sp{flex:1}
.tt-add{background:var(--orange);color:#fff;border:0;border-radius:999px;padding:10px 18px;font:600 14px var(--font-sans);cursor:pointer}
.tt-add:hover{filter:brightness(.95)}
.tt-tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:6px 0 26px}
.tt-tab{background:0;border:0;padding:10px 2px;font:500 15px var(--font-sans);color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tt-tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tt-tab .b{color:var(--ink-3);font-size:13px;margin-left:5px}
/* hero */
.hero{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.hero .big{font-family:var(--font-display);font-weight:400;font-size:96px;line-height:.9;letter-spacing:-.03em}
.hero .big small{font-size:38px;color:var(--ink-3);letter-spacing:-.02em}
.hero .rt{flex:1;min-width:240px}
.verdict{display:inline-block;border-radius:999px;padding:6px 14px;font:600 14px var(--font-sans);margin:8px 0 6px}
.verdict.behind{background:#F7DCD5;color:#C2371F}
.verdict.ok{background:#E2F1E9;color:#2E7D5B}
.pace{color:var(--ink-2);font-size:16px;margin:2px 0 0}
.subline{color:var(--ink-3);font-size:14px;margin-top:6px}
.bar{position:relative;height:12px;border-radius:7px;background:#EDEDEA;margin:20px 0 6px;max-width:920px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--orange)}
.bar .tick{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.bar .pending{position:absolute;top:0;bottom:0;border:1.5px dashed var(--orange);border-radius:7px;background:color-mix(in srgb,var(--orange) 12%,transparent);box-sizing:border-box}
.bar-lbl{font-size:12.5px;color:var(--ink-2);max-width:920px}
.bar-lbl .leg-pending{color:var(--ink-3);white-space:nowrap}
.bar-lbl .leg-pending::before{content:"";display:inline-block;width:16px;height:9px;border:1.5px dashed var(--orange);border-radius:3px;background:color-mix(in srgb,var(--orange) 12%,transparent);vertical-align:middle;margin-right:5px;box-sizing:border-box}
/* two-column chase + help */
.cols{display:grid;grid-template-columns:1fr 360px;gap:26px;margin-top:26px}
.h4{font-family:var(--font-display);font-weight:400;font-size:18px;margin:0 0 2px}
.hint{color:var(--ink-3);font-size:12.5px}
.prow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .who{flex:1;min-width:0}
.prow .nm{font-weight:600;font-size:14.5px}
.prow .sub{color:var(--ink-3);font-size:12.5px;margin-top:1px}
.prow .tag{font-size:10.5px;letter-spacing:.04em;color:var(--ink-4);text-transform:uppercase;margin-left:6px}
.wait{font-size:13px;color:var(--ink-3);white-space:nowrap}
.wait.amber{color:#8F6600}
.mk{background:#fff;border:1px solid var(--line-2);border-radius:8px;padding:6px 12px;font:600 12.5px var(--font-sans);cursor:pointer;white-space:nowrap}
.mk:hover{background:var(--bg-sunken)}
.mk.attend{background:#E2F1E9;border-color:#C4E2D3;color:#2E7D5B}
.mk.attend:hover{background:#D3EADD}
.help{background:var(--bg-sunken);border:1px solid var(--line);border-radius:14px;padding:16px}
.help .lead{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.help .z{color:var(--ink-2);font-size:13px;margin:4px 0 12px}
.help .crow{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.help .crow .cn{font-weight:600;font-size:13.5px;flex:1}
.pillw{background:#F8EAC4;color:#8F6600;border-radius:999px;padding:2px 9px;font:600 11.5px var(--font-sans)}
/* facts + trio */
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:30px}
.fact{background:#fff;padding:16px 18px}
.fact .v{font-family:var(--font-display);font-size:26px;font-weight:400;letter-spacing:-.01em}
.fact .v small{font-size:14px;color:var(--ink-3)}
.fact .k{color:var(--ink-3);font-size:12.5px;margin-top:2px}
.fact .v.amber{color:#8F6600}
/* status chooser */
.choices{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 12px}
.choice{border:1px solid var(--line-2);background:#fff;border-radius:8px;padding:6px 11px;font:600 12.5px var(--font-sans);cursor:pointer}
.choice:hover{background:var(--bg-sunken)}
.choice.cur{background:var(--ink);color:#fff;border-color:var(--ink)}
/* clients tab */
.crow2{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.dots{display:flex;gap:5px}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-2)}
.dot.on{background:var(--ink);border-color:var(--ink)}
.dot.g{background:#2E7D5B;border-color:#2E7D5B}
.cx{font-weight:600;font-size:14px;min-width:150px}
.cwait{color:var(--ink-3);font-size:13px;flex:1}
.done{color:#2E7D5B;font-weight:600;font-size:12.5px}
.fold{color:var(--ink-3);font-size:13px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
/* meetings */
.mgroup{font:600 12px var(--font-sans);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-4);margin:22px 0 2px}
.mlead{font-family:var(--font-display);font-size:18px;margin:0 0 4px}
.date{color:var(--ink-3);font-size:13px;white-space:nowrap}
.spill{font:600 12.5px var(--font-sans);border-radius:999px;padding:3px 10px}
.spill.booked{background:#EFEFEC;color:var(--ink-2)}
.spill.attended{background:#E2F1E9;color:#2E7D5B}
.spill.bad{background:#F7DCD5;color:#C2371F}
/* board — three live columns you can add to / move / remove from */
.board-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.bfilter{font-size:12.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.bfilter select{border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;font:500 13px var(--font-sans);background:#fff;color:var(--ink);cursor:pointer}
.board-alert{background:#F7DCD5;color:#C2371F;border-radius:10px;padding:10px 14px;font-size:13.5px;margin:12px 0 2px;font-weight:500}
.board-alert b{font-weight:700}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:10px;align-items:start}
.odpill{background:#F7DCD5;color:#C2371F;border-radius:999px;padding:2px 8px;font:600 11px var(--font-sans);margin-left:3px}
.date.od{color:#C2371F;font-weight:600}
.prow.overdue{background:#FDF4F1}
.bcol.over{outline:2px dashed var(--orange);outline-offset:-3px;background:#FFF3EE;border-radius:14px}
/* Notion-style meeting cards */
.bcol-list{padding-top:2px}
.mcard{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 13px;box-shadow:0 1px 2px rgba(20,17,14,.05);cursor:grab}
.mcard + .mcard{margin-top:10px}
.mcard:hover{box-shadow:0 3px 10px rgba(20,17,14,.09);border-color:var(--line-2)}
.mcard.dragging{opacity:.4;cursor:grabbing;box-shadow:0 6px 18px rgba(20,17,14,.14)}
.mcard.overdue{border-color:#F0C4B8}
.mcard-t{display:flex;gap:8px;align-items:flex-start;font-weight:600;font-size:14.5px;line-height:1.32;color:var(--ink);cursor:pointer;padding-right:16px}
.mcard-t:hover{color:#000}
.mcard-ic{flex:none;color:var(--ink-4);margin-top:1px}
.mcard-co{color:var(--ink-3);font-size:12.5px;margin:4px 0 0 23px}
.mcard-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mtag{display:inline-block;border-radius:6px;padding:2px 8px;font:600 11.5px var(--font-sans);white-space:nowrap}
.mtag.grey{background:#EFEFEC;color:var(--ink-2)}
.mtag.amber{background:#F8EAC4;color:#8F6600}
.mtag.red{background:#F7DCD5;color:#C2371F}
.mtag.green{background:#E2F1E9;color:#2E7D5B}
.mtag.auto{background:#F1F0ED;color:var(--ink-4);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:9.5px;padding:3px 7px}
.mcard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:11px}
.mcard-foot .mk{margin:0}
.mcard-by{color:var(--ink-4);font-size:11px;text-align:right;flex:1}
.mcard-del{position:absolute;top:8px;right:8px;background:0;border:0;color:var(--ink-4);font-size:16px;line-height:1;cursor:pointer;padding:1px 6px;border-radius:6px;opacity:.5;transition:opacity .12s,background .12s}
.mcard:hover .mcard-del{opacity:1}
.mcard-del:hover{color:#C2371F;background:#F7DCD5}
.bcol{background:var(--bg-sunken);border:1px solid var(--line);border-radius:14px;padding:12px 12px 6px}
.bcol-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:2px}
.bcol-h b{font-family:var(--font-display);font-weight:400;font-size:16px}
.bcol-h .bn{color:var(--ink-3);font-size:13px;margin-left:4px}
.bcol-sub{color:var(--ink-3);font-size:12px;margin-top:1px}
.badd{background:#fff;border:1px solid var(--line-2);border-radius:8px;padding:5px 10px;font:600 12.5px var(--font-sans);cursor:pointer;white-space:nowrap}
.badd:hover{border-color:var(--ink-3)}
.bempty{color:var(--ink-3);font-size:12.5px;padding:12px 2px}
.del{background:0;border:0;color:var(--ink-4);font-size:18px;line-height:1;cursor:pointer;padding:0 5px;border-radius:6px}
.del:hover{color:#C2371F;background:#F7DCD5}
.removed-sec{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
.rm-h{font:600 12px var(--font-sans);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-4);margin-bottom:2px}
.rm-h .hint{text-transform:none;letter-spacing:0;font-weight:400;margin-left:6px}
.rm-row{opacity:.72}
@media(max-width:820px){.board{grid-template-columns:1fr}}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,17,14,.28);display:none;align-items:center;justify-content:center;z-index:50}
.ov.on{display:flex}
.card{background:#fff;border-radius:16px;padding:24px;width:min(420px,92vw);box-shadow:0 18px 50px rgba(0,0,0,.18)}
.card h3{font-family:var(--font-display);font-weight:400;margin:0 0 14px}
.card label{display:block;font-size:12.5px;color:var(--ink-3);margin:12px 0 4px}
.card input,.card select{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line-2);border-radius:9px;font:400 14px var(--font-sans)}
.card .row{display:flex;gap:16px;justify-content:flex-end;align-items:center;margin-top:20px}
.card .note{color:var(--ink-3);font-size:12.5px;flex:1}
.ghost{background:0;border:0;color:var(--ink-3);font:500 14px var(--font-sans);cursor:pointer}
.skel{color:var(--ink-3);padding:40px 0}
@media(max-width:820px){.cols{grid-template-columns:1fr}.facts{grid-template-columns:repeat(2,1fr)}.hero .big{font-size:74px}}
@media(max-width:640px){
  .tt-wrap{padding:0 16px 48px}
  .tt-head{flex-wrap:wrap;gap:8px}.tt-head .sp{display:none}.tt-head h1{font-size:21px}
  .tt-add{margin-left:auto;padding:9px 15px}
  .tt-tabs{gap:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap}
  .tt-tab{white-space:nowrap}
  .hero{gap:4px}.hero .big{font-size:64px}.hero .rt{min-width:0}
  .prow{flex-wrap:wrap}.prow .who{flex-basis:100%}
  .prow .rt-cell{display:flex;align-items:center;gap:10px;margin-top:4px}
  .facts{grid-template-columns:repeat(2,1fr)}
  .crow2{flex-wrap:wrap}.crow2 .cwait{flex-basis:100%;order:5}
  .bar,.bar-lbl{max-width:none}
}
</style>
</head>
<body>
<div class="app">
  <div id="rail"></div>
  <main>
    <div class="tt-wrap">
      <div class="tt-head">
        <h1>Team Target</h1><span class="mo" id="tt-mo"></span>
        <span class="sp"></span>
        <button class="tt-add" data-tt="add-open" id="tt-addbtn">Add a meeting</button>
      </div>
      <div class="tt-tabs" id="tt-tabs"></div>
      <div id="tt-body"><div class="skel">Loading the board…</div></div>
    </div>
  </main>
</div>

<div class="ov" id="tt-ov">
  <div class="card">
    <h3>Add to the board</h3>
    <label>Stage</label><select data-tt="f-stage" id="f-stage">
      <option value="said_yes">Meeting-ready · said yes</option>
      <option value="booked" selected>Booked</option>
      <option value="attended">Attended</option>
    </select>
    <label>Client</label><select data-tt="f-client" id="f-client"></select>
    <label>Person</label><input data-tt="f-person" id="f-person" placeholder="Who is it with?">
    <label>Company</label><input data-tt="f-company" id="f-company" placeholder="Optional">
    <label>Date</label><input data-tt="f-date" id="f-date" type="date">
    <div class="row"><span class="note">Added to the stage you pick — move it along as things happen.</span>
      <button class="ghost" id="f-cancel">Cancel</button>
      <button class="tt-add" data-tt="add-save" id="f-save">Add</button></div>
  </div>
</div>

<script src="shell.js"></script>
<script src="team-target.js"></script>
</body>
</html>
