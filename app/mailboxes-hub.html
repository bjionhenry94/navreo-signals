<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mailboxes 2 · Navreo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="navreo.css">
<style>
/* mailboxes-hub (Mailboxes 2, preview) — deliverability as a founder-first hub.
   Reuses navreo.css primitives verbatim: .stats/.stat/.num-hero (KPIs),
   .chip (client filter), .tab (manager views), .tbl (tables), .pill (status).
   Only the heat-map cells + a couple of layout rows are page-scoped.
   Data (all real): /api/deliverability (verdict, KPIs, fix-today, manager
   tabs), /api/client-windows (client chips + per-client heat-map rows),
   /api/tag-performance (tag table). Every section degrades to a representative
   placeholder if its endpoint is empty/unreachable, so the page never blanks. */
.mbx-head{max-width:1240px;padding:8px 0 4px}
/* Confidence-grade badge (A healthiest … E least healthy), shown left of the
   domain in the manager tables. Colours ramp green → red with the grade. */
.grade-badge{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:5px;font:600 11px/1 var(--mono,"JetBrains Mono",monospace);margin-right:9px;vertical-align:middle;flex:0 0 auto;cursor:default}
.grade-badge.gr-A{background:#D6EBDD;color:#14512F}
.grade-badge.gr-B{background:#E8F0D2;color:#47570F}
.grade-badge.gr-C{background:#F8EAC4;color:#6B4A00}
.grade-badge.gr-D{background:#F6DFC9;color:#8A3D0E}
.grade-badge.gr-E{background:#F7DCD5;color:#861E10}
.grade-badge.gr-x{background:#F2F2F0;color:#8A857D}
.grade-legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12px;color:var(--ink-2)}
.grade-legend .gi{display:inline-flex;align-items:center;gap:6px}
.mbx-head h1{font-family:var(--font-display);font-weight:400;font-size:34px;line-height:1;letter-spacing:-0.03em}
.mbx-head .sub{margin-top:9px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.hub{max-width:1240px}

.hub-seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden}
.hub-seg button{border:0;background:transparent;padding:6px 14px;font:500 12.5px var(--font-sans);color:var(--ink-2);cursor:pointer}
.hub-seg button.on{background:var(--orange);color:#fff}
.hub-chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* Section header with a docked, section-scoped control on the right.
   Each filter physically lives inside the section it governs — this is what
   makes the split filtering read as unambiguous (range->heat map, client->manager). */
.sec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:26px 2px 12px}
.sec-h h3{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin:0}
/* read-only scope caption — deliberately NOT pill-shaped so it can't be mistaken
   for a button; a low-contrast "Showing:" prefix marks it as status, not control. */
.sec-h .scope{font-size:12px;font-weight:500;color:var(--ink-3);cursor:default}
.sec-h .scope b{font-weight:600;color:var(--ink-2)}
.sec-h .scope::before{content:"Showing: ";color:var(--ink-3);font-weight:400}
.sec-h .hint{font-size:12px;color:var(--ink-3)}
.sec-h .sec-ctrl{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.sec-h .sec-ctrl .ctrl-lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
/* Client picker drops to its OWN full-width row, left-aligned beneath the
   "Inbox & domain manager" title (many chips read better on their own line than
   crammed right). The heat-map Range control stays docked on the title row. */
.sec-h .mgr-ctrl{width:100%;margin-left:0;justify-content:flex-start}
.sec-h .mgr-ctrl .hub-chips{justify-content:flex-start}
/* the control asserts its OWN blast-radius, so scope is legible without interacting */
.sec-h .sec-ctrl .ctrl-scope{font-size:11px;color:var(--ink-3);font-weight:500;white-space:nowrap}
/* stronger keyboard focus (active state was colour-only) */
.hub-seg button:focus-visible,.hub-chips .chip:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.hub-seg{box-shadow:0 1px 0 rgba(0,0,0,.03)}
/* section fence — a subtle band ties the docked control to the card it governs */
.mbx-sec{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px 14px;margin:22px 0 0;background:var(--bg)}
.mbx-sec > .sec-h{margin:0 2px 12px}
.mbx-sec > .card{margin:0}
@media(max-width:640px){.sec-h .sec-ctrl{width:100%;margin-left:0}.sec-h .mgr-ctrl,.hub-chips{justify-content:flex-start}}
/* pinned aggregate verdict chip + brief "just changed" pulse on a re-rendered section */
table.heat tr.heat-all td.n .fleetv{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
.fleetv.g{background:var(--green)}.fleetv.a{background:var(--amber)}.fleetv.r{background:var(--red)}
@keyframes secpulse{0%{box-shadow:0 0 0 0 rgba(214,90,32,.35)}100%{box-shadow:0 0 0 6px rgba(214,90,32,0)}}
.mbx-sec.reacted{animation:secpulse 1.1s ease-out 1}

.fixrow{display:flex;gap:13px;align-items:flex-start;padding:15px 17px;border-left:3px solid var(--line)}
.fixrow + .fixrow{border-top:1px solid var(--line)}
.fixrow.r{border-left-color:var(--red)}.fixrow.a{border-left-color:var(--amber)}
.fixrow .fic{width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:15px}
.fixrow .fic.r{background:var(--red-bg)}.fixrow .fic.a{background:var(--amber-bg)}
.fixrow h4{margin:0 0 2px;font-size:14.5px;font-weight:600}
.fixrow p{margin:0;color:var(--ink-2);font-size:12.5px}
.fixrow .who{display:inline-block;font-size:10.5px;font-weight:600;background:var(--bg-sunken);border-radius:6px;padding:2px 7px;margin-right:5px;color:var(--ink-2)}
.fixrow .fbtn{margin-left:auto;align-self:center;white-space:nowrap;font:600 12.5px var(--font-sans);color:#fff;border:0;background:var(--ink);border-radius:9px;padding:8px 14px;cursor:pointer}
.allclear{background:var(--green-bg);color:#195C3F;border-radius:var(--radius);padding:11px 14px;font-size:13px;font-weight:600}

.heatwrap{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:5px;width:100%;min-width:640px}
table.heat th{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:600;padding:6px 4px;text-align:center}
table.heat th.n,table.heat td.n{text-align:left;white-space:nowrap}
table.heat td.n{font-weight:600;font-size:14px;padding-left:8px}
table.heat td.n small{display:block;color:var(--ink-3);font-weight:400;font-size:10.5px}
.hcell{border-radius:10px;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:14px;line-height:1}
.hcell small{font-weight:500;font-size:9.5px;opacity:.9;margin-top:2px}
.h-g1{background:var(--green)}.h-g2{background:#4E9A76}.h-a1{background:var(--amber)}.h-r1{background:var(--red)}.h-mut{background:#C9C4BD}.h-blk{background:var(--ink)}
/* Aggregate "All clients" total row — visually pinned above the per-client rows. */
table.heat tr.heat-all td.n{font-weight:700;font-size:15px}
table.heat tr.heat-all td.n small{color:var(--ink-2);font-weight:600}
table.heat tr.heat-all .hcell{box-shadow:inset 0 0 0 2px rgba(0,0,0,.14)}
table.heat tr.heat-all + tr td{padding-top:9px}
.heat-legend{display:flex;gap:10px;margin-top:12px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3)}
.heat-legend .sw{display:inline-flex;align-items:center;gap:5px}
.heat-legend .box{width:12px;height:12px;border-radius:3px}

.t-g{color:var(--green);font-weight:600}.t-a{color:var(--amber);font-weight:600}.t-r{color:var(--red);font-weight:600}.t-mut{color:var(--ink-3)}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
/* Standalone tag table scrolls under a 500px cap — pin its header row so the
   columns stay labelled while paging the tags. */
#hub-tags-body thead th{position:sticky;top:0;z-index:1;background:var(--bg,#fff)}
.mgr-tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.mgr-tabs .tab{margin-bottom:-1px}
.tabbadge{font-size:10.5px;background:var(--red-bg);color:#861E10;border-radius:10px;padding:1px 6px;margin-left:5px;font-weight:600}
.tabbadge.n{background:#F2F2F0;color:var(--ink-2)}
.mgr-empty{padding:26px 18px;color:var(--ink-3);font-size:13px}
.skel{color:var(--ink-3);font-size:13px;padding:16px 4px}
@keyframes hpulse{0%,100%{opacity:1}50%{opacity:.4}}
.hcell.sk{background:#DED9D1;animation:hpulse 1.15s ease-in-out infinite}
.hub-refresh{border:1px solid var(--line-2);background:transparent;border-radius:999px;width:28px;height:28px;display:inline-grid;place-items:center;font-size:14px;color:var(--ink-2);cursor:pointer;margin-left:6px}
.hub-refresh.busy{animation:hspin 1s linear infinite;pointer-events:none}
@keyframes hspin{to{transform:rotate(360deg)}}
.heat-sk-n{height:18px;width:110px;border-radius:6px;background:#DED9D1;animation:hpulse 1.15s ease-in-out infinite}
</style>
</head>
<body>
<div class="app">
  <div id="rail"></div>
  <main class="main">
    <div class="mbx-head">
      <h1>Mailboxes</h1>
      <div class="sub">Is our email landing, and what needs fixing today. <span class="pill o" style="margin-left:6px"><span class="dot"></span>Preview</span></div>
    </div>

    <div class="hub">
      <!-- FLEET HEAT MAP — the RANGE picker lives here, and only changes this -->
      <section class="mbx-sec" id="sec-heat">
      <div class="sec-h">
        <h3>Fleet heat map</h3>
        <span class="scope" id="hub-heat-scope" aria-live="polite"><b>Whole fleet</b> · last 24 hours</span>
        <div class="sec-ctrl">
          <span class="ctrl-lab">Range</span>
          <div class="hub-seg" id="hub-range" role="radiogroup" aria-label="Heat map date range">
            <button data-win="1" type="button" role="radio" aria-checked="true" class="on">24H</button><button data-win="7" type="button" role="radio" aria-checked="false">7d</button><button data-win="14" type="button" role="radio" aria-checked="false">14d</button><button data-win="30" type="button" role="radio" aria-checked="false">30d</button>
          </div>
          <button id="hub-refresh" type="button" class="hub-refresh" title="Recalculate now" aria-label="Recalculate the heat map now">&#10227;</button>
          <span class="ctrl-scope">↑ changes this heat map only</span>
        </div>
      </div>
      <div class="card heatwrap" style="padding:10px" id="hub-heat"><div class="skel">Loading fleet…</div></div>
      </section>

      <!-- PERFORMANCE BY TAG — fleet-wide, its OWN section below the heat map
           (owner 2026-08-25). Pulled out of the manager tab strip so it isn't
           scoped by the client chips. FIXED at the 30-day window: the audit of
           2026-08-25 proved 7/14-day sends can't be computed accurately from the
           current data (windowed Sent was a delta of the ROLLING-30d sent_30d
           counter, which collapses toward 0 for steady sending — Smartlead
           showed the 7d number was ~10x understated). sent_30d IS Smartlead's
           own 30-day counter, so the 30-day view is exact; the shorter windows
           return only once daily_sent_count capture is repaired. Height-capped +
           scrollable. -->
      <section class="mbx-sec" id="sec-tags">
      <div class="sec-h">
        <h3>Performance by tag</h3>
        <span class="scope"><b>Whole fleet</b> · last 30 days</span>
      </div>
      <div class="card" style="padding:0;overflow:hidden">
        <div id="hub-tags-body" style="max-height:500px;overflow:auto"><div class="skel" style="padding:18px">Loading…</div></div>
      </div>
      </section>

      <!-- INBOX & DOMAIN MANAGER — the CLIENT picker lives here, and only changes this -->
      <section class="mbx-sec" id="sec-mgr">
      <div class="sec-h">
        <h3>Inbox &amp; domain manager</h3>
        <span class="scope" id="hub-mgr-scope" aria-live="polite"><b>All clients</b></span>
        <div class="sec-ctrl mgr-ctrl">
          <span class="ctrl-lab">Client</span>
          <div id="hub-chips" class="hub-chips" role="radiogroup" aria-label="Filter the inbox &amp; domain manager by client"><button class="chip on" data-client="All" type="button" role="radio" aria-checked="true">All clients</button></div>
          <span class="ctrl-scope">↑ changes this list only</span>
        </div>
      </div>
      <div class="card" style="padding:0;overflow:hidden">
        <div class="mgr-tabs" id="hub-mgr-tabs" style="padding:8px 10px 0"></div>
        <div id="hub-mgr-body" style="max-height:500px;overflow:auto"><div class="skel" style="padding:18px">Loading…</div></div>
      </div>
      </section>
    </div>
  </main>
</div>

<script src="shell.js"></script>
<script>
(function () {
  "use strict";
  var el = function (id) { return document.getElementById(id); };
  el("rail").outerHTML = renderRail("mbxhub");

  /* ---------- state ---------- */
  var LS = "mbxhub.client";
  // S.win = the HEAT MAP range only (1/7/14/30, where 1 = the 24H snapshot). The Inbox & Domain manager is
  // deliberately NOT range-scoped — it always shows the full MGR_WIN window so
  // the two filters stay cleanly separated (range->heat map, client->manager).
  var MGR_WIN = 30;
  // TAG_WIN = the Performance-by-tag window. FIXED at 30 (audit 2026-08-25):
  // the backend's 7/14d Sent is a delta of the rolling-30d sent_30d counter,
  // which under-reports badly (Smartlead-verified ~10x low at 7d), so only the
  // 30d view — which reads sent_30d directly = Smartlead's own 30d counter — is
  // trustworthy. The picker is removed until daily_sent_count capture is fixed.
  var TAG_WIN = 30;
  // win: heat-map range. Default 1 = the last-24h snapshot (real-time, owner
  // 2026-08-28). 24H reads the most recent day of the day-wise series client-
  // side (see winData) — the sample fallback is never the default view.
  var S = { client: "All", win: 1, deliv: null, cw: null, tags: null, labels: {}, vol: {}, grades: null };
  try { var v = localStorage.getItem(LS); if (v) S.client = v; } catch (e) {}

  /* ---------- helpers ---------- */
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function n(x) { x = Number(x) || 0; return x >= 1000 ? (x >= 100000 ? Math.round(x / 1000) + "k" : (x / 1000).toFixed(1).replace(/\.0$/, "") + "k") : String(Math.round(x)); }
  function comma(x) { return (Number(x) || 0).toLocaleString("en-US"); }
  function pct(part, whole) { whole = Number(whole) || 0; if (!whole) return null; return (100 * (Number(part) || 0) / whole); }
  function fx(v, d) { return v == null ? "—" : (Number(v).toFixed(d == null ? 1 : d) + "%"); }
  function replyTone(v) { return v == null ? "mut" : v >= 1.1 ? "g1" : v >= 0.8 ? "a1" : "r1"; }
  function bounceTone(v) { return v == null ? "mut" : v < 2 ? "g1" : v < 3 ? "a1" : "r1"; }
  // Actively-sending tone (owner 2026-08-24): <80 red, 80-90 amber, 90+ green.
  function capTone(v) { return v == null ? "mut" : v >= 90 ? "g1" : v >= 80 ? "a1" : "r1"; }
  function warmTone(v) { return v == null ? "mut" : v <= 15 ? "g1" : v <= 30 ? "g2" : v <= 50 ? "a1" : "r1"; }
  function tclass(tone) { return tone === "g1" ? "t-g" : tone === "g2" ? "t-g" : tone === "a1" ? "t-a" : tone === "r1" ? "t-r" : "t-mut"; }

  /* ---------- representative fallback (only used if an endpoint is empty) ---------- */
  var REP_CLIENTS = [
    { name: "Navreo", dom: 12, inbox: 88, reply: 4.2, bounce: 1.1, sent: 271000, positives: 41, warm: 8, cap: 91, bl: 0 },
    { name: "KRG Advisors", dom: 8, inbox: 61, reply: 3.9, bounce: 0.9, sent: 183000, positives: 28, warm: 24, cap: 76, bl: 0 },
    { name: "Asteri", dom: 3, inbox: 24, reply: 4.0, bounce: 1.0, sent: 72000, positives: 14, warm: 6, cap: 88, bl: 0 },
    { name: "Altius Reach", dom: 5, inbox: 34, reply: 3.1, bounce: 1.8, sent: 96000, positives: 12, warm: 10, cap: 58, bl: 0 },
    { name: "Grout", dom: 4, inbox: 28, reply: 2.2, bounce: 3.1, sent: 84000, positives: 7, warm: 32, cap: 71, bl: 0 },
    { name: "Amplifyy", dom: 6, inbox: 42, reply: 1.4, bounce: 6.2, sent: 118000, positives: 3, warm: 28, cap: 44, bl: 2 }
  ];
  var REP_TAGS = [
    { tag: "Hiring-signal", mailboxes: 62, sent: 48200, utilisation: 89, reply_rate: 4.1, bounce_rate: 0.9, positive: 41, per_positive: 1180 },
    { tag: "Fixed-list", mailboxes: 54, sent: 39600, utilisation: 82, reply_rate: 3.5, bounce_rate: 1.1, positive: 28, per_positive: 1414 },
    { tag: "Events", mailboxes: 31, sent: 22400, utilisation: 76, reply_rate: 3.0, bounce_rate: 1.4, positive: 14, per_positive: 1600 },
    { tag: "Engagement-signal", mailboxes: 44, sent: 31100, utilisation: 61, reply_rate: 2.8, bounce_rate: 1.7, positive: 17, per_positive: 1829 },
    { tag: "Followers", mailboxes: 27, sent: 18900, utilisation: 71, reply_rate: 2.1, bounce_rate: 2.4, positive: 7, per_positive: 2700 },
    { tag: "Lookalike", mailboxes: 22, sent: 14700, utilisation: 58, reply_rate: 1.6, bounce_rate: 3.4, positive: 3, per_positive: 4900 }
  ];
  var USING_REP = { heat: false, tags: false, fix: false };

  /* ---------- per-client rows from /api/client-windows ---------- */
  // The analytics/client-windows layer injects a demo client "Acme" (hardcoded
  // _DEMO_ACME_WINDOW_30D) — never a real client; keep it out of chips + heat.
  function isDemoClient(name) { return /^acme$/i.test(String(name || "").trim()); }
  // Sum the last k elements of a day-wise series array (k = window days).
  function tailSum(a, k) {
    if (!Array.isArray(a) || !a.length) return 0;
    var t = a.slice(-k), s = 0;
    for (var i = 0; i < t.length; i++) s += Number(t[i]) || 0;
    return s;
  }
  // Which day the 24H snapshot reads: the most recent WEEKDAY strictly before
  // today. Today is always skipped (a partial, still-ramping bucket — verified
  // 2026-08-28 a Friday mid-morning read 420 sent vs a normal ~31k day). Weekends
  // are skipped on the CALENDAR, so Saturday, Sunday and Monday all resolve to
  // Friday (owner 2026-08-28) — deterministic, independent of whether that weekday
  // happened to send.
  //
  // The search starts from the last entry whose DATE is strictly before today
  // rather than from days[-2]: since the 2026-09-02 ruling the sweep's axis ends
  // yesterday, but an older cached blob still ends today, and both must resolve
  // to the same day. Returns -1 for an empty or all-future axis.
  // UTC, because the sweep stamps its day list in UTC. A LOCAL date compare lets
  // today's partial bucket through for a viewer ahead of UTC (between their local
  // midnight and UTC midnight local "today" is already tomorrow's date), which is
  // exactly the still-ramping day the 24H snapshot exists to skip.
  function todayISO() { return new Date().toISOString().slice(0, 10); }
  function snapDayIndex(days) {
    if (!Array.isArray(days) || !days.length) return -1;
    var today = todayISO(), last = -1, i;
    for (i = days.length - 1; i >= 0; i--) {
      if (String(days[i] || "").slice(0, 10) < today) { last = i; break; }
    }
    if (last < 0) return -1;
    for (i = last; i >= 0; i--) {
      var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(days[i] || "")); if (!m) continue;
      var wd = new Date(+m[1], +m[2] - 1, +m[3]).getDay();   // 0=Sun … 6=Sat, local
      if (wd !== 0 && wd !== 6) return i;                     // first weekday before today
    }
    return last;   // all-weekend series: the last day before today
  }
  // "2026-08-27" → "27 Aug" for the scope label, so the snapshot day is explicit.
  var _MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function fmtDay(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || "")); if (!m) return "";
    return String(+m[3]) + " " + (_MON[(+m[2]) - 1] || "");
  }
  // The heat-map window entry { client:{sent,replied,bounced}, __all:{…} } for a
  // range. 7/14/30 come straight from the backend sweep (Smartlead-reconciled,
  // archived-campaign complete). 24H (win 1) is derived HERE from the SAME day-
  // wise series the capacity column already reads — one day's slice at
  // snapDayIndex, which IS Smartlead's own day-wise number for that date, so it
  // verifies against the platform to the digit at zero extra API cost. Deriving
  // on the FE also means the real-time DEFAULT never falls through to the
  // REP_CLIENTS sample while a fresh blob (which carries no "1" key) propagates.
  // Any other window absent from windows{} degrades to a k-day series sum, so
  // this stays forward-safe.
  function winData(win) {
    win = String(win);
    var cw = S.cw; if (!cw) return null;
    if (cw.windows && cw.windows[win]) return cw.windows[win];
    var ser = cw.series; if (!ser) return null;
    var out = {}, hasClient = false;
    var idx = win === "1" ? snapDayIndex(cw.days) : -1;
    if (win === "1" && idx < 0) return null;
    Object.keys(ser).forEach(function (name) {
      if (name === "__navreo_ws") return;   // raw workspace line, never a client
      var s = ser[name] || {};
      var one = function (a) { return (Array.isArray(a) && idx < a.length) ? (Number(a[idx]) || 0) : 0; };
      out[name] = win === "1"
        ? { sent: one(s.sent), replied: one(s.replied), bounced: one(s.bounced) }
        : { sent: tailSum(s.sent, Number(win) || 1), replied: tailSum(s.replied, Number(win) || 1), bounced: tailSum(s.bounced, Number(win) || 1) };
      if (name !== "__all") hasClient = true;
    });

  };
  function warmupJob(op, domain) {
    return fetch("/api/warmup-job", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ op: op, domains: [domain] }) })
      .then(function (r) { return r.json().catch(function () { return { ok: r.ok }; }); });
  }
  function delivPost(path) { // liveAction path → POST /api/deliverability/<path>
    return fetch("/api/deliverability/" + path, { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" } })
      .then(function (r) { return r.json().catch(function () { return { ok: r.ok }; }); });
  }
  el("hub-mgr-body").addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var act = b.getAttribute("data-act");
    if (act === "copy-park-prompt-all") {
      // Replace candidates (grade-informed: grade E, or grade D parked 3+ times,
      // or a churner with no recent data) first; fall back to every flagged domain.
      var pcAll = parkChurnListC() || [];
      var pcRows = pcAll.filter(function (r) { return parkRec(r.domain, (r.cycles_all != null ? r.cycles_all : r.cycles) || 0)[0] === "Replace"; });
      if (!pcRows.length) pcRows = pcAll;
      if (!pcRows.length) return;
      var pcOld = b.textContent;
      copyText(parkPrompt(pcRows)).then(function () { toast("Prompt copied — paste it into Claude Code", "ok"); b.textContent = "Copied ✓"; setTimeout(function () { b.textContent = pcOld; }, 1800); }).catch(function () { toast("Couldn't copy — select the text manually", "err"); });
      return;
    }
    if (act === "copy-sig-prompt" || act === "copy-sig-prompt-all") {
      var all = signatureListC() || [];
      var rows = act === "copy-sig-prompt-all" ? all : all.filter(function (m) { return mgrRowKey(m) === b.getAttribute("data-id"); });
      if (!rows.length) rows = all;
      var oldl = b.textContent;
      copyText(sigPrompt(rows)).then(function () { toast("Prompt copied — paste it into Claude Code", "ok"); b.textContent = "Copied ✓"; setTimeout(function () { b.textContent = oldl; }, 1800); }).catch(function () { toast("Couldn't copy — select the text manually", "err"); });
      return;
    }
    var spec = ACTIONS[act];
    if (!spec) return;
    var target = spec.scope === "domain" ? b.getAttribute("data-domain") : b.getAttribute("data-id");
    if (!target) return;
    var label = spec.scope === "domain" ? target : (b.closest("tr") ? b.closest("tr").querySelector("td div").textContent.trim() : target);
    if (!window.confirm(spec.verb + " — " + label + "?\n\n" + spec.note)) return;
    b.disabled = true; var old = b.textContent; b.textContent = "Working…";
    spec.run(target)
      .then(function (j) {
        if (j && j.ok === false) { toast(spec.verb + " failed — " + (j.message || "see logs"), "err"); b.disabled = false; b.textContent = old; return; }
        if (spec.job) {
          // Background job — hand it to the shared Tasks panel (which polls
          // /api/jobs and reconciles the real outcome) and point the user there.
          if (window.NavreoJobs && window.NavreoJobs.ping) window.NavreoJobs.ping();
          toast(spec.verb + " — " + label + " queued · track it in the Tasks panel", "ok");
        } else {
          toast(spec.verb + " done — " + label, "ok");
        }
        bundleTries = 0; loadBundle(); renderMgrTabs();
      })
      .catch(function (err) { toast("Failed — " + err, "err"); b.disabled = false; b.textContent = old; });
  });

  /* ---------- data loads ---------- */
  function loadDeliv() {
    // /_audit returns { blob, ts, running, error, stale, ... }; the findings we
    // read (blacklist, warmupConfig, signature, inactive, highbCamps, reply_pct,
    // bounce_pct, inboxes, domains, sent) live under .blob.
    return fetch("/api/deliverability/_audit", { credentials: "same-origin" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { if (j && j.blob) S.deliv = j.blob; })
      .catch(function () {});
  }
  // client-windows feeds the client chips AND every live heat-map row. The boot
  // fires 6 loaders at once, so this one can transiently 429/502 in the burst —
  // and a single miss used to strand the page on REP_CLIENTS sample rows forever
  // (no retry). Retry with backoff like loadBundle/loadMcm, re-rendering on each
  // attempt so live rows replace the sample the moment the data lands.
  var cwTries = 0;
  function loadCw() {
    var retry = function () {
      if (cwTries < 8) { cwTries++; setTimeout(function () { loadCw().then(function () { renderChips(); renderAll(); }); }, 3000); }
      else { S.cwDone = true; renderHeat(); }   // retries exhausted — stop the skeleton, show honest empty
    };
    return fetch("/api/client-windows", { credentials: "same-origin" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (cw) {
        if (!cw || !cw.windows) { retry(); return; }   // transient failure or gated body — try again
        cwTries = 0; S.cwDone = true;
        S.cw = cw; S.labels = cw.ws_labels || {}; S.vol = (cw.windows && cw.windows["30"]) || {};
      })
      .catch(function () { retry(); });
  }
  function loadTags() {
    return fetch("/api/tag-performance", { credentials: "same-origin" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { if (j) S.tags = j; })
      .catch(function () {});
  }
  // /_bundle returns { bundle:{ views:{warmupoff,inwarmup,reconnect,...} }, running }.
  // It can still be building on first hit — poll a few times while running.
  var bundleTries = 0;
  function loadBundle() {
    S.bundleLoading = true;
    return fetch("/api/deliverability/_bundle", { credentials: "same-origin" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (j && j.bundle) S.bundle = j.bundle;
        S.bundleLoading = !!(j && j.running);
        renderAll(); // bundle feeds per-client warm/live + the reconnect count in Fix-today/verdict
        if (j && j.running && bundleTries < 8) { bundleTries++; setTimeout(loadBundle, 4000); }
      })
      .catch(function () { S.bundleLoading = false; });
  }
  // /api/mailbox-client-map → { status:"ready", clients:{ Name:[emails] } }.
  // Attributes shared-fleet mailboxes to the client whose campaigns they run —
  // lets the heat map show REAL per-client warm-up / live %, not a fleet broadcast,
  // AND drives the manager's client filter.
  //
  // The server rebuild can take a while (it rides a 30-min sweep of campaign
  // membership), which used to mean the client filter "never loaded" on a fresh
  // page. Two fixes: (1) a stale-while-revalidate localStorage CACHE so the last
  // known map is applied INSTANTLY on load and the filter works immediately,
  // refreshing quietly in the background; (2) a much longer poll budget so a
  // genuinely cold map still lands instead of giving up after ~30s.
  var MCM_LS = "mbxhub.mcm";
  var MCM_TTL = 7 * 864e5;   // trust a cached map for a week (membership drifts slowly)
  function applyMcm(clients, ts, fromCache) {
    var norm = {}; Object.keys(clients).forEach(function (k) { norm[k.toLowerCase()] = clients[k]; });
    S.mcm = { status: "ready", clients: norm, ts: ts || Date.now(), cached: !!fromCache };
    renderHeat(); renderMgrScope(); renderMgrTabs();   // attribution feeds both the heat map AND the manager
  }
  function hydrateMcmFromCache() {
    try {
      var raw = localStorage.getItem(MCM_LS); if (!raw) return;
      var c = JSON.parse(raw);
      if (c && c.clients && c.ts && (Date.now() - c.ts) < MCM_TTL) applyMcm(c.clients, c.ts, true);
    } catch (e) {}
  }
  var mcmTries = 0;
  function loadMcm() {
    return fetch("/api/mailbox-client-map", { credentials: "same-origin" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (m) {
        if (m && m.status === "ready" && m.clients && Object.keys(m.clients).length) {
          var ts = Date.now();
          applyMcm(m.clients, ts, false);
          try { localStorage.setItem(MCM_LS, JSON.stringify({ clients: m.clients, ts: ts })); } catch (e) {}
        } else if (mcmTries < 45) {  // ~30 fast tries then slower — up to a few minutes for a cold map
          mcmTries++; setTimeout(loadMcm, mcmTries < 15 ? 4000 : 8000);
        }
      })
      .catch(function () { if (mcmTries < 45) { mcmTries++; setTimeout(loadMcm, 8000); } });
  }
  // /api/fleet-capacity → { client_caps:{Name:cap/day}, capacity:{ws:[series]}, days }.
  // The SAME source the Analytics page uses for real daily send capacity — feeds
  // the heat map's Capacity-used column (sent/day ÷ capacity/day).
  var capTries = 0;
  function loadCap() {
    return fetch("/api/fleet-capacity?days=30", { credentials: "same-origin" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (j && (j.client_caps || j.capacity)) { capTries = 0; S.cap = j; renderHeat(); }
        else if (capTries < 8) { capTries++; setTimeout(loadCap, 3000); }   // transient miss — retry, don't leave the column blank
      })
      .catch(function () { if (capTries < 8) { capTries++; setTimeout(loadCap, 3000); } });
  }

  // /api/warmup-capacity → { perWorkspace:{ws:{capacityPerDay,boxes,byProvider}} }
  // Estimated sends/day currently IN WARM-UP (being "repaired"), per workspace,
  // from the Smartlead mirror by provider default (Outlook 2, Gmail 20, SMTP 15).
  // Feeds warmCapFor → the heat map's "In warm-up" column. Same transient-retry
  // pattern as loadCap so a slow mirror read never leaves the column blank.
  var warmCapTries = 0, warmMapTries = 0;
  function loadWarmCap() {
    return fetch("/api/warmup-capacity", { credentials: "same-origin" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (j && j.perWorkspace) {
          warmCapTries = 0; S.warmcap = j; renderHeat();
          // Attribution map still warming (fresh deploy / cold sweep): the
          // shared-fleet clients read "not mapped" until it lands, so keep
          // re-polling — up to ~7 min — and re-render when the split appears.
          if (!j.mapReady && warmMapTries < 20) { warmMapTries++; setTimeout(loadWarmCap, 20000); }
        }
        else if (warmCapTries < 8) { warmCapTries++; setTimeout(loadWarmCap, 3000); }
      })
      .catch(function () { if (warmCapTries < 8) { warmCapTries++; setTimeout(loadWarmCap, 3000); } });
  }

  // /api/park-churn → { ok, days, min_parks, rows:[...] } — repeat-park
  // offenders for the manager's "Repeat parks" tab. Same transient-retry
  // pattern as loadCap so a boot-burst 429 never leaves the badge blank.
  var pcTries = 0;
  function loadParkChurn() {
    return fetch("/api/park-churn", { credentials: "same-origin" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (j && j.ok && Array.isArray(j.rows)) { pcTries = 0; S.parkchurn = j; renderMgrTabs(); }
        else if (pcTries < 8) { pcTries++; setTimeout(loadParkChurn, 3000); }
      })
      .catch(function () { if (pcTries < 8) { pcTries++; setTimeout(loadParkChurn, 3000); } });
  }

  // Confidence grades (A healthiest … E least healthy) — the same grade the cap
  // engine acts on, one map keyed by domain. Loads after paint and re-renders
  // the manager so the badges fill in; the tables never block on it.
  var gradesTries = 0;
  function loadGrades() {
    return fetch("/api/deliverability/grades", { credentials: "same-origin" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        var have = !!(j && j.ok && j.grades && Object.keys(j.grades).length);
        if (have) { S.grades = j; renderMgrTabs(); }
        // Cold cache after a deploy (the server answers instantly with
        // computing:true and recomputes in the background) or a failed fetch:
        // poll until the map lands. The old code gave up on the first miss and
        // the page stayed grade-less until a manual reload.
        if ((!have || (j && j.computing)) && gradesTries < 20) { gradesTries++; setTimeout(loadGrades, 4000); }
        else if (have) gradesTries = 0;
      })
      .catch(function () { if (gradesTries < 20) { gradesTries++; setTimeout(loadGrades, 4000); } });
  }

  // paint immediately with placeholders/representative, then fill as data lands
  hydrateMcmFromCache();   // apply last-known mailbox→client map instantly (before any fetch)
  renderChips(); renderAll();
  loadCw().then(function () { renderChips(); renderAll(); });
  loadDeliv().then(function () { renderAll(); });
  loadTags().then(function () { renderTags(); renderMgrTabs(); });
  loadBundle();
  loadMcm();
  loadCap();
  loadWarmCap();
  loadParkChurn();
  loadGrades();
})();
</script>
</body>
</html>
