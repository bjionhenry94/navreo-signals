<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboarding Form · Navreo</title>
<link rel="stylesheet" href="navreo.css">
<style>
/* onboarding-v1 — the client onboarding hub (panel-locked prototype, 2026-08-27).
   One page, one next thing. Each task opens its own dedicated page (#/route).
   Email Infrastructure page = the Settings → Email Infrastructure "Tracker"
   design (infrastructure.html), adapted to the client journey. Simulated
   state only — localStorage, no APIs. */

body { background:var(--bg); }
.ob-app { max-width:760px; margin:0 auto; padding:0 20px 110px; min-height:100vh; }

/* ---------- top bar ---------- */
.ob-top { display:flex; justify-content:space-between; align-items:center; gap:12px;
  padding:20px 0 6px; flex-wrap:wrap; }
.ob-brand { display:flex; align-items:center; color:var(--ink); }
.ob-brand img { height:22px; display:block; }
.ob-brand span { font-family:var(--font-sans); font-weight:400; font-size:13.5px;
  color:var(--ink-3); margin-left:8px; }
.ob-date { display:inline-flex; align-items:center; gap:8px; background:#fff;
  border:1px solid var(--line-2); border-radius:999px; padding:8px 16px;
  font-family:var(--font-mono); font-size:11.5px; font-weight:700; color:var(--ink);
  cursor:pointer; }
.ob-date:focus-visible { outline:none; box-shadow:var(--focus); }
.ob-date.locked { color:var(--green); }
.ob-date u { text-decoration:none; border-bottom:1.5px dotted var(--line-2); }

/* ---------- stage dots ---------- */
.ob-stgbtn { border:none; background:none; width:100%; padding:0 0 10px; cursor:pointer; display:block; }
.ob-stgbtn:focus-visible { outline:none; box-shadow:var(--focus); border-radius:10px; }
.ob-dots { display:flex; align-items:center; justify-content:center; gap:16px; margin:16px 0 8px; }
.ob-dot { width:9px; height:9px; border-radius:50%; background:var(--line-2); transition:transform .2s; }
.ob-dot.done { background:var(--green); }
.ob-dot.now { background:var(--orange); transform:scale(1.5); box-shadow:0 0 0 4px var(--orange-100); }
@media (prefers-reduced-motion: reduce){ .ob-dot { transition:none; } }
.ob-snow { display:flex; justify-content:center; }
.ob-snow span { font-size:12px; color:var(--ink-2); }
.ob-snow b { color:var(--ink); }
.ob-snow u { text-decoration:none; border-bottom:1.5px dotted var(--line-2); }

/* ---------- whose move ---------- */
.ob-move { display:flex; justify-content:center; margin:14px 0 20px; }
.ob-move .chip { display:inline-flex; align-items:center; gap:8px; border-radius:999px;
  padding:7px 15px; font-size:13.5px; font-weight:500; }
.ob-move .you { background:var(--orange-100); color:var(--orange-700); }
.ob-move .us { background:#fff; color:var(--ink-3); border:1px solid var(--line); }
.ob-move .team { background:var(--amber-bg); color:var(--amber); }
.ob-move .live { background:var(--green-bg); color:var(--green); }
.ob-move .chip i { width:7px; height:7px; border-radius:50%; background:currentColor; display:block; flex:none; }

/* ---------- hero + list (hub) ---------- */
.ob-hero { background:#fff; border:1px solid var(--line); border-radius:14px;
  box-shadow:0 1px 2px rgba(20,17,14,.04); padding:24px; display:grid; gap:12px;
  max-width:560px; margin:0 auto; }
.ob-k { font-size:12px; font-weight:700; letter-spacing:.1em; color:var(--ink-3); text-transform:uppercase; }
.ob-hero h1 { font-family:var(--font-display); font-weight:700;
  font-size:clamp(25px,6.5vw,30px); letter-spacing:-.01em; margin:0; line-height:1.12; }
.ob-sub { color:var(--ink-2); font-size:15px; margin:0; max-width:44ch; }
.ob-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.btn-go { font:inherit; font-size:14.5px; font-weight:600; color:#fff; background:var(--orange);
  border:0; border-radius:9px; padding:12px 20px; cursor:pointer;
  box-shadow:0 2px 6px rgba(255,77,0,.25); }
.btn-go:hover { background:var(--orange-600); }
.btn-go:focus-visible { outline:none; box-shadow:var(--focus); }
.btn-go[disabled] { background:#fff; color:var(--ink-3); border:1.5px solid var(--line-2);
  box-shadow:none; cursor:default; }
.btn-ghost { font:inherit; font-size:14px; font-weight:500; color:var(--ink);
  background:#fff; border:1.5px solid var(--line-2); border-radius:9px; padding:11px 18px; cursor:pointer; }
.btn-ghost:hover { background:var(--cream-50); }
.btn-ghost:focus-visible { outline:none; box-shadow:var(--focus); }
.linkbtn { font:inherit; font-size:13px; color:var(--ink-3); background:none; border:0;
  cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.linkbtn:hover { color:var(--ink); }
.ob-t { font-size:11.5px; font-weight:600; color:var(--ink-3); background:var(--bg-sunken);
  border-radius:7px; padding:4px 9px; }
.ob-t.clock { color:var(--amber); background:var(--amber-bg); }
.ob-t.ok { color:var(--green); background:var(--green-bg); }

.ob-listwrap { margin:26px auto 0; max-width:560px; }
.ob-lh { font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); margin:0 4px 10px; }
.ob-list { display:grid; gap:8px; }
.ob-item { display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--line);
  border-radius:12px; padding:12px 16px; width:100%; text-align:left; font:inherit; font-size:15px;
  color:var(--ink); min-height:50px; cursor:pointer; }
.ob-item:hover { border-color:var(--line-2); }
.ob-item:focus-visible { outline:none; box-shadow:var(--focus); }
.ob-item .st { width:22px; height:22px; border-radius:50%; flex:none; display:grid;
  place-items:center; font-size:11.5px; border:1.5px solid var(--line-2); color:transparent; }
.ob-item.done .st { background:var(--green); border-color:var(--green); color:#fff; }
.ob-item.nxt .st { border-color:var(--orange); box-shadow:0 0 0 3px var(--orange-100); }
.ob-item .t { flex:1; font-weight:500; min-width:0; }
.ob-item.done .t { color:var(--ink-3); font-weight:400; }
.ob-item .meta { font-size:12px; color:var(--brown-400); flex:none; }
.ob-item.updup .meta { opacity:.85; }
.ob-item .badge { font-size:11px; font-weight:700; color:var(--amber); background:var(--amber-bg);
  border-radius:6px; padding:2px 7px; flex:none; }

.ob-panelbox { background:#fff; border:1px solid var(--line); border-radius:14px;
  padding:8px 22px 12px; }
.ob-help { margin-top:32px; text-align:center; font-size:13px; color:var(--ink-3); }

/* ---------- task pages ---------- */
.ob-back { display:inline-flex; align-items:center; gap:6px; font-size:13.5px; color:var(--ink-3);
  text-decoration:none; margin:8px 0 0; border:none; background:none; cursor:pointer; font-family:inherit; }
.ob-back:hover { color:var(--ink); }
.col { max-width:680px; margin:34px auto 0; }
.headline { font-family:var(--font-display); font-weight:700; font-size:30px; line-height:1.22;
  letter-spacing:-.01em; text-align:center; text-wrap:balance; color:var(--ink); }
.headline .date { color:var(--orange); white-space:nowrap; }
.subline { text-align:center; font-size:14px; color:var(--ink-3); margin-top:12px; }
.ob-body { margin-top:30px; }
.ob-foot2 { margin-top:26px; display:flex; gap:14px; align-items:center; justify-content:center; flex-wrap:wrap; }
.ob-note { font-size:13px; color:var(--ink-3); text-align:center; margin-top:14px; }

/* ---------- tracker (from infrastructure.html) ---------- */
.tracker { display:flex; margin:40px 4px 0; }
.step { flex:1; display:flex; flex-direction:column; align-items:center; position:relative; }
.step .bar { position:absolute; top:7px; left:-50%; width:100%; height:3px;
  background:var(--line-2); border-radius:2px; }
.step:first-child .bar { display:none; }
.step.done .bar { background:var(--orange); }
.step.now .bar { background:linear-gradient(90deg, var(--orange) 0%, #FFE4D6 100%); }
.step .knot { width:17px; height:17px; border-radius:50%; background:#fff;
  border:3px solid var(--line-2); position:relative; z-index:1; }
.step.done .knot { background:var(--orange); border-color:var(--orange); }
.step.done .knot::after { content:""; position:absolute; inset:0;
  background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12"><path d="M2.5 6.2l2.4 2.4 4.6-5" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>') center/9px no-repeat; }
.step.now .knot { border-color:var(--orange); background:#FFE4D6;
  animation:infra-pulse 2.4s ease-in-out infinite; }
.step .lbl { margin-top:10px; font-size:12px; color:var(--brown-400); text-align:center; }
.step.done .lbl { color:var(--ink-3); }
.step.now .lbl { color:var(--ink); font-weight:600; }
@keyframes infra-pulse { 0%,100% { box-shadow:0 0 0 0 rgba(255,77,0,.30); }
  50% { box-shadow:0 0 0 8px rgba(255,77,0,0); } }
@media (prefers-reduced-motion: reduce) { .step.now .knot { animation:none; } }

/* ---------- domain card (from infrastructure.html) ---------- */
.dcard { margin-top:36px; background:var(--card); border:1px solid var(--line);
  border-radius:14px; box-shadow:0 1px 2px rgba(20,17,14,.04); }
.drow { display:flex; align-items:center; gap:14px; padding:16px 20px; }
.drow + .drow { border-top:1px solid var(--line); }
.drow .name { font-size:14.5px; font-weight:600; color:var(--ink); }
.mbcount { font-size:12px; color:var(--brown-400); white-space:nowrap; margin-left:2px; }
.mbcount .tick { color:var(--green); }
.drow .status { margin-left:auto; text-align:right; font-size:13px; color:var(--ink-3); white-space:nowrap; }
.drow .status b { font-weight:600; }
.drow .status .ok { color:var(--green); }
.drow .status .live { color:var(--orange-600); }
.drow .status .dim { color:var(--brown-400); font-weight:400; }
.drow .status .when { color:var(--brown-400); font-weight:400; margin-left:6px; }
.foot { margin-top:24px; display:flex; align-items:center; justify-content:space-between;
  gap:16px; padding:0 4px; flex-wrap:wrap; }
.quiet { font-size:12.5px; color:var(--brown-400); display:flex; gap:18px; flex-wrap:wrap; }
.quiet .tick { color:var(--green); margin-right:5px; }
.nudge2 { margin:26px auto 0; max-width:460px; background:var(--cream-50);
  border:1px solid var(--line); border-radius:999px; padding:12px 22px; text-align:center;
  font-size:13.5px; color:var(--ink-2); }

/* ---------- cream panel (from infrastructure.html) ---------- */
.panel2 { margin-top:32px; background:var(--cream-50); border:1px solid var(--line);
  border-radius:14px; padding:22px 24px; }
.sectionlbl { font-size:12px; font-weight:700; color:var(--ink-3); text-transform:uppercase;
  letter-spacing:.06em; margin:22px 0 10px; }
.panel2 .sectionlbl:first-child { margin-top:0; }
.hintline { font-size:12px; color:var(--brown-400); margin-top:6px; }
.prow2 { display:flex; justify-content:space-between; align-items:center; gap:10px;
  border-top:1px solid var(--line); padding:12px 2px; font-size:14.5px; }
.prow2:first-of-type { border-top:none; }
.prow2 .okc { font-size:11px; font-weight:700; color:var(--green); background:var(--green-bg);
  border-radius:6px; padding:3px 8px; flex:none; }
.prow2 .waitc { font-size:11px; font-weight:700; color:var(--amber); background:var(--amber-bg);
  border-radius:6px; padding:3px 8px; flex:none; }
.prow2 .mini { font:inherit; font-size:12.5px; border:1px solid var(--line-2); background:#fff;
  border-radius:8px; padding:5px 10px; cursor:pointer; flex:none; }

/* ---------- infra wizard (4 pages: intro bento → senders → domains → confirm) ---------- */
.wsteps { display:flex; align-items:center; justify-content:center; gap:6px; margin:26px 0 20px; flex-wrap:wrap; }
.wsteps i { width:26px; height:4px; border-radius:2px; background:var(--line-2); }
.wsteps i.on { background:var(--orange); }
.wsteps span { font-family:var(--font-mono); font-size:10px; font-weight:700;
  letter-spacing:.08em; color:var(--ink-3); margin-left:8px; }
/* Apple-style bento — white cells float on a soft grey field, soft shadow, generous radius */
.bentowrap { margin-top:26px; background:var(--bg-sunken); border:1px solid var(--line);
  border-radius:22px; padding:14px; }
.bento { display:grid; grid-template-columns:repeat(6,1fr); gap:14px; }
.bcell { grid-column:span 2; background:#fff; border:1px solid var(--line); border-radius:18px;
  padding:22px 22px 20px; display:flex; flex-direction:column; gap:8px; min-width:0;
  box-shadow:0 1px 2px rgba(20,17,14,.05), 0 8px 24px -18px rgba(20,17,14,.25); }
.bcell .bk { font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:.11em;
  color:var(--brown-400); }
.bcell h3 { font-size:16.5px; font-weight:700; letter-spacing:-.01em; margin:0; color:var(--ink); line-height:1.25; }
.bcell p { font-size:13px; color:var(--ink-3); margin:0; line-height:1.55; }
.bcell .art { margin-top:auto; padding-top:16px; }
.bcell .art svg { display:block; width:100%; height:auto; }
.b3 { grid-column:span 3; }
.b4 { grid-column:span 4; }
.b6 { grid-column:span 6; }
.bcell.dark { background:var(--ink); border-color:var(--ink);
  box-shadow:0 1px 2px rgba(20,17,14,.05), 0 18px 40px -20px rgba(20,17,14,.5); }
.bcell.dark h3 { color:#fff; }
.bcell.dark p { color:var(--brown-300); }
.bcell.dark .bk { color:var(--orange); }
.fiftyrow { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
.fiftyrow > div { flex:1; min-width:200px; display:grid; gap:7px; }
.bignum { font-family:var(--font-display); font-weight:400; line-height:.9; letter-spacing:-.03em;
  color:var(--orange); font-size:clamp(56px,10vw,88px); flex:none; }
.sparebar { display:flex; gap:6px; margin-top:14px; }
.sparebar i { flex:1; height:16px; border-radius:5px; background:var(--orange); min-width:0; }
.sparebar i.sp { background:none; border:1.5px dashed #6B6055; }
.sparelab { font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:.06em;
  color:var(--brown-300); margin-top:10px; display:flex; justify-content:space-between; gap:10px; }
/* provider slots styled as ready-for-logo app tiles */
.logorow { display:flex; gap:12px; margin-top:auto; padding-top:16px; }
.logocol { flex:1; min-width:0; display:grid; gap:6px; justify-items:center; }
.logoslot { width:100%; aspect-ratio:1/1; max-height:56px; border:1.5px dashed var(--line-2);
  border-radius:14px; display:grid; place-items:center; background:var(--bg-sunken); }
.logoslot span { font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:.02em;
  color:var(--brown-400); }
.logocol .cap { font-size:11px; font-weight:600; color:var(--ink-3); }
/* pipeline mini-diagram tiles (rounded-square nodes + dotted connectors, Apple-bento style) */
.flowdiag { display:flex; align-items:center; gap:8px; }
.fnode { width:34px; height:34px; border-radius:10px; background:var(--bg-sunken); border:1px solid var(--line);
  display:grid; place-items:center; flex:none; font-family:var(--font-mono); font-size:8.5px;
  font-weight:700; color:var(--ink-3); text-align:center; line-height:1; padding:2px; }
.fnode.on { background:var(--orange-100); border-color:var(--orange-100); color:var(--orange-700); }
.fnode.ink { background:var(--ink); border-color:var(--ink); color:#fff; }
.fdash { flex:1; min-width:8px; height:0; border-top:2px dotted var(--line-2); }
.fstack { display:flex; flex-direction:column; gap:5px; }
.fstack .fnode { width:30px; height:22px; border-radius:8px; }
@media (max-width:640px){ .bcell,.b3,.b4 { grid-column:span 6; } .fiftyrow { gap:12px; } }
.srow { display:flex; gap:8px; align-items:center; background:#fff; border:1px solid var(--line);
  border-radius:12px; padding:10px 12px; }
.srow .av { width:34px; height:34px; border-radius:50%; background:var(--orange-100);
  color:var(--orange-700); display:grid; place-items:center; font-weight:700; font-size:13px; flex:none; }
.srow input { flex:1; min-width:0; border:1.5px solid var(--line-2); border-radius:9px;
  background:#fff; color:var(--ink); padding:9px 11px; font:inherit; font-size:14px; }
.srow input:focus { outline:none; box-shadow:var(--focus); }
.srow input.nm { flex:1.2; font-weight:600; }
.srow .srm { border:none; background:var(--bg-sunken); color:var(--ink-3); width:32px; height:32px;
  border-radius:50%; font-size:15px; cursor:pointer; flex:none; }
.srow .srm:hover { color:var(--ink); }
.srow .srm:focus-visible { outline:none; box-shadow:var(--focus); }
.splitbar { display:flex; gap:5px; margin-top:4px; }
.splitbar span { flex:1; min-width:0; text-align:center; background:var(--orange-100);
  color:var(--orange-700); font-size:11.5px; font-weight:700; border-radius:7px; padding:6px 2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sigprev p { margin:0; line-height:1.55; }
.sigaddr { margin-top:10px !important; font-size:12px; color:var(--ink-3); border-top:1px solid var(--line);
  padding-top:8px; }
.inplab { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-3); margin:0 0 6px; }
.trkline { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:10px; }
.trkline code { font-family:var(--font-mono); font-size:11.5px; color:var(--ink-2); background:#fff;
  border:1px solid var(--line); border-radius:8px; padding:7px 10px; overflow-wrap:anywhere; min-width:0; }
.estrow { display:flex; justify-content:flex-end; margin:6px 0 -6px; }
.estchip { display:inline-grid; gap:2px; text-align:right; background:#fff;
  border:1px solid var(--line-2); border-radius:12px; padding:9px 14px; }
.estchip .lb { font-size:9.5px; font-weight:700; letter-spacing:.09em; color:var(--ink-3); }
.estchip b { font-family:var(--font-mono); font-size:14px; color:var(--ink); }
.warncard { background:var(--amber-bg); border:1px solid var(--amber-line); border-radius:12px;
  padding:14px 16px; font-size:13.5px; color:#6B4A00; margin-top:14px; line-height:1.5; }
.warncard b { display:block; margin-bottom:2px; }
/* domain multi-select (pre-approved pool, checkboxes) */
.dselhead { display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin:6px 2px 8px; flex-wrap:wrap; }
.dselhead .cnt { font-size:12.5px; font-weight:600; color:var(--ink-3); }
.dselhead .cnt b { color:var(--ink); }
.dselhead .acts { display:flex; gap:8px; }
.dselhead .acts button { font:inherit; font-size:12px; font-weight:600; color:var(--ink-3);
  background:none; border:none; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.dselhead .acts button:hover { color:var(--ink); }
.dgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
@media (max-width:560px){ .dgrid { grid-template-columns:1fr; } }
.dpick { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line);
  border-radius:10px; padding:10px 12px; cursor:pointer; font:inherit; text-align:left; min-width:0; }
.dpick:hover { border-color:var(--line-2); }
.dpick:focus-visible { outline:none; box-shadow:var(--focus); }
.dpick .cbx { width:20px; height:20px; border-radius:6px; border:1.5px solid var(--line-2); flex:none;
  display:grid; place-items:center; color:#fff; font-size:12px; }
.dpick.on .cbx { background:var(--orange); border-color:var(--orange); }
.dpick .dn { font-family:var(--font-mono); font-size:12.5px; color:var(--ink); min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dpick.off .dn { color:var(--brown-400); text-decoration:line-through; }

/* ---------- shared task widgets ---------- */
.ob-steps { display:grid; gap:9px; }
.ob-s3 { display:flex; gap:12px; align-items:center; background:#fff; border:1px solid var(--line);
  border-radius:12px; padding:13px 15px; font-size:14.5px; }
.ob-s3 .n { font-weight:700; font-size:12px; color:var(--orange-700); background:var(--orange-100);
  width:24px; height:24px; border-radius:50%; display:grid; place-items:center; flex:none; }
.ob-video { position:relative; border-radius:14px; overflow:hidden; border:1px solid var(--line);
  aspect-ratio:16/9; background:#000; }
.ob-video iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
.ob-video.v43 { aspect-ratio:4/3; }
.ob-vcap { font-size:12.5px; color:var(--ink-3); text-align:center; margin:10px 0 22px; }
.ob-res { margin-top:18px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.ob-rlink { font-size:13px; font-weight:600; color:var(--ink-2); text-decoration:none;
  border:1px solid var(--line); border-radius:999px; padding:8px 14px; background:#fff; }
.ob-rlink:hover { border-color:var(--line-2); color:var(--ink); }
.ob-mark { margin:16px 0 18px; display:flex; gap:12px; align-items:center; justify-content:space-between;
  flex-wrap:wrap; background:var(--cream-50); border:1px solid var(--orange-100);
  border-radius:12px; padding:12px 15px; font-size:14px; }

  .then(function(r){if(!r.ok)throw r.status;return r.json();})
  .then(function(){_obLast=body;obSetStatus("saved");})
  .catch(function(){obSetStatus("error");clearTimeout(_obTimer);_obTimer=setTimeout(obSync,4000);});}
function scheduleSync(){if(!_obReady)return;obSetStatus("saving");clearTimeout(_obTimer);_obTimer=setTimeout(obSync,700);}

/* On load, pull the server-side progress for this client. Scoped pages adopt it
   as the single source of truth (S starts FRESH, so the pristine branch always
   fires); unscoped previews adopt it only when pristine or behind. Until this
   fetch answers, the write gate stays closed and nothing can POST. */
function obRestore(){if(OB_FORCE_NEW){_obReady=true;scheduleSync();return;}
 fetch("/api/onboarding/draft?id="+encodeURIComponent(S.clientId),{cache:"no-store"})
  .then(function(r){return r.ok?r.json():null;})
  .then(function(j){
   if(!j){setTimeout(obRestore,3000);return;} /* server hiccup — retry, keep gate closed */
   if(!j.draft||!j.draft.doc){_obReady=true;scheduleSync();return;} /* brand-new client: FRESH is correct, create the record */
   var sv=obMigrate(j.draft.doc);
   var pristine=(S.stage===0&&Object.keys(S.done||{}).length===0);
   /* Back-office reset: when the server issues a newer resetRev than this browser
      last adopted, the server copy wins wholesale — even if the local cache is
      ahead. This is the ONLY way a reset (which moves state backwards) can reach a
      browser that already holds progress; without it a stale localStorage copy
      re-saves the old data over the reset forever. */
   var forceReset=((sv.resetRev||0)>(S.resetRev||0));
   if(forceReset||(sv.stage||0)>(S.stage||0)||pristine){
    for(var k in FRESH){if(!(k in sv))sv[k]=JSON.parse(JSON.stringify(FRESH[k]));}
    sv.clientId=S.clientId;S=sv;if(OB_LOCAL){try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}}
    _obReady=true;try{_obLast=JSON.stringify(obPayload());}catch(e){}
    if(typeof render==="function")render();obSetStatus("saved");}
   else{/* back-office-drafted sending plan (domains/site/redirect default) adopts even when this browser is ahead — the client UI never edits these. domainsRev lets a REPLACED list supersede a stale local copy (picks reset with it). */
    var chg=false,svOk=Array.isArray(sv.domains)&&sv.domains.length,mineOk=Array.isArray(S.domains)&&S.domains.length;
    if(svOk&&(!mineOk||(sv.domainsRev||0)>(S.domainsRev||0))){S.domains=sv.domains;S.domainsRev=sv.domainsRev||0;S.domainPicks={};chg=true;}
    if(sv.site&&!S.site){S.site=sv.site;chg=true;}
    if(sv.redirect&&!(S.redirect&&S.redirect.trim())){S.redirect=sv.redirect;chg=true;}
    /* clientName is client-visible identity — a blank local copy adopts the server one, but a value the client already holds stays. */
    if(sv.clientName&&!(S.clientName&&String(S.clientName).trim())){S.clientName=sv.clientName;chg=true;}
    /* portalUrl / slackUrl / homeLinks are pure back-office display fields — the client UI only ever READS them, so the SERVER copy always wins. Blank-fill isn't enough: a browser that loaded these once caches the OLD links in localStorage forever and would keep showing them (even across hard-refresh) after the back office re-points them. Server value overrides local per key. */
    var bo=["portalUrl","slackUrl"];
    for(var bi=0;bi<bo.length;bi++){var bk=bo[bi];if(sv[bk]&&sv[bk]!==S[bk]){S[bk]=sv[bk];chg=true;}}
    var svL=sv.homeLinks||{};if(!S.homeLinks)S.homeLinks={};
    for(var hk in svL){if(svL[hk]&&svL[hk]!==S.homeLinks[hk]){S.homeLinks[hk]=svL[hk];chg=true;}}
    if(chg){if(OB_LOCAL){try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}}if(typeof render==="function")render();}
    _obReady=true;try{_obLast=JSON.stringify(obPayload());}catch(e){}}
  }).catch(function(){setTimeout(obRestore,3000);});}

 business:function(){
  var IN=S.intake||{}, TC=S.intakeTouched||{}, OK=S.intakeOk||{};
  function val(q){return String(IN[q.id]||"");}
  function gapOf(q){return !val(q).trim();}
  function confirmed(q){return !gapOf(q)&&(!!TC[q.id]||!!OK[q.id]);}
  var toFill=QS.filter(gapOf).length;
  var toCheck=QS.filter(function(q){return !gapOf(q)&&!confirmed(q);}).length;
  var conf=QS.filter(confirmed).length, N=QS.length;
  var prePct=Math.round((N-toFill)/N*100), donePct=Math.round(conf/N*100);
  // sticky progress + split counter (required bold, optional check muted) + time cost + smart jump
  var lab;
  if(toFill) lab='<b class="need-n">'+toFill+'</b> still needed · about 8 min<span class="chk"> · '+toCheck+' to check if you like</span>';
  else if(toCheck) lab='<b>All the essentials are in ✓</b><span class="chk"> · '+toCheck+' to check if you like</span>';
  else lab='All done — thank you ✓';
  var jump=toFill?'<button class="intake-jump" data-ijump="need">Jump to next gap →</button>'
          :(toCheck?'<button class="intake-jump" data-ijump="check">Review our notes →</button>'
                   :'<button class="intake-jump" disabled>All done ✓</button>');
  var bar='<div class="intake-bar">'
   +'<div class="ip"><div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="'+N+'" aria-valuenow="'+conf+'" aria-valuetext="'+conf+' confirmed · '+toCheck+' drafted for you to check · '+toFill+' still needed" aria-label="Onboarding progress">'
     +'<span class="pfill pre" style="width:'+prePct+'%"></span><span class="pfill done" style="width:'+donePct+'%"></span></div>'
   +'<div class="lab">'+lab+'</div></div>'
   +'<span class="auto"><span class="dot"></span>Saves automatically</span>'
   +jump+'</div>';
  // cards, grouped into their sections; pre-filled/confirmed collapse to a summary row
  var body="", curSec="", num=0;
  QS.forEach(function(q){
   num++;
   if(q.sec!==curSec){curSec=q.sec;
    var secNeed=QS.filter(function(x){return x.sec===curSec&&gapOf(x);}).length;
    var secCheck=QS.filter(function(x){return x.sec===curSec&&!gapOf(x)&&!confirmed(x);}).length;
    var sp=[];if(secNeed)sp.push(secNeed+' needed');if(secCheck)sp.push(secCheck+' to check');
    body+='<div class="intake-sec">'+curSec+(sp.length?(' <span class="c">· '+sp.join(' · ')+'</span>'):'')+'</div>';}
   var gap=gapOf(q), v=val(q), isConf=confirmed(q);
   var stateCls=gap?'iq-need':(isConf?'iq-ok':'iq-check');
   var chipTxt=gap?'We need this':(isConf?'Done ✓':'Check this');
   var cardCls=gap?'need':(isConf?'':'check');
   var tId='t-'+q.id, qId='q-'+q.id, hId='h-'+q.id, cId='c-'+q.id, exId='ex-'+q.id;
   var qbody=q.q+(q.parts?('<ul class="iq-parts">'+q.parts.map(function(p){return '<li>'+p+'</li>';}).join("")+'</ul>'):'');
   var hintbody=q.hint+(q.optional?' <span class="iq-optional">Optional</span>':'');
   var header='<span class="iq-n">'+num+'</span><span class="iq-t" id="'+tId+'" role="heading" aria-level="3">'+q.name+'</span>'
     +'<span class="iq-chip '+stateCls+'" id="'+cId+'">'+chipTxt+'</span>';
   // every question is an always-open, immediately-editable text box — no collapse, no Edit button
   body+='<div class="iq'+(cardCls?' '+cardCls:'')+'" id="iq-'+q.id+'">'
    +'<div class="iq-h">'+header+'</div>'
    +'<div class="iq-q" id="'+qId+'">'+qbody+'</div>'
    +'<div class="iq-hint" id="'+hId+'">'+hintbody+'</div>'
    +'<textarea class="iq-a" data-iq="'+q.id+'" rows="3" aria-labelledby="'+tId+' '+qId+'" aria-describedby="'+hId+' '+cId+'" placeholder="'+(gap?'Type your answer…':'')+'">'+qesc(v)+'</textarea>'
    +'<div class="iq-foot"><span class="l"><button class="iq-ex" data-iex="'+q.id+'" aria-expanded="false" aria-controls="'+exId+'">See an example</button>'
      +((!gap&&!isConf)?'<button class="iq-confirm" data-iok="'+q.id+'" aria-label="Confirm answer: '+q.name+'">Looks right ✓</button>':'')+'</span>'
      +'<span class="iq-saved" data-saved="'+q.id+'" aria-hidden="true">Saved ✓</span></div>'
    +'<div class="iq-sample" id="'+exId+'" hidden><b>Example:</b> '+q.sample+'</div>'
   +'</div>';
  });
  return '<div class="headline">About your <span class="date">business</span>.</div>'
   +'<div class="subline">We’ve filled in what we picked up on your calls — have a quick look and fix anything that’s off. The ones marked <b>“We need this”</b> are what we’re still missing; anything you don’t get to, we’ll finish together on your call. It saves as you go, so you can stop and come back whenever.</div>'
   +bar
   +'<div class="ob-body intake">'+body+'</div>'
   +'<div class="ob-foot2"><button class="btn-ink" data-done="business">'+(toFill?('Done for now — '+toFill+' still needed'):(toCheck?'Essentials are in — see you on the call ✓':'All done — see you on the call ✓'))+'</button><span class="ob-t clock">you can finish anytime, even with blanks — we complete the rest on your call</span></div>';},

function bindAll(){

 /* never-email card: list rows (what it is + link) — autosaves, completes itself */
 qa("[data-dncf]").forEach(function(inp){
  var kv=inp.getAttribute("data-dncf").split(":"),f=kv[0],i=+kv[1];
  inp.addEventListener("input",function(){if(S.dncLists&&S.dncLists[i]){S.dncLists[i][f]=inp.value;dncSyncDone();save();
   if(_dncTrash){_dncTrash=null;clearTimeout(_dncTrashT);}
   if(f==="url")inp.setAttribute("aria-invalid",(String(inp.value).trim()&&!dncLinkOk(inp.value))?"true":"false");

    sv.classList.add("show");clearTimeout(sv._h);sv._h=setTimeout(function(){sv.classList.remove("show");},2200);}}});

   _dncTrashT=setTimeout(function(){_dncTrash=null;var st=document.getElementById("dncStatus");if(st)st.innerHTML=dncStatusHTML();},7000);}
  dncSyncDone();save();render();
  var add=document.querySelector("[data-dncadd]");if(add)add.focus();});});
 var dna=app.querySelector("[data-dncadd]");
 if(dna)dna.addEventListener("click",function(){S.dncLists.push({name:"",url:""});save();render();
  var ins=document.querySelectorAll('[data-dncf^="name:"]');if(ins.length)ins[ins.length-1].focus();});
 var du=app.querySelector("[data-dncundo]");
