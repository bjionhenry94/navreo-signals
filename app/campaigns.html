      '<button class="btn sm" id="clg-sortbtn" title="Sort rows">' + clgSvg.sort + " Sort</button>" +
      '<button class="btn sm" id="clg-colbtn">columns</button>' +
      '<div class="pagefields"><label for="clg-startrow">Start row</label><input type="number" min="1" class="numinput" id="clg-startrow" value="' + start + '" title="Jump to a row (1-indexed)">' +
      '<label for="clg-rowsinput">Rows</label><input type="number" min="1" class="numinput" id="clg-rowsinput" value="' + CLG.per + '" title="Rows per page"></div>' +
      '<div class="pagecluster"><button class="pagebtn" id="clg-prev" title="Previous page"' + (start <= 1 ? " disabled" : "") + ">" + clgSvg.left + "</button>" +
      '<span class="pagerangetext">' + rangeTxt + "</span>" +
      '<button class="pagebtn" id="clg-next" title="Next page"' + (start - 1 + CLG.per >= view.length ? " disabled" : "") + ">" + clgSvg.right + "</button></div></div>" +
      '<div class="gridwrap"><table class="datagrid">' + thead + tbody + "</table></div>" +
      '<div id="clg-lookup"></div>' +
      (coh
        ? '<p class="sample-footer">All ' + fmtInt(grand) + " repliers across the whole campaign, live from Smartlead, with the reply category in the REPLIED column. They're in the CSV download too.</p>"
        : '<p class="sample-footer">First ' + fmtInt(CLG.rows.length) + " of " + fmtInt(grand) + " leads, live from Smartlead &mdash; Download for the full list.</p>");
    clgWire();
    clgRenderLookup();
  }

  /* "Repliers" quick cohort: the one dataset-wide question asked on every
     campaign, answered across ALL leads (per-category Smartlead filter,
     unioned server-side) — the grid still never renders more than a page. */
  function clgToggleRepliers() {
    if (!CLG || CLG.cohortLoading) return;
    if (CLG.mode === "repliers") { CLG.mode = null; CLG.start = 1; clgRender(); return; }
    if (CLG.cohortRows) { CLG.mode = "repliers"; CLG.start = 1; clgRender(); return; }
    CLG.cohortLoading = true;
    clgRender();
    getJSON("/api/campaign-repliers?platform=smartlead&id=" + encodeURIComponent(CLG.cid))
      .then(function (r) {
        CLG.cohortLoading = false;
        CLG.cohortRows = (r && r.leads) || [];
        CLG.cohortTotal = r && r.total != null ? r.total : CLG.cohortRows.length;
        CLG.mode = "repliers"; CLG.start = 1;
        clgRender();
      })
      .catch(function () { CLG.cohortLoading = false; clgRender(); });
  }

  /* Whole-campaign lookup: a search that misses the loaded 50 must never read
     as "not in the campaign". Full-email queries are checked against ALL the
     campaign's leads server-side; anything else gets an honest scope line. */
  function clgMaybeLookup() {
    if (!CLG) return;
    var q = (CLG.search || "").trim().toLowerCase();
    if (!q || q.indexOf("@") === -1 || q.indexOf("@") === q.length - 1) return;
    if (clgView().length) return;
    if (CLG.lookups[q]) { clgRenderLookup(); return; }
    CLG.lookups[q] = "pending";
    clgRenderLookup();
    getJSON("/api/campaign-lead-lookup?platform=smartlead&id=" + encodeURIComponent(CLG.cid) + "&email=" + encodeURIComponent(q))
      .then(function (r) { CLG.lookups[q] = r || { found: false }; clgRenderLookup(); })
      .catch(function () { delete CLG.lookups[q]; clgRenderLookup(); });
  }
  function clgRenderLookup() {
    var el = document.getElementById("clg-lookup");
    if (!el || !CLG) return;
    var q = (CLG.search || "").trim().toLowerCase();
    if (!q || clgView().length) { el.innerHTML = ""; return; }
    var isEmail = q.indexOf("@") > 0 && q.indexOf("@") < q.length - 1;
    if (!isEmail) {
      el.innerHTML = '<p class="clg-lookline">No matches in the ' + fmtInt(CLG.rows.length) +
        ' loaded rows. For a specific person, search their full email &mdash; the whole campaign gets checked automatically.</p>';
      return;
    }
    var r = CLG.lookups[q];
    if (r === "pending" || !r) {
      el.innerHTML = '<p class="clg-lookline">No matches in the ' + fmtInt(CLG.rows.length) +
        " loaded &mdash; checking all " + fmtInt(CLG.total != null ? CLG.total : 0) + " in the campaign&hellip;</p>";
      return;
    }
    var others = (r.others || []).map(function (o) { return o.name; }).filter(Boolean).slice(0, 3).join(", ");
    if (r.found && r.in_campaign) {
      el.innerHTML = '<p class="clg-lookline"><span class="clg-yes">&#10003;</span> <b>' + esc(r.email) + "</b> IS in this campaign" +
        (r.name || r.company ? " &mdash; " + esc([r.name, r.company].filter(Boolean).join(", ")) : "") +
        (others ? ". Also in: " + esc(others) + "." : ".") + "</p>";
    } else if (r.found) {
      el.innerHTML = '<p class="clg-lookline"><span class="clg-no">&#10007;</span> <b>' + esc(r.email) + "</b> is NOT in this campaign" +
        (others ? " &mdash; but is in: " + esc(others) + "." : " (exists in Smartlead, other campaigns).") + "</p>";
    } else {
      el.innerHTML = '<p class="clg-lookline"><span class="clg-no">&#10007;</span> <b>' + esc(r.email) + "</b> is not in this campaign &mdash; no Smartlead record for this address at all.</p>";
    }
  }
  function clgClosePop() {
    var p = document.querySelector(".clg-popover");
    if (p) p.remove();
    document.removeEventListener("click", clgDocClose);
  }
  function clgDocClose(e) {
    var p = document.querySelector(".clg-popover");
    if (p && !p.contains(e.target)) clgClosePop();
  }
  function clgPop(anchor, cls, html) {
    clgClosePop();
    var pop = document.createElement("div");
    pop.className = "clg-popover " + cls;
    pop.innerHTML = html;
    document.body.appendChild(pop);
    var r = anchor.getBoundingClientRect();
    pop.style.top = (window.scrollY + r.bottom + 4) + "px";
    pop.style.left = Math.max(8, window.scrollX + r.right - pop.offsetWidth) + "px";
    setTimeout(function () { document.addEventListener("click", clgDocClose); }, 0);
    return pop;
  }
  function clgWire() {
    var root = document.getElementById("leads-grid");
    if (!root) return;
    var se = document.getElementById("clg-search");
    se.oninput = function () {
      CLG.search = se.value; CLG.start = 1;
      clgRender();
      var ne = document.getElementById("clg-search");
      if (ne) { ne.focus(); ne.setSelectionRange(ne.value.length, ne.value.length); }
      clearTimeout(CLG.lookT);
      CLG.lookT = setTimeout(clgMaybeLookup, 600);
    };
    root.querySelectorAll("[data-sortcol]").forEach(function (th) {
      th.addEventListener("click", function (e) {
        if (e.target.closest("[data-filtcol]")) return;
        var k = th.getAttribute("data-sortcol");
        if (CLG.sort !== k) { CLG.sort = k; CLG.dir = "asc"; }
        else if (CLG.dir === "asc") CLG.dir = "desc";
        else { CLG.sort = ""; CLG.dir = "asc"; }
        clgRender();
      });
    });
    root.querySelectorAll("[data-filtcol]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var k = btn.getAttribute("data-filtcol");
        var col = CLG_COLS.filter(function (c) { return c.k === k; })[0];
        var pop = clgPop(btn, "filtinput-pop",
          '<input id="clg-filtval" placeholder="' + esc((col ? col.lbl : k) + " contains…") + '" value="' + esc(CLG.filters[k] || "") + '">' +
          '<div class="row"><button class="btn sm" id="clg-filtclear">Clear</button><button class="btn sm primary" id="clg-filtapply">Apply</button></div>');
        var inp = pop.querySelector("#clg-filtval");
        inp.focus();
        var apply = function () {
          var v = inp.value.trim();
          if (v) CLG.filters[k] = v; else delete CLG.filters[k];
          CLG.start = 1; clgClosePop(); clgRender();
        };
        pop.querySelector("#clg-filtapply").onclick = apply;
        inp.onkeydown = function (ev) { if (ev.key === "Enter") apply(); };
        pop.querySelector("#clg-filtclear").onclick = function () { delete CLG.filters[k]; CLG.start = 1; clgClosePop(); clgRender(); };
      });
    });
    root.querySelectorAll("[data-unfilter]").forEach(function (b) {
      b.addEventListener("click", function () { delete CLG.filters[b.getAttribute("data-unfilter")]; CLG.start = 1; clgRender(); });
    });
    document.getElementById("clg-filterbtn").onclick = function (e) {
      e.stopPropagation();
      var opts = CLG_COLS.map(function (c) { return '<option value="' + esc(c.k) + '">' + esc(c.lbl) + "</option>"; }).join("");
      var pop = clgPop(e.currentTarget, "filtinput-pop",
        '<select id="clg-fcol" style="width:100%;margin-bottom:6px;border:1px solid var(--line-2);border-radius:7px;padding:6px 9px;font-size:12.5px;font-family:inherit;background:transparent;color:var(--ink)">' + opts + "</select>" +
        '<input id="clg-filtval" placeholder="Value contains&hellip;">' +
        '<div class="row"><button class="btn sm primary" id="clg-filtapply" style="margin-left:auto">Apply</button></div>');
      pop.querySelector("#clg-filtapply").onclick = function () {
        var k = pop.querySelector("#clg-fcol").value, v = pop.querySelector("#clg-filtval").value.trim();
        if (v) { CLG.filters[k] = v; CLG.start = 1; }
        clgClosePop(); clgRender();
      };
    };
    document.getElementById("clg-sortbtn").onclick = function (e) {
      e.stopPropagation();
      var opts = '<option value="">No sort</option>' + CLG_COLS.map(function (c) {
        return '<option value="' + esc(c.k) + '"' + (CLG.sort === c.k ? " selected" : "") + ">" + esc(c.lbl) + "</option>";
      }).join("");
      var pop = clgPop(e.currentTarget, "sortpop",
        '<div class="p-field"><label>Column</label><select id="clg-scol">' + opts + "</select></div>" +
        '<div class="p-field"><label>Direction</label><div class="dirtoggle">' +
        '<button type="button" id="clg-sasc" class="' + (CLG.dir !== "desc" ? "on" : "") + '">Asc</button>' +
        '<button type="button" id="clg-sdesc" class="' + (CLG.dir === "desc" ? "on" : "") + '">Desc</button></div></div>' +
        '<div class="sortactions"><button class="btn sm" id="clg-sclear">Clear sort</button><button class="btn sm primary" id="clg-sapply">Apply</button></div>');
      var dir = CLG.dir === "desc" ? "desc" : "asc";
      pop.querySelector("#clg-sasc").onclick = function () { dir = "asc"; this.classList.add("on"); pop.querySelector("#clg-sdesc").classList.remove("on"); };
      pop.querySelector("#clg-sdesc").onclick = function () { dir = "desc"; this.classList.add("on"); pop.querySelector("#clg-sasc").classList.remove("on"); };
      pop.querySelector("#clg-sapply").onclick = function () { CLG.sort = pop.querySelector("#clg-scol").value; CLG.dir = dir; clgClosePop(); clgRender(); };
      pop.querySelector("#clg-sclear").onclick = function () { CLG.sort = ""; CLG.dir = "asc"; clgClosePop(); clgRender(); };
    };
    document.getElementById("clg-colbtn").onclick = function (e) {
      e.stopPropagation();
      var pop = clgPop(e.currentTarget, "colpop", CLG_COLS.map(function (c) {
        return '<label><input type="checkbox" data-viscol="' + esc(c.k) + '"' + (CLG.visible[c.k] ? " checked" : "") + "> " + esc(c.lbl) + "</label>";
      }).join(""));
      pop.querySelectorAll("[data-viscol]").forEach(function (chk) {
        chk.addEventListener("change", function () {
          CLG.visible[chk.getAttribute("data-viscol")] = chk.checked;
          clgRender();
        });
      });
    };
    document.getElementById("clg-startrow").onchange = function () {
      CLG.start = Math.max(1, parseInt(this.value, 10) || 1); clgRender();
    };
    document.getElementById("clg-rowsinput").onchange = function () {
      /* the page-weight law: the grid never renders more than CLG_CAP rows */
      CLG.per = Math.min(CLG_CAP, Math.max(1, parseInt(this.value, 10) || CLG_CAP)); clgRender();
    };
    var rp = document.getElementById("clg-repliers");
    if (rp) rp.onclick = clgToggleRepliers;
    document.getElementById("clg-prev").onclick = function () { CLG.start = Math.max(1, CLG.start - CLG.per); clgRender(); };
    document.getElementById("clg-next").onclick = function () { CLG.start = CLG.start + CLG.per; clgRender(); };
    var sa = document.getElementById("clg-selall");
    if (sa) sa.onchange = function () {
      clgView().slice(CLG.start - 1, CLG.start - 1 + CLG.per).forEach(function (l, i) {
        var key = l.email || String(CLG.start - 1 + i);
        if (sa.checked) CLG.selected[key] = true; else delete CLG.selected[key];
      });
      clgRender();
    };
    root.querySelectorAll(".clg-rowchk").forEach(function (chk) {
      chk.addEventListener("change", function () {
        var k = chk.getAttribute("data-key");
        if (chk.checked) CLG.selected[k] = true; else delete CLG.selected[k];
        clgRender();
      });
    });
  }

  /* The "Add more leads" brief: campaign-aware, history-first, routed through
     lilly-strategy and the upload gate. The text IS the interface — a
     strategist pastes it into Claude and the chain fires. */
  function addLeadsPrompt(c) {
    return 'Add more leads to "' + c.name + '" (Smartlead campaign ' + c.id + "). " +
      "First pull this campaign's full picture: targeting and ICP so far, every source list already pushed, " +
      "and lead performance - who replied, who was positive, who booked (use lilly-optimiser + lilly-data). " +
      "Then run lilly-strategy focused on THIS campaign: suggest new lead ideas that either top it up or " +
      "justify a sibling launch, never re-pitching dead angles and netting every idea against contact_history + suppressions. " +
      "When I approve an idea, pull the list and route the upload through /lilly-upload-gate into campaign " + c.id + " (or the new sibling).";
  }
  function clgCopyPrompt(c, btn) {
    var txt = addLeadsPrompt(c);
    var done = function () {
      btn.innerHTML = '<span class="plus">✓</span> Brief copied — paste into Claude Code';
      btn.classList.add("copied");
      setTimeout(function () {
        btn.innerHTML = '<span class="plus">＋</span> Add more leads';
        btn.classList.remove("copied");
      }, 2600);
    };
    var fallback = function () {
      var ta = document.createElement("textarea");
      ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { /* no clipboard: text stays selectable in the card */ }
      ta.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, fallback);
    } else fallback();
  }

  function hydratePlatformLeads(c) {
    var id = c.id;
    var apply = function (pl) {
      var root = document.getElementById("leads-grid");
      if (!root) return;
      var leads = (pl || {}).leads || [];
      if (!leads.length) {
        root.innerHTML = '<p class="card-subtitle">Could not pull the live audience from Smartlead right now.</p>';
        return;
      }
      var vis = {};
      CLG_COLS.forEach(function (col) { vis[col.k] = true; });
      CLG = { cid: id, rows: leads.slice(0, CLG_CAP), total: pl.total, search: "", filters: {}, sort: "", dir: "asc",
              start: 1, per: CLG_CAP, visible: vis, selected: {}, lookups: {}, lookT: null,
              mode: null, cohortRows: null, cohortTotal: null, cohortLoading: false };
      clgRender();
    };
    var dl = document.getElementById("clg-download");
    if (dl) {
      var ic = dl.querySelector(".dlicon");
      if (ic && !ic.innerHTML) ic.innerHTML = clgSvg.dl;
      dl.onclick = function () {
        window.location.assign("/api/campaign-leads-csv?platform=smartlead&id=" + encodeURIComponent(id));
      };
    }
    var cp = document.getElementById("al-add");
    if (cp) cp.onclick = function () { clgCopyPrompt(c, cp); };
    if (STATE.platformLeads[id]) { apply(STATE.platformLeads[id]); return; }
    getJSON("/api/campaign-platform-leads?platform=smartlead&id=" + encodeURIComponent(id) + "&offset=0&limit=" + CLG_CAP).then(function (pl) {
      STATE.platformLeads[id] = pl; apply(pl);
    }).catch(function () { apply(null); });
  }

  /* ---------- router ---------- */
  var listScrollY = 0;
  /* A campaign outside today's crunch (drafted, or not yet briefed) still gets
     a page: live stats from the scorecard, no insight prose. Without this every
     deep link to a draft bounced back to the list. Only ids the scorecard
     knows are real get a page — junk ids still bounce. */
  function ghostRow(id) {
    var sc = ((STATE.scorecard || {}).campaigns || {})[String(id)];
    if (!sc) return null;
    return {
      id: String(id), name: "Campaign " + id, ghost: true,
      slStatus: sc.status || "", tag: "watch", tier: TAG_META.watch.tier,
      pill: "Not in today's briefing", pillClass: "v-amber",
      teaser: "", note: "", drifted: false, act: "", owner: "",
      smartleadUrl: "https://app.smartlead.ai/app/email-campaign/" + id + "/analytics",
      stats: { leads: sc.total, sent: sc.sent, replied: sc.replied, positives: sc.positives,
               bounced: sc.bounced, meetings: 0, completion: null, source: "scorecard" },
      insights: [], others: []
    };
  }

  /* The scorecard has no names — patch the ghost's title in from the unified
     mirror once it arrives (fetched lazily, once per session). */
  function fillGhostName(c) {
    if (!STATE.unifiedP) STATE.unifiedP = getJSON("/api/campaigns-unified").catch(function () { return null; });
    STATE.unifiedP.then(function (u) {
      var row = ((u && u.rows) || []).find(function (r) { return r.key === "camp-sl-" + c.id; });
      if (!row || !row.name) return;
      c.name = row.name;
      var page = document.querySelector('.campaign-page[data-cid="' + c.id + '"]');
      if (!page) return;
      var t = page.querySelector(".campaign-title");
      if (t) t.textContent = row.name;
      if (row.status) {
        var rs = page.querySelector(".campaign-run-status");
        if (rs) rs.textContent = "Runs in Smartlead · " + String(row.status).toLowerCase();
      }
      document.title = row.name + " · The cockpit";
    });
  }

  function route() {
    var hash = window.location.hash || "#/";
    /* top-level page tab: #/optimisations shows the embedded Priority Report;
       every other hash is the campaigns side (list or detail). Handled before
       the campaign matcher so the unknown-hash fallback never eats it. */
    var optim = hash === "#/optimisations";
    document.getElementById("ptab-campaigns").classList.toggle("is-active", !optim);
    document.getElementById("ptab-optim").classList.toggle("is-active", optim);
    var viewOptim = document.getElementById("view-optim");
    if (optim) {
      var vl = document.getElementById("view-list");
      if (!vl.hidden) listScrollY = window.scrollY || 0;
      vl.hidden = true;
      document.getElementById("view-campaign").hidden = true;
      var fr = document.getElementById("optim-frame");
      if (!fr.getAttribute("src")) fr.src = "notifications.html?embed=1";
      viewOptim.hidden = false;
      document.title = "Optimisations · Navreo";
      window.scrollTo(0, 0);
      return;
    }
    viewOptim.hidden = true;
    var m = hash.match(/^#\/c\/(\d+)(?:\/(messaging|leads|sources))?$/);
    var viewList = document.getElementById("view-list");
    var viewCamp = document.getElementById("view-campaign");
    if (!m) {
      /* legacy slug support */
      var lm = hash.match(/^#\/([a-z]+)(?:\/(messaging|leads|sources))?$/);
      if (lm && lm[1] !== "") {
        var slug = lm[1];
        var hit = null;
        LEGACY_SLUGS.some(function (pair) {
          if (pair[0] === slug) {
            STATE.campaigns.some(function (c) { if (pair[1].test(c.name)) { hit = c; return true; } return false; });
            return true;
          }
          return false;
        });
        if (hit) { window.location.replace("#/c/" + hit.id + (lm[2] ? "/" + lm[2] : "")); return; }
      }
      if (hash !== "#/" && hash !== "" && hash !== "#") { window.location.replace("#/"); return; }
      viewCamp.hidden = true;
      document.getElementById("page-root").innerHTML = "";
      viewList.hidden = false;
      document.title = "The cockpit · Navreo daily briefing";
      window.scrollTo(0, listScrollY);
      return;
    }
    var id = m[1], tab = m[2] || "overview";
    /* Sources folded into the Leads hub: the old tab's hash must land on
       Leads, never bounce (hash law). */
    if (tab === "sources") { window.location.replace("#/c/" + id + "/leads"); return; }
    var c = STATE.byId[id] || ghostRow(id);
    if (!c) {
      viewCamp.hidden = true; viewList.hidden = false;
      window.location.hash = "#/";
      return;
    }
    if (!viewList.hidden) listScrollY = window.scrollY || 0;
    viewList.hidden = true;
    viewCamp.hidden = false;
    var pr = document.getElementById("page-root");
    var current = pr.firstElementChild && pr.firstElementChild.getAttribute("data-cid");
    if (current !== String(id)) {
      pr.innerHTML = campaignPageHTML(c, tab);
      attachPageHandlers(c);
      hydrateDetail(c);
      hydrateDraftSources(c);
      if (c.ghost) fillGhostName(c);
    } else {
      /* just switch tab */
      pr.querySelectorAll(".tab-panel").forEach(function (p) { p.hidden = p.getAttribute("data-tab") !== tab; });
      pr.querySelectorAll(".campaign-tab").forEach(function (t) { t.classList.toggle("is-active", t.getAttribute("data-tab") === tab); });
    }
    if (tab === "messaging") { hydrateMessaging(c); hydrateSequenceCopy(c); }
    if (tab === "leads") { hydrateDetail(c); hydratePlatformLeads(c); }
    document.title = c.name + " · The cockpit";
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);

  /* The embedded report grows the iframe to its content height so the cockpit
     keeps the single page scrollbar (no scroll-within-scroll). Same-origin, so
     the frame's document is readable. Sized by a poll, NOT ResizeObserver:
     RO/rAF delivery rides the rendering pipeline and is throttled to silence
     in embedded webviews (verified live — zero deliveries even on real body
     growth), while timers keep running. The poll only works while the tab is
     visible and only writes when the height actually changed. */
  (function () {
    var fr = document.getElementById("optim-frame");
    function fit() {
      try {
        var d = fr.contentDocument;
        if (!d || !d.documentElement) return;
        var h = Math.max(d.documentElement.scrollHeight, 480);
        if (fr.offsetHeight !== h) fr.style.height = h + "px";
      } catch (e) { /* frame not ready */ }
    }
    fr.addEventListener("load", fit);
    setInterval(function () {
      if (!document.getElementById("view-optim").hidden) fit();
    }, 700);
  })();

  /* ---------- handlers ---------- */
  function attachListHandlers() {
    var root = document.getElementById("list-root");
    var viewNote = document.getElementById("view-note");
    /* "Sort by" dropdown — the old view chips as one select; still filters + sorts in one pick */
    var viewSel = document.getElementById("view-select");
    if (viewSel) viewSel.addEventListener("change", function () {
      STATE.view.preset = viewSel.value;
      if (viewNote) viewNote.textContent = (PRESETS[viewSel.value] || {}).note || "";
      renderRows();
    });
    /* Filters button tag: a non-default Client/Status must stay visible while collapsed */
    function syncFiltersTag() {
      var tag = document.getElementById("filters-tag");
      if (!tag) return;
      var LBL = { active: "Active", paused: "Paused", completed: "Completed", archived: "Archived", drafted: "Draft" };
      var parts = [];
      if (STATE.view.client !== "all") parts.push(STATE.view.client);
      if (STATE.view.status !== "all") parts.push(LBL[STATE.view.status] || STATE.view.status);
      tag.textContent = parts.join(" · ");
      tag.hidden = !parts.length;
    }
    /* Filters popover: one tap open, any outside click closes */
    var filtersBtn = document.getElementById("filters-btn");
    var filtersPop = document.getElementById("filters-pop");
    if (filtersBtn && filtersPop) {
      filtersBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var open = filtersPop.hidden;
        filtersPop.hidden = !open;
        filtersBtn.setAttribute("aria-expanded", String(open));
      });
      filtersPop.addEventListener("click", function (e) { e.stopPropagation(); });
      document.addEventListener("click", function () {
        if (!filtersPop.hidden) { filtersPop.hidden = true; filtersBtn.setAttribute("aria-expanded", "false"); }
      });
    }
    /* client dropdown */
    var clientSel = document.getElementById("client-select");
    if (clientSel) clientSel.addEventListener("change", function () {
      STATE.view.client = clientSel.value;
      syncFiltersTag();
      renderRows();
    });
    /* live status dropdown */
    var statusSel = document.getElementById("status-select");
    if (statusSel) statusSel.addEventListener("change", function () {
      STATE.view.status = statusSel.value;
      syncFiltersTag();
      renderRows();
    });
    syncFiltersTag(); /* opening state: status defaults to Active, so the tag shows it */
    /* live refresh */
    var refreshBtn = document.getElementById("live-refresh-btn");
    if (refreshBtn) refreshBtn.addEventListener("click", function () {
      STATE.liveCheckedAt = null; loadLiveStatus();
    });
    /* search */
    document.getElementById("cockpit-search").addEventListener("input", function () {
      STATE.view.q = document.getElementById("cockpit-search").value || "";
      renderRows();
    });
    var clearBtn = document.getElementById("clear-filters-btn");
    if (clearBtn) clearBtn.addEventListener("click", function () {
      document.getElementById("cockpit-search").value = "";
      STATE.view.q = ""; STATE.view.tier = "all"; STATE.view.status = "all"; STATE.view.preset = "all"; STATE.view.client = "all";
      var sel = document.getElementById("status-select"); if (sel) sel.value = "all";
      var csel = document.getElementById("client-select"); if (csel) csel.value = "all";
      if (viewSel) viewSel.value = "all";
      if (viewNote) viewNote.textContent = (PRESETS.all || {}).note || "";
      syncFiltersTag();
      renderRows();
    });
    /* Inline "Review N" optimiser panels. Delegated on the rows container (which
       is rebuilt via innerHTML on every filter/search change) so one binding
       survives all rebuilds. The badge lives inside the row link, so we swallow
       its click (preventDefault + stopPropagation) to stop the row navigating;
       every other click on the row still opens the campaign page as before. */
    var rowsC = document.getElementById("campaign-rows");
    if (rowsC && !rowsC.getAttribute("data-optim-bound")) {
      rowsC.setAttribute("data-optim-bound", "1");
      var toggleReview = function (badge) {
        var id = badge.getAttribute("data-review");
        var panel = document.getElementById("optim-c" + id);
        if (!panel) return;
        var willOpen = panel.hidden;
        panel.hidden = !willOpen;
        badge.setAttribute("aria-expanded", willOpen ? "true" : "false");
        if (willOpen) {
          var cs = STATE.campaigns || [], c = null;
          for (var i = 0; i < cs.length; i++) { if (String(cs[i].id) === String(id)) { c = cs[i]; break; } }
          if (c) openRowOptim(c, panel);
        }
      };
      rowsC.addEventListener("click", function (e) {
        var badge = e.target.closest && e.target.closest(".review-badge");
        if (!badge) return;
        e.preventDefault(); e.stopPropagation();
        toggleReview(badge);
      });
      rowsC.addEventListener("keydown", function (e) {
        if (e.key !== "Enter" && e.key !== " " && e.key !== "Spacebar") return;
        var badge = e.target.closest && e.target.closest(".review-badge");
        if (!badge) return;
        e.preventDefault(); e.stopPropagation();
        toggleReview(badge);
      });
    }
    attachThemeToggles(root);
  }

  /* ---------- shared optimiser-action wiring ----------
     Used by BOTH the campaign page's "Suggested actions" and the list's inline
     "Review N" panels, so the two surfaces behave identically and share one
     assignment fetch + one in-memory ASSIGN map (a click on either surface is
     reflected everywhere). "Fix inside of Claude" opens a fresh Claude chat with
     the prompt pre-filled; the state buttons stay TEAM-SHARED via
     /api/cockpit/assignments (one owner per action, reconciled server-side). */
  var ACT_ASSIGN = {};   // action_key -> { state, assigned_to }
  var ACT_ME = null;     // this viewer's login email, for "you own it" labelling
  var ACT_LOADED = false;
  function actAssigneeName(email) {
    if (!email) return "";
    var local = String(email).split("@")[0];
    var parts = local.split(/[._-]+/).filter(Boolean).map(function (w) {
      return w.charAt(0).toUpperCase() + w.slice(1);
    });
    return parts.join(" ") || String(email);
  }
  function actStateVerb(state) { return state === "ack" ? "In progress" : state === "done" ? "Completed" : "Dismissed"; }
  function actApplyCard(card) {
    var key = card.getAttribute("data-action-key");
    var rec = ACT_ASSIGN[key] || {};
    var state = rec.state || "";
    var mine = rec.assigned_to && ACT_ME && rec.assigned_to.toLowerCase() === ACT_ME.toLowerCase();
    var who = mine ? "you" : actAssigneeName(rec.assigned_to);
    var DEFAULT_LABEL = { ack: "Assign to me", done: "Mark as completed", dismiss: "Dismiss" };
    card.querySelectorAll(".action-state-btn").forEach(function (x) {
      x.classList.remove("is-active", "is-acked", "is-done-state");
      x.setAttribute("aria-pressed", "false");
      var d = x.getAttribute("data-act");
      if (DEFAULT_LABEL[d]) x.textContent = DEFAULT_LABEL[d];
    });
    var dr = card.querySelector(".action-dismissed-row");
    var body = card.querySelector(".action-body");
    var tag = card.querySelector(".assignee-tag");
    if (state === "dismiss") {
      if (dr) { dr.hidden = false; var s = dr.querySelector("span"); if (s && s.childNodes[0]) s.childNodes[0].nodeValue = (who ? "Dismissed by " + who : "Dismissed") + " · "; }
      if (body) body.style.opacity = "0.45";
    } else {
      if (dr) dr.hidden = true;
      if (body) body.style.opacity = "";
    }
    var btn = state && state !== "dismiss" ? card.querySelector('.action-state-btn[data-act="' + state + '"]') : null;
    if (btn) {
      btn.classList.add("is-active");
      btn.classList.add(state === "ack" ? "is-acked" : "is-done-state");
      btn.setAttribute("aria-pressed", "true");
      btn.textContent = (state === "ack" ? "In progress" : "Completed") + (who ? " · " + who : "");
    }
    if (tag) {
      if ((state === "ack" || state === "done") && who) { tag.hidden = false; tag.textContent = actStateVerb(state) + " · " + who; }
      else { tag.hidden = true; tag.textContent = ""; }
    }
  }
  function actLoadOnce(cb) {
    if (ACT_LOADED) { cb(); return; }
    Promise.all([
      getJSON("/api/cockpit/assignments").catch(function () { return {}; }),
      getJSON("/api/auth/me").catch(function () { return {}; })
    ]).then(function (res) {
      ACT_ASSIGN = (res[0] && res[0].assignments) || {};
      ACT_ME = (res[1] && res[1].email) || null;
      ACT_LOADED = true;
      cb();
    });
  }
  /* Shared toast for the cockpit's copy actions. */
  function cockpitToast(msg) {
    var t = document.getElementById("cockpit-toast");
    if (t) t.remove();
    t = document.createElement("div");
    t.id = "cockpit-toast";
    t.style.cssText = "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;" +
      "background:#141414;color:#fff;border-radius:12px;padding:12px 18px;font-size:0.9rem;" +
      "box-shadow:0 8px 28px rgba(0,0,0,.25);max-width:92vw;text-align:center";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 6000);
  }

  function wireActionCards(root) {
    /* "Copy prompt for Claude" — puts the prompt on the clipboard so it can be
       pasted into a NEW Claude chat. Deliberately does not navigate: both
       previous attempts (claude:// desktop deep link, then claude.ai/new?q=)
       depended on the app being registered or on a query param surviving a
       multi-KB prompt, and silently did nothing when either failed. A copy
       always works and leaves the strategist in control of where it lands.
       stopPropagation so a card living inside a row link never navigates. */
    root.querySelectorAll(".copy-prompt").forEach(function (b) {
      if (b.getAttribute("data-fix-bound")) return;
      b.setAttribute("data-fix-bound", "1");
      b.addEventListener("click", function (e) {
        e.preventDefault(); e.stopPropagation();
        var txt = b.getAttribute("data-prompt") || "";
        if (!txt) return;
        var old = b.textContent;
        function copied() {
          b.textContent = "Copied ✓";
          b.classList.add("is-copied");
          setTimeout(function () { b.textContent = old; b.classList.remove("is-copied"); }, 2500);
          cockpitToast("Prompt copied — paste it into a new Claude chat.");
        }
        /* Fallback for non-secure contexts / browsers without the async
           clipboard API: show the text selected so Cmd+C still works. */
        function fallbackPopover() {
          var pop = document.createElement("div");
          pop.style.cssText = "position:absolute;z-index:60;background:var(--bg-elevated,#fff);" +
            "border:1px solid var(--border-strong);border-radius:12px;padding:14px;" +
            "box-shadow:0 6px 24px rgba(0,0,0,.12);width:340px;max-width:92vw";
          pop.innerHTML = '<div style="font-weight:600;margin-bottom:6px">Copy this, paste into a new Claude chat</div>' +
            '<textarea readonly style="width:100%;height:120px;font:12px/1.45 ui-monospace,monospace;' +
            'border:1px solid var(--border-strong);border-radius:8px;padding:8px;resize:none"></textarea>';
          pop.querySelector("textarea").value = txt;
          var r = b.getBoundingClientRect();
          pop.style.left = Math.max(10, r.right - 350) + "px";
          pop.style.top = (r.bottom + window.scrollY + 6) + "px";
          document.body.appendChild(pop);
          pop.querySelector("textarea").select();
          setTimeout(function () {
            document.addEventListener("click", function close(ev) {
              if (!pop.contains(ev.target) && ev.target !== b) {
                pop.remove(); document.removeEventListener("click", close);
              }
            });
          }, 0);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(copied).catch(fallbackPopover);
        } else {
          fallbackPopover();
        }
      });
    });
    /* Why? digest — the receipts behind THIS card only, lazy-fetched on the
       FIRST open of a card's Why?. Still one request per campaign (WHY_CACHE);
       the per-card scoping is a client-side filter on the shared rows. */
    root.querySelectorAll(".opt-why[data-why-cid]").forEach(function (d) {
      if (d.getAttribute("data-why-bound")) return;
      d.setAttribute("data-why-bound", "1");
      d.addEventListener("toggle", function () {
        if (!d.open) return;
        var box = d.querySelector(".why-full");
        if (!box || box.getAttribute("data-loaded")) return;
        box.setAttribute("data-loaded", "1");
        var cardEl = d.closest(".action-card");
        /* headline half \u0001 note half: email tokens only bind from the head */
        var grab = function (sels) {
          var t = ""; sels.forEach(function (sel) { var el = cardEl && cardEl.querySelector(sel); if (el) t += " " + el.textContent; });
          return t;
        };
        var cardText = grab([".action-how", ".action-payoff"]) + "\u0001" + grab([".why-verdict", ".why-hero-cap"]);
        whyBreakdownFetch(d.getAttribute("data-why-cid")).then(function (rows) {
          box.innerHTML = whyDigestHTML(Array.isArray(rows) ? rows : null, d.getAttribute("data-why-v") === "1", cardText || "");
        });
      });
    });
    actLoadOnce(function () { root.querySelectorAll(".action-card").forEach(actApplyCard); });
    root.querySelectorAll(".action-card").forEach(function (card) {
      if (card.getAttribute("data-act-bound")) return;
      card.setAttribute("data-act-bound", "1");
      var key = card.getAttribute("data-action-key");
      var parts = (key || "").split("::");
      var cid = parts[0], ik = parts.slice(1).join("::");
      card.querySelectorAll(".action-state-btn, .action-undo-btn").forEach(function (b) {
        b.addEventListener("click", function (e) {
          e.preventDefault(); e.stopPropagation();
          var act = b.getAttribute("data-act");
          var cur = (ACT_ASSIGN[key] || {}).state || "";
          var next = (act === "undo" || cur === act) ? "clear" : act;
          var prev = ACT_ASSIGN[key];
          if (next === "clear") delete ACT_ASSIGN[key];
          else ACT_ASSIGN[key] = { state: next, assigned_to: ACT_ME };
          actApplyCard(card);
          fetch("/api/cockpit/assignments", {
            method: "POST", credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action_key: key, campaign_id: cid, insight_key: ik, state: next })
          }).then(function (r) { return r.json(); }).then(function (out) {
            if (!out || out.ok === false) throw new Error((out && out.message) || "save failed");
            if (next === "clear") delete ACT_ASSIGN[key];
            else ACT_ASSIGN[key] = { state: out.state, assigned_to: out.assigned_to };
            actApplyCard(card);
          }).catch(function () {
            if (prev) ACT_ASSIGN[key] = prev; else delete ACT_ASSIGN[key];
            actApplyCard(card);
          });
        });
      });
    });
  }

  /* ---------- Why? full-breakdown data (optimiser_notifications) ---------- */
  var WHY_CACHE = {};   // campaign_id -> Promise<rows>
  function whyBreakdownFetch(cid) {
    if (!WHY_CACHE[cid]) {
      WHY_CACHE[cid] = getJSON("/api/notifications?slim=1&campaign_id=" + encodeURIComponent(cid))
        .catch(function () { delete WHY_CACHE[cid]; return null; });
    }
    return WHY_CACHE[cid];
  }
  /* Which optimiser_notifications rows belong to which card kind. Everything
     else on the campaign stays out of this card's Why? (that was the old
     dump-everything bug). recommended_action and all_clear never render:
     the paste block already lives behind "Copy prompt for Claude". */
  function whyCardTokens(cardText) {
    /* Variant letters and email numbers the card's own text names, e.g.
       "Scrap Email 2's name-drop close" or "Run Var E and Var F wider".
       Email numbers count only from the headline half (before the \\u0001
       separator) - a note saying "every positive came from Email 1" must not
       drag the whole other step's variants into a card about Email 2. Letters
       count from everywhere, so comparison variants the note names get bars. */
    var parts = (cardText || "").split("\u0001");
    var head = parts[0] || "", m, vars = {}, emails = {};
    var reV = /\bVar(?:iant)?\s+([A-Z])\b/g, reE = /\bEmail\s+(\d+)\b/g;
    while ((m = reV.exec(cardText || ""))) vars[m[1]] = 1;
    while ((m = reE.exec(head))) emails[m[1]] = 1;
    return { vars: vars, emails: emails, anyVar: Object.keys(vars).length > 0, anyEmail: Object.keys(emails).length > 0 };
  }
  function whyHarvestVariants(rows, tok) {
    /* The per-variant numbers live in whatever row carries a variants array
       (usually the recommended_action split table - harvested for data only,
       its paste-block text never renders). Trimmed to the variants or email
       step the card itself names. */
    var seen = {}, vs = [], all = [];
    (rows || []).forEach(function (n) {
      (n.variants || []).forEach(function (v) {
        var key = String(v.email) + "-" + String(v.variant);
        if (seen[key] || !(v.sent > 0)) return;
        seen[key] = 1; all.push(v);
        var named = (tok.anyVar && tok.vars[String(v.variant)]) || (!tok.anyVar && tok.anyEmail && tok.emails[String(v.email)]);
        if (named) vs.push(v);
      });
    });
    if (tok.anyVar) {
      /* variant letters repeat across email steps ("Var B" exists on Email 1
         and Email 2): resolve to ONE step - a step the card names that holds
         every named letter, else the earliest step that does, else the
         earliest with any match */
      var emails = []; vs.forEach(function (v) { if (emails.indexOf(v.email) === -1) emails.push(v.email); });
      emails.sort(function (a, b) { return a - b; });
      var want = Object.keys(tok.vars), pick = null;
      var holdsAll = function (e) {
        var have = vs.filter(function (v) { return v.email === e; }).map(function (v) { return String(v.variant); });
        return want.every(function (w) { return have.indexOf(w) !== -1; });
      };
      emails.forEach(function (e) { if (pick == null && tok.emails[String(e)] && holdsAll(e)) pick = e; });
      emails.forEach(function (e) { if (pick == null && holdsAll(e)) pick = e; });
      if (pick == null) pick = emails[0];
      vs = vs.filter(function (v) { return v.email === pick; });
    }
    /* winners first: best per-positive ratio at the top, zero-positive last */
    var perPos = function (v) { return v.positives > 0 ? (v.sent || 0) / v.positives : Infinity; };
    vs.sort(function (a, b) { return perPos(a) - perPos(b) || (b.sent || 0) - (a.sent || 0); });
    vs = vs.slice(0, 5);
    if (!tok.anyVar && tok.anyEmail) {
      /* one aggregate contrast bar per OTHER email step, so a claim like
         "every positive came from Email 1" is glance-checkable */
      var sums = {};
      all.forEach(function (v) {
        if (tok.emails[String(v.email)]) return;
        var s = sums[v.email] || (sums[v.email] = { email: v.email, variant: null, agg: true, sent: 0, positives: 0, flags: [] });
        s.sent += v.sent || 0; s.positives += v.positives || 0;
      });
      Object.keys(sums).sort().forEach(function (e) { if (vs.length < 6) vs.push(sums[e]); });
    }
    return vs.slice(0, 6);
  }
  function whyBarsHTML(vs, showCut) {
    if (!vs.length) return "";
    var max = Math.max.apply(null, vs.map(function (v) { return v.sent || 0; }).concat([1]));
    var anyOff = false;
    var h = ['<div class="why-bars">'];
    vs.forEach(function (v) {
      var flags = v.flags || [];
      var cut = showCut && !v.agg && flags.indexOf("failing") !== -1;
      var off = flags.indexOf("disabled") !== -1 || flags.indexOf("zero_distribution") !== -1;
      if (off) anyOff = true;
      var label = v.agg ? "E" + esc(String(v.email)) + " overall"
        : "E" + esc(String(v.email)) + (v.variant != null ? " Var " + esc(String(v.variant)) : "") + (off ? " (off)" : "");
      h.push('<div class="why-bar-row' + (cut ? " wv-cut" : "") + (off ? " wv-inactive" : "") + '">' +
        '<span class="why-bar-label' + (cut ? " wv-cut" : "") + '">' + label + "</span>" +
        '<span class="why-bar-track"><span class="why-bar-fill" style="width:' + Math.max(2, Math.round((v.sent || 0) / max * 100)) + '%"></span></span>' +
        '<span class="why-bar-count"><b>' + fmtInt(v.positives) + "</b> pos / " + fmtInt(v.sent) +
        (v.positives > 0 ? " &middot; 1 per " + fmtInt(Math.round((v.sent || 0) / v.positives)) : "") + "</span>");
      h.push("</div>");
    });
    h.push("</div>", '<p class="why-bars-caption">Bar = sends.' +
      (showCut ? " Red = replace this variant." : "") + (anyOff ? " Greyed = switched off." : "") + "</p>");
    return h.join("");
  }
  function whyVariantVerdict(vs, showCut) {
    /* Fallback verdict when the card has no note but names a variant/email
       whose numbers we hold. Aggregate contrast bars stay out of the sums. */
    var named = vs.filter(function (v) { return !v.agg; });
    if (!named.length) named = vs;
    var label;
    if (named.length === 1) {
      label = "Email " + named[0].email + (named[0].variant != null ? " Var " + named[0].variant : "");
    } else {
      var em = named[0].email, same = named.every(function (v) { return v.email === em; });
      label = same ? "Email " + em + " Var " + named.map(function (v) { return v.variant; }).join(" + ") : "The variants shown";
    }
    var sent = 0, pos = 0; named.forEach(function (v) { sent += v.sent || 0; pos += v.positives || 0; });
    var line = label + ": " + fmtInt(sent) + " sent, " + fmtInt(pos) + " positive" + (pos === 1 ? "" : "s");
    if (showCut && named.every(function (v) { return (v.flags || []).indexOf("failing") !== -1; })) line += ", flagged for replacement";
    return esc(line + ".");
  }
  function whyDigestHTML(rows, hasVerdict, cardText) {
    /* Lazy layer = per-variant bars only, and only when the card itself
       names a variant or email step. Everything textual on the expander is
       already rendered from the card's own payload (one source of truth). */
    var tok = whyCardTokens(cardText);
    var vs = (tok.anyVar || tok.anyEmail) ? whyHarvestVariants(rows, tok) : [];
    var showCut = /\b(scrap|replace|kill|retire|drop|cut|swap|remove)\b/i.test(cardText || "");
    if (!vs.length) return hasVerdict ? "" : '<p class="why-empty">No further findings behind this one.</p>';
    return (hasVerdict ? "" : '<p class="why-verdict">' + whyVariantVerdict(vs, showCut) + "</p>") + whyBarsHTML(vs, showCut);
  }

  /* Populate a row's inline "Review N" panel from the campaign's in-memory
     acts (no fetch), then wire it with the shared handler. Idempotent. */
  function openRowOptim(c, panel) {
    if (panel.getAttribute("data-loaded")) return;
    panel.setAttribute("data-loaded", "1");
    var acts = campaignActs(c);
    if (!acts.length) {
      panel.innerHTML = '<p class="row-optim-empty">Nothing to review right now — this campaign is healthy.</p>';
      return;
    }
    var h = ['<div class="actions-section">'];
    acts.forEach(function (r, i) { h.push(actionCardHTML(c, r, i)); });
    h.push("</div>");
    panel.innerHTML = h.join("");
    wireActionCards(panel);
  }

  function attachPageHandlers(c) {
    var pr = document.getElementById("page-root");
    attachThemeToggles(pr);
    applyTheme(currentTheme());
    wireActionCards(pr);
  }

  /* ---------- theme ---------- */
  var THEME_KEY = "cockpit-theme";
  function currentTheme() {
    return document.documentElement.getAttribute("data-nav-theme") === "dark" ? "dark" : "light";
  }
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-nav-theme", theme);
    document.querySelectorAll(".theme-toggle").forEach(function (b) {
      b.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
      var lbl = b.querySelector(".theme-toggle-label");
      if (lbl) lbl.textContent = theme === "dark" ? "Light" : "Dark";
    });
  }
  function initTheme() {
    var saved = null;
    try { saved = window.localStorage.getItem(THEME_KEY); } catch (e) {}
    var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    applyTheme(saved || (prefersDark ? "dark" : "light"));
  }
  function attachThemeToggles(scope) {
    (scope || document).querySelectorAll(".theme-toggle").forEach(function (b) {
      if (b.getAttribute("data-bound")) return;
      b.setAttribute("data-bound", "1");
      b.addEventListener("click", function () {
        var cur = currentTheme() === "dark" ? "light" : "dark";
        try { window.localStorage.setItem(THEME_KEY, cur); } catch (e) {}
        applyTheme(cur);
      });
    });
  }

  /* the shared rail (shell.js) has no theme control of its own — the cockpit
     is the only dark-mode-aware page, so its toggle mounts into the rail
     bottom here, below the Settings cog */
  function mountRailThemeToggle() {
    var rail = document.querySelector(".rail");
    if (!rail || rail.querySelector(".theme-toggle")) return;
    var tmp = document.createElement("div");
    tmp.innerHTML = themeToggleHTML();
    var btn = tmp.firstElementChild;
    btn.className += " theme-toggle--icon";
    rail.appendChild(btn);
    attachThemeToggles(rail);
  }

  mountRailThemeToggle();
  initTheme();
  boot();
})();
</script>
