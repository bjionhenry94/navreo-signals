      '<div id="leads-grid"><p class="lw-loading">Pulling the live audience from Smartlead&hellip;</p></div></div>' +
      '<div class="sources-section" id="draft-sources-section"><div class="section-label">Previously uploaded lists</div>' +
      '<div id="draft-sources-root"></div><div id="sources-root"><p class="lw-loading">Loading&hellip;</p></div>' +
      '<div id="sources-empty"></div>' +
      '<button class="add-tile" id="al-add" title="Copies the add-more-leads brief for this campaign — paste it into Claude Code"><span class="plus">＋</span> Add more leads</button></div>' +
      "</div>");

    h.push("</div></article>");
    return h.join("");
  }

  /* Drafted sources: tool source docs bound to this campaign (camp-sl-<id>),
     e.g. a recontact pool staged against a drafted campaign. Separate root from
     the push-history fill below so the two hydrations never clobber each other. */
  /* Drafted sources + pull-more, unified (P4 ruling, 25 Jul 2026): the source
     card itself carries pulled / not-yet-pulled and a "+ Add people" button -
     "we pulled from that list; plenty left; pull more from it." The pull runs
     server-side as a polled job (sweep, ListMint, audit, upload). */
  function hydrateDraftSources(c) {
    if (!STATE.slimSourcesP) STATE.slimSourcesP = getJSON("/api/sources?slim=1").catch(function () { return null; });
    Promise.all([STATE.slimSourcesP, getJSON("/api/pool-pulls").catch(function () { return null; })])
      .then(function (rs) {
        var all = rs[0];
        var pools = ((rs[1] || {}).pools) || [];
        var mine = (Array.isArray(all) ? all : []).filter(function (s) {
          return String(s.campaign_id) === "camp-sl-" + c.id;
        });
        var sec = document.querySelector('.campaign-page[data-cid="' + c.id + '"] #draft-sources-section');
        if (!sec) return;
        if (!mine.length) { maybeSourcesEmpty(); return; }
        function poolOf(s) {
          return pools.find(function (p) { return p.list_id === s.list_id && String(p.campaign_id) === String(c.id); }) || null;
        }
        document.getElementById("draft-sources-root").innerHTML = '<div class="source-list-cards">' + mine.map(function (s) {
          var pool = poolOf(s);
          if (pool) {
            /* V1 progress-bar card (glance-lab ruling, 25 Jul 2026): name + actions,
               a slim pulled/available bar, labelled ends, honest last-add line. */
            var pct = pool.total_pool ? Math.max(0.4, pool.pulled_ok / pool.total_pool * 100) : 0;
            /* A pool-backed source is still whatever kind it is: a fixed list
               says so here too, or the bar reads as a signal filling up. The
               "still available" people are the ones already bought — the pool
               tops up from the banked list, it never finds anyone new. */
            var fx = isFixedList(s);
            return '<div class="source-list-card" data-pool="' + esc(pool.id) + '" style="display:block">' +
              '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">' +
              '<span style="min-width:0"><span class="source-list-name">' + esc(s.name || "Source") + "</span>" +
              (fx ? ' <span class="sig-chip sig-chip--fixed" title="A one-off list: these people were pulled once on a set of filters. It is not a signal - nothing new arrives tomorrow, and nothing runs in the background.">Fixed list</span>' : "") +
              "</span>" +
              '<div style="display:flex;align-items:center;gap:8px;flex:0 0 auto">' +
              (s.list_id ? '<a class="action-link" href="/app/lists.html#' + esc(s.list_id) + '">View the list</a>' : "") +
              '<span data-pool-act></span></div></div>' +
              '<div style="height:8px;border-radius:4px;background:var(--border-strong);overflow:hidden;margin:10px 0 5px">' +
              '<i style="display:block;height:100%;width:' + pct.toFixed(1) + '%;background:#E8590C"></i></div>' +
              '<div class="source-list-meta" style="display:flex;justify-content:space-between;gap:10px">' +
              '<span><b style="color:var(--fg)">' + fmtInt(pool.pulled_ok) + "</b> pulled</span>" +
              '<span><b style="color:var(--fg)">' + fmtInt(pool.remaining) + "</b> still available</span></div>" +
              (fx ? '<span class="source-list-meta" style="display:block;margin-top:6px">One-off list &middot; the people still available were bought in the same pull; nothing new arrives.</span>' : "") +
              '<span class="source-list-meta" data-pool-note style="display:block;margin-top:6px">' + poolNoteHTML(pool) + "</span></div>";
          }
          if (isFixedList(s)) return fixedRowHTML(c, s);
          if (sigMech(s)) return sigRowHTML(c, s);
          var n = s.total != null ? s.total : ((s.prospects || []).length || null);
          var inner = '<span class="source-list-name">' + esc(s.name || "Source") + "</span>" +
            '<span class="source-list-meta">' + (n != null ? "~" + fmtInt(n) + " people staged" : "Sized on the first pull") +
            " &middot; drafted, nothing sends" +
            (s.list_id ? ' &middot; <span class="action-link">View the list</span>' : "") + "</span>";
          return s.list_id
            ? '<a class="source-list-card source-list-card--link" href="/app/lists.html#' + esc(s.list_id) + '">' + inner + "</a>"
            : '<div class="source-list-card">' + inner + "</div>";
        }).join("") + "</div>";
        mine.forEach(function (s) {
          var pool = poolOf(s);
          if (pool) paintPoolCard(c, pool);
        });
        bindSigRows(c);
        maybeSourcesEmpty();
      });
  }

  /* ── Signal-source rows (signal-sources-p2b ship, 25 Jul 2026) ──────────
     A signal source (hiring / engagement / followers / lookalike) manages
     itself from the cockpit: Live toggle, View list, Find people again on the
     row; targeting / duplicate / icebreaker behind the row's expand. All four
     actions call the SAME endpoints the classic console uses — no new server
     surface. Approve/reject and Remove stay OUT of the cockpit (user ruling:
     the list page is the review surface; removal lives in the classic console). */
  function sigMech(s) {
    var m = String(s.mechanism || s.type || "").toLowerCase();
    return (m === "hiring" || m === "engagement" || m === "followers" || m === "lookalike") ? m : "";
  }
  /* ── Fixed lists (doc.type "fixed_list", 27 Jul 2026) ───────────────────
     A one-off pull: a finite set of people bought once on a set of filters.
     Nothing new arrives tomorrow, so it gets a neutral badge instead of the
     orange signal chip, NO Live toggle (there is nothing to keep running),
     and "Find people again" only when the doc actually carries the filters
     to pull it again with (params.repull). Three fixed lists shipped as type
     "hiring" on 27 Jul 2026 and rendered with a HIRING badge + an armed Live
     toggle — Bjion: a fixed list must never be dressed up as a signal. */
  function isFixedList(s) {
    return String(s.mechanism || s.type || "").toLowerCase() === "fixed_list";
  }
  function fixedRepull(s) {
    var r = (s.params || {}).repull;
    return (r && typeof r === "object" && Object.keys(r).length) ? r : null;
  }
  function fixedRowHTML(c, s) {
    var n = s.total != null ? s.total : ((s.prospects || []).length || null);
    var meta = (n != null ? '<b style="color:var(--fg)">' + fmtInt(n) + "</b> people" : "Size not recorded") +
      " &middot; pulled once" + (s.last_pull ? " " + esc(sigAgo(s.last_pull)) : "") +
      " &middot; doesn't refresh";
    return '<div class="source-list-card sig-row" data-sig-row="' + esc(s.id) + '">' +
      '<div class="sig-row-top">' +
        '<div class="sig-main"><span class="source-list-name">' + esc(s.name || "Fixed list") + "</span> " +
        '<span class="sig-chip sig-chip--fixed" title="A one-off list: these people were pulled once on a set of filters. It is not a signal - nothing new arrives tomorrow, and nothing runs in the background.">Fixed list</span>' +
        '<div class="source-list-meta" style="white-space:normal;margin-top:3px">' + meta + "</div></div>" +
        (s.list_id ? '<a class="action-link" href="/app/lists.html#' + esc(s.list_id) + '">View list</a>' : "") +
        (fixedRepull(s)
          ? '<button type="button" class="action-link sig-primary" data-sig-pull="' + esc(s.id) + '"' +
            ' title="Pulls again with the exact filters saved on this list">Find people again</button>'
          : "") +
      "</div></div>";
  }
  function sigAgo(iso) {
    if (!iso) return "";
    var ms = Date.now() - new Date(iso).getTime();
    if (!(ms >= 0)) return "";
    var mins = Math.round(ms / 60000);
    if (mins < 60) return mins + " min ago";
    var hrs = Math.round(mins / 60);
    if (hrs < 48) return hrs + " h ago";
    return Math.round(hrs / 24) + " days ago";
  }
  function sigToast(msg) {
    var t = document.getElementById("sig-toast");
    if (t) t.remove();
    t = document.createElement("div");
    t.id = "sig-toast";
    t.style.cssText = "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;" +
      "background:#141414;color:#fff;border-radius:12px;padding:12px 18px;font-size:0.9rem;" +
      "box-shadow:0 8px 28px rgba(0,0,0,.25);max-width:92vw;text-align:center";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 6000);
  }
  function sigPost(url, body) {
    return fetch(url, {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok || j.ok === false) throw new Error((j && j.message) || "Request failed");
        return j;
      });
    });
  }
  function sigRehydrate(c) {
    STATE.slimSourcesP = null; // sources changed server-side — force a fresh slim fetch
    hydrateDraftSources(c);
  }
  function sigRowHTML(c, s) {
    var mech = sigMech(s);
    var live = s.active !== false;
    var meta = s.last_pull
      ? '<b style="color:var(--fg)">' + fmtInt(s.total || 0) + "</b> found &middot; last pulled " + esc(sigAgo(s.last_pull))
      : (s.total ? "~" + fmtInt(s.total) + " expected on first pull" : "Sized on the first pull");
    return '<div class="source-list-card sig-row" data-sig-row="' + esc(s.id) + '">' +
      '<div class="sig-row-top">' +
        '<div class="sig-main"><span class="source-list-name">' + esc(s.name || "Signal source") + '</span> ' +
        '<span class="sig-chip">' + esc(mech) + '</span>' +
        '<div class="source-list-meta" style="white-space:normal;margin-top:3px">' + meta + "</div></div>" +
        '<label class="sig-tgl" title="On: this source keeps finding new people every day. Off: it pauses. The campaign itself keeps sending either way.">' +
          '<input type="checkbox" data-sig-live="' + esc(s.id) + '"' + (live ? " checked" : "") + '><span class="sig-knob"></span>Live</label>' +
        (s.list_id ? '<a class="action-link" href="/app/lists.html#' + esc(s.list_id) + '">View list</a>' : "") +
        '<button type="button" class="action-link sig-primary" data-sig-pull="' + esc(s.id) + '">' +
          (s.last_pull ? "Find people again" : "Find people now") + "</button>" +
        '<button type="button" class="action-link" data-sig-more aria-label="More options">&#9662;</button>' +
      "</div>" +
      '<div class="sig-body" hidden>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
          '<a class="action-link" href="/app/unified.html#c:camp-sl-' + esc(c.id) + '">Edit targeting</a>' +
          '<button type="button" class="action-link" data-sig-dup="' + esc(s.id) + '">Duplicate</button>' +
        "</div>" +
        '<div class="sig-ice"><span class="source-list-meta">Icebreaker &middot; first line of the email</span>' +
          '<input type="text" data-sig-ice="' + esc(s.id) + '" value="' + esc(s.icebreaker || "") + '">' +
          '<button type="button" class="action-link" data-sig-ice-save="' + esc(s.id) + '">Save</button></div>' +
      "</div></div>";
  }
  function bindSigRows(c) {
    var root = document.querySelector('.campaign-page[data-cid="' + c.id + '"] #draft-sources-root');
    if (!root || root._sigBound) return;
    root._sigBound = true; // the container is re-created on every hydrate, so one binding per render
    root.addEventListener("click", function (ev) {
      var btn = ev.target.closest ? ev.target.closest("[data-sig-more],[data-sig-pull],[data-sig-dup],[data-sig-ice-save]") : null;
      if (!btn) return;
      var row = btn.closest("[data-sig-row]");
      if (btn.hasAttribute("data-sig-more")) {
        var body = row.querySelector(".sig-body");
        body.hidden = !body.hidden;
        btn.innerHTML = body.hidden ? "&#9662;" : "&#9652;";
        return;
      }
      if (btn.hasAttribute("data-sig-pull")) {
        var pid = btn.getAttribute("data-sig-pull");
        btn.disabled = true;
        btn.textContent = "Pulling…";
        sigPost("/api/sources/pull", { id: pid }).then(function (j) {
          sigToast(j && j.message ? j.message : "Pull finished — the numbers refresh in a moment");
          sigRehydrate(c);
        }).catch(function (e) {
          btn.disabled = false;
          btn.textContent = "Find people again";
          sigToast(e.message || "Couldn't pull — try again");
        });
        return;
      }
      if (btn.hasAttribute("data-sig-dup")) {
        btn.disabled = true;
        sigPost("/api/sources/duplicate", { id: btn.getAttribute("data-sig-dup") }).then(function () {
          sigToast("Source duplicated — same targeting, nothing pulled yet");
          sigRehydrate(c);
        }).catch(function (e) {
          btn.disabled = false;
          sigToast(e.message || "Couldn't duplicate — try again");
        });
        return;
      }
      if (btn.hasAttribute("data-sig-ice-save")) {
        var iid = btn.getAttribute("data-sig-ice-save");
        var inp = row.querySelector('[data-sig-ice="' + iid + '"]');
        btn.disabled = true;
        sigPost("/api/sources/update", { id: iid, icebreaker: inp.value }).then(function () {
          btn.disabled = false;
          sigToast("Icebreaker saved — used on this source's next pull");
        }).catch(function (e) {
          btn.disabled = false;
          sigToast(e.message || "Couldn't save the icebreaker");
        });
      }
    });
    root.addEventListener("change", function (ev) {
      var inp = ev.target;
      if (!inp.hasAttribute || !inp.hasAttribute("data-sig-live")) return;
      var on = inp.checked;
      inp.disabled = true;
      sigPost("/api/sources/update", { id: inp.getAttribute("data-sig-live"), active: on }).then(function () {
        inp.disabled = false;
        sigToast(on ? "Signal on — it keeps finding people in the background"
          : "Signal off — nothing pulls until you turn it back on");
      }).catch(function (e) {
        inp.checked = !on; // revert — the server didn't take it
        inp.disabled = false;
        sigToast(e.message || "Couldn't update the signal");
      });
    });
  }

  /* One Sources section: the honest empty line only when NOTHING renders -
     neither pool-backed cards nor push-history cards. */
  function maybeSourcesEmpty() {
    var d = document.getElementById("draft-sources-root");
    var s = document.getElementById("sources-root");
    var e = document.getElementById("sources-empty");
    if (!d || !s || !e) return;
    var any = d.querySelector(".source-list-card") || s.querySelector(".source-list-card") || s.querySelector(".lw-loading");
    e.innerHTML = any ? "" :
      '<p class="sources-empty">No sources recorded for this campaign in the app. Honest empty state: leads were added before push tracking, or directly in Smartlead.</p>';
  }

  function poolNoteHTML(pool) {
    var j = pool.active_job;
    if (j) {
      var st = { selecting: "Selecting the next batch…", sweeping: "Checking for people we shouldn't contact…",
                 verifying: "Verifying emails", uploading: "Adding verified people" }[j.stage] || "Working…";
      var pr = j.progress && j.progress.total ? " " + fmtInt(j.progress.done) + "/" + fmtInt(j.progress.total) : "";
      return st + pr;
    }
    var lb = pool.last_batch;
    if (lb) {
      if (!(lb.verify_failed || lb.live_dropped))
        return '<span style="color:#2F9E44">\u2713</span> Last add: all ' + fmtInt(lb.pushed) + " passed the checks";
      return "Last add: " + fmtInt(lb.pushed) + " verified added &middot; " + fmtInt(lb.verify_failed) +
             " failed verification &middot; " + fmtInt(lb.live_dropped) + " dropped as collisions";
    }
    return "";
  }

  function paintPoolCard(c, pool) {
    var card = document.querySelector('.campaign-page[data-cid="' + c.id + '"] [data-pool="' + pool.id + '"]');
    if (!card) return;
    card.querySelector("[data-pool-note]").innerHTML = poolNoteHTML(pool);
    var act = card.querySelector("[data-pool-act]");
    if (pool.active_job) {
      act.innerHTML = '<span class="source-list-meta">Working&hellip;</span>';
      poolCardPoll(c, pool.id);
      return;
    }
    act.innerHTML = '<button class="action-state-btn" style="background:#E8590C;color:#fff;border-color:transparent" data-pool-add>+ Add people</button>';
    act.querySelector("[data-pool-add]").onclick = function (e) {
      e.preventDefault();
      var btn = this;
      /* The click hands the strategist a ready-made Claude prompt (QA-gate
         "Copy chat prompt" pattern): the wizard runs IN CLAUDE - it confirms
         the amount and the credit spend, fires the same gated pull endpoint,
         and reports back. First prompt line = session title (house convention),
         with the campaign id glued to the name. */
      var prompt = "Pull more \u00b7 " + (c.name || ("campaign " + c.id)) + " (campaign " + c.id + ")\n\n" +
        "Run the pull-more wizard for source pool " + pool.id + " \u2014 campaign " + c.id + ". " +
        "Right now: " + fmtInt(pool.pulled_ok) + " pulled, " + fmtInt(pool.remaining) +
        " not yet pulled of " + fmtInt(pool.total_pool) + ". " +
        "Walk me through choosing how many to add (presets 500 / 1,000 / 2,000), tell me the estimated " +
        "email-verification credit spend BEFORE anything runs, then run the gated pull and report how many " +
        "were added, failed verification, or dropped as collisions. /pull-more-wizard";
      function toast(msg) {
        var t = document.getElementById("pool-toast");
        if (t) t.remove();
        t = document.createElement("div");
        t.id = "pool-toast";
        t.style.cssText = "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;" +
          "background:#141414;color:#fff;border-radius:12px;padding:12px 18px;font-size:0.9rem;" +
          "box-shadow:0 8px 28px rgba(0,0,0,.25);max-width:92vw;text-align:center";
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(function () { t.remove(); }, 6000);
      }
      function fallbackPopover() {
        var pop = document.createElement("div");
        pop.style.cssText = "position:absolute;z-index:30;background:#fff;border:1px solid var(--border-strong);" +
          "border-radius:12px;padding:14px;box-shadow:0 6px 24px rgba(0,0,0,.12);width:340px;max-width:92vw";
        pop.innerHTML = '<div class="source-list-name" style="display:block;margin-bottom:6px">Copy this, paste into Claude</div>' +
          '<textarea readonly style="width:100%;height:120px;font:12px/1.45 ui-monospace,monospace;border:1px solid var(--border-strong);border-radius:8px;padding:8px;resize:none;color:var(--fg-subtle)"></textarea>';
        pop.querySelector("textarea").value = prompt;
        var r = btn.getBoundingClientRect();
        pop.style.left = Math.max(10, r.right - 350) + "px";
        pop.style.top = (r.bottom + window.scrollY + 6) + "px";
        document.body.appendChild(pop);
        pop.querySelector("textarea").select();
        setTimeout(function () {
          document.addEventListener("click", function close(ev) {
            if (!pop.contains(ev.target) && ev.target !== btn) { pop.remove(); document.removeEventListener("click", close); }
          });
        }, 0);
      }
      var old = btn.textContent;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(prompt).then(function () {
          btn.textContent = "Copied \u2713";
          setTimeout(function () { btn.textContent = old; }, 2500);
          toast("Prompt copied \u2014 paste it into Claude. It confirms the amount and credit spend, then runs the checked pull.");
        }).catch(fallbackPopover);
      } else {
        fallbackPopover();
      }
    };
  }

  function paintPoolCardIdleBtn(c, pool) {
    pool.active_job = null;
    paintPoolCard(c, pool);
  }

  function poolCardPoll(c, poolId) {
    setTimeout(function () {
      getJSON("/api/pool-pulls").then(function (d) {
        var pool = ((d && d.pools) || []).find(function (p) { return p.id === poolId; });
        var card = document.querySelector('.campaign-page[data-cid="' + c.id + '"] [data-pool="' + poolId + '"]');
        if (!pool || !card) return;
        card.querySelector("[data-pool-note]").innerHTML = poolNoteHTML(pool);
        var metas = card.querySelectorAll(".source-list-meta");
        if (!pool.active_job) {
          metas[0].innerHTML = fmtInt(pool.pulled_ok) + " pulled &middot; " + fmtInt(pool.remaining) +
            " not yet pulled of " + fmtInt(pool.total_pool) +
            ' &middot; <a class="action-link" href="/app/lists.html#' + esc(pool.list_id) + '">View the list</a>';
          paintPoolCard(c, pool);
          return;
        }
        poolCardPoll(c, poolId);
      }).catch(function () { poolCardPoll(c, poolId); });
    }, 4000);
  }

  function hydrateDetail(c) {
    var id = c.id;
    var apply = function (d) {
      if (!d || d.degraded) return;
      /* receipts */
      var rc = document.getElementById("receipts-card");
      var rl = document.getElementById("receipts-list");
      if (rc && rl && (d.receipts || []).length) {
        rl.innerHTML = d.receipts.map(function (r) {
          var dd = r.replied_at ? new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short" }).format(new Date(r.replied_at)) : "";
          return '<div class="receipt"><span class="receipt-date">' + esc(dd) + " &middot; " + esc(r.category || "") + '</span><span class="receipt-quote">"' + esc(r.snippet || "") + '"</span></div>';
        }).join("");
        rc.hidden = false;
      }
      /* overview glance: audience panel (from the campaign-detail payload) */
      var ov = document.getElementById("ovm-status");
      if (ov && !((d.leads || {}).total)) {
        ov.innerHTML = '<p class="card-subtitle">No contact-record rows for this campaign yet' +
          (c.stats.leads != null ? " &mdash; Smartlead itself holds " + fmtInt(c.stats.leads) + " leads" : "") +
          ". The Leads tab shows the live platform audience.</p>";
      } else if (ov) {
        /* Audience split into the three states Bjion wants at a glance —
           completed (full green), in progress (faded green), not started (grey);
           STARTED/INPROGRESS/PAUSED all read as in-progress. Blocked is a real
           bad state, so when present it shows as a distinct red segment rather
           than being folded into "not started". Not-started = the platform
           audience (or contact record) minus everyone with a known status. */
        var aBy = {}; (d.lead_statuses || []).forEach(function (s) { aBy[s.k] = (aBy[s.k] || 0) + (s.n || 0); });
        var aDone = aBy.COMPLETED || 0;
        var aProg = (aBy.INPROGRESS || 0) + (aBy.STARTED || 0) + (aBy.PAUSED || 0);
        var aBlk = aBy.BLOCKED || 0;
        var aAcc = aDone + aProg + aBlk;
        var aSeqd = (d.leads || {}).total || aAcc;
        var aPlat = c.stats.leads;
        var aBase = Math.max(aAcc, aSeqd, aPlat != null ? aPlat : 0);
        var aNot = Math.max(0, aBase - aAcc);
        var aTot = aBase;
        var A_DONE = "#2E7D5B", A_PROG = "#A7CDB8", A_NOT = "#D9D6D1", A_BLK = "var(--danger)";
        var aPc = function (n) { return aTot ? (100 * n / aTot).toFixed(1) : "0"; };
        var aSeg = function (n, col) { return n > 0 ? '<i style="width:' + aPc(n) + "%;background:" + col + '"></i>' : ""; };
        var aLeg = function (n, col, lab) { return n > 0 ? '<span><i style="background:' + col + '"></i>' + lab + ' <b class="tnum">' + fmtInt(n) + "</b></span>" : ""; };
        var aCompPct = aTot ? Math.round(100 * aDone / aTot) : 0;
        ov.innerHTML = '<div class="gv-audh"><span>Who we\'re working &mdash; <b class="tnum">' + fmtInt(aTot) + '</b> people</span><span><b class="tnum">' + aCompPct + '%</b> completed</span></div>' +
          '<div class="gv-stack">' + aSeg(aDone, A_DONE) + aSeg(aProg, A_PROG) + aSeg(aNot, A_NOT) + aSeg(aBlk, A_BLK) + "</div>" +
          '<div class="gv-legend">' + aLeg(aDone, A_DONE, "Completed") + aLeg(aProg, A_PROG, "In progress") + aLeg(aNot, A_NOT, "Not started") + aLeg(aBlk, A_BLK, "Blocked") + "</div>";
      }
      /* sources */
      var sr = document.getElementById("sources-root");
      if (sr) {
        var srcs = d.sources || [];
        if (!srcs.length) {

        } else {
          sr.innerHTML = '<div class="source-list-cards">' + srcs.map(function (s) {
            var dd = s.at ? new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short" }).format(new Date(s.at)) : "";
            /* V1 pushed-state (glance-lab ruling): name + meta stacked left,
               View-the-list pill right; no bar when there is no pool. */
            return '<div class="source-list-card" style="display:flex;align-items:center;justify-content:space-between;gap:12px">' +
              '<div style="min-width:0"><span class="source-list-name" style="display:block">' + esc(s.list_name || "List") + "</span>" +
              '<span class="source-list-meta"><b style="color:var(--fg)">' + fmtInt(s.rows) + "</b> people &middot; pushed to " +
              esc(s.platform ? s.platform.charAt(0).toUpperCase() + s.platform.slice(1) : "Smartlead") + " &middot; " + esc(dd) + "</span></div>" +
              (s.list_id ? '<a class="action-link" style="flex:0 0 auto" href="/app/lists.html#' + esc(s.list_id) + '">View the list</a>' : "") +

      /* sequence rail */
      var seqr = document.getElementById("sequence-root");
      if (seqr) {
        var seq = d.sequence;
        if (!seq || !seq.step_count) {
          seqr.innerHTML = '<p class="card-subtitle">No sequence structure captured yet for this campaign.</p>';
        } else {
          var parts = [];

            var delay = (seq.step_delays || [])[i];
            if (i < seq.step_count) parts.push('<div class="seq-connector">Wait ' + (delay != null ? delay : "?") + " day" + (delay === 1 ? "" : "s") + "</div>");
          }
          seqr.innerHTML = '<p class="card-subtitle">' + seq.step_count + " email step" + (seq.step_count === 1 ? "" : "s") +
            (seq.threading_mode ? " &middot; " + esc(seq.threading_mode) : "") +
            " &middot; structure captured " + esc(localStamp(seq.captured_at)) + '.</p><div class="seq-rail">' + parts.join("") + "</div>";
        }
      }
    };
    if (STATE.detail[id]) { apply(STATE.detail[id]); return; }
    var fetchIt = function (isRetry) {
      getJSON("/api/cockpit/campaign-detail?id=" + encodeURIComponent(id)).then(function (d) {
        /* a degraded payload (mid-deploy, DB blip) must not stick for the
           SPA's lifetime — render it, but refetch next visit + retry once */
        if (d && !d.degraded) STATE.detail[id] = d;

        apply(d);
      }).catch(function () {

  function hydrateMessaging(c) {
    var id = c.id;

      var root = document.getElementById("messaging-root");
      if (!root) return;
      if (!m || m.degraded || !(m.versions || []).length) {
        /* honest fallback: daily mirror */
        var fb = (STATE.detail[id] || {}).versions || [];
        if (fb.length) {
          root.innerHTML = versionTableHTML(fb.map(function (v) {
            return { step: v.step, label: v.label, sent: v.sent, replies: v.replies, positives: v.positives };
          }), "Smartlead is unreachable right now; this table is the daily platform mirror (snapshot " + esc(fb[0].snapshot || "") + ").");
        } else {
          root.innerHTML = '<p class="card-subtitle">No version stats available: Smartlead is unreachable and no daily mirror exists for this campaign yet.</p>';
        }
        return;
      }
      root.innerHTML = versionTableHTML(m.versions, m.note, m.meetings);
    };
    if (STATE.messaging[id]) { apply(STATE.messaging[id]); return; }
    var fetchIt = function (isRetry) {
      getJSON("/api/cockpit/messaging?id=" + encodeURIComponent(id)).then(function (m) {
        var healthy = m && !m.degraded && (m.versions || []).length;
        /* only a HEALTHY payload may stick for the SPA's lifetime — caching a
           mid-deploy failure was how the tab stayed empty until a hard reload */
        if (healthy) STATE.messaging[id] = m;
        else if (!isRetry) setTimeout(function () { if (!STATE.messaging[id]) fetchIt(true); }, 7000);
        apply(m);
      }).catch(function () {
        if (!isRetry) setTimeout(function () { if (!STATE.messaging[id]) fetchIt(true); }, 7000);
        apply(null);
      });
    };
    fetchIt(false);
  }

  function resolveSpin(text) {
    /* {a|b|c} -> a, innermost-first until stable, so the copy reads like the
       email a lead receives. {{merge_tags}} have no pipe and never match. */
    var t = text || "", prev;
    do {
      prev = t;
      t = t.replace(/\{([^{}|]*(?:\|[^{}]*)+)\}/g, function (_, opts) { return opts.split("|")[0]; });
    } while (t !== prev);
    return t;
  }

  function seqRichText(text) {
    /* escape, then mark {{merge_tags}} / %signature% / spintax-date tags,
       then paragraphs: blank line = new <p>, single break = <br> */
    var marked = esc(text || "").replace(/\{\{[^}]+\}\}|%signature%/g, function (m) {
      return '<span class="mergetag">' + m + "</span>";
    });
    return marked.split(/\n\s*\n/).map(function (para) {
      return "<p>" + para.replace(/\n/g, "<br>") + "</p>";
    }).join("");
  }

  function sequenceCopyHTML(sc) {
    var steps = sc.steps || [];
    var parts = [];
    steps.forEach(function (s, si) {
      var stepNo = s.step != null ? s.step : "?";
      var variants = s.variants || [];
      var pills = "";
      if (variants.length > 1) {
        pills = '<div class="seq-version-pills" aria-label="Email ' + esc(stepNo) + ' versions">' +
          variants.map(function (v, vi) {
            return '<button type="button" class="seq-pill' + (vi === 0 ? " is-active" : "") + '" data-step="' + esc(stepNo) + '" data-version="' + esc(v.label || "?") + '" aria-pressed="' + (vi === 0 ? "true" : "false") + '">' + esc(v.label || "?") + "</button>";
          }).join("") + "</div>";
      }
      var panels = variants.map(function (v, vi) {
        var subj = v.subject
          ? '<span class="seq-subject-text">' + seqRichText(resolveSpin(v.subject)) .replace(/^<p>|<\/p>$/g, "") + "</span>"
          : '<span class="seq-subject-text seq-subject-none">(no subject, reply in thread)</span>';
        return '<div class="seq-version-panel" data-step="' + esc(stepNo) + '" data-version="' + esc(v.label || "?") + '"' + (vi === 0 ? "" : " hidden") + ">" +
          '<p class="seq-subject"><strong>Subject:</strong> ' + subj + "</p>" +
          '<div class="seq-body-scroll">' + seqRichText(resolveSpin(v.body)) + "</div></div>";
      }).join("");
      parts.push('<div class="seq-step"><div class="seq-step-header"><span class="seq-step-title">Email ' + esc(stepNo) + "</span>" + pills + "</div>" +
        '<div class="seq-body">' + panels + "</div></div>");
      var next = steps[si + 1];
      if (next && next.delay_days != null)
        parts.push('<div class="seq-connector">Wait ' + esc(next.delay_days) + " day" + (next.delay_days === 1 ? "" : "s") + "</div>");
    });
    return '<p class="card-subtitle">Read-only mirror of what\'s live in Smartlead: steps, wait gaps, subjects and bodies. Click a version pill to see its copy. Spun lines are shown as one clean rendering.</p>' +
      '<div class="seq-rail">' + parts.join("") + "</div>";
  }

  function hydrateSequenceCopy(c) {
    var id = c.id;
    var apply = function (sc) {
      var root = document.getElementById("sequence-root");
      if (!root || !sc || sc.degraded || !(sc.steps || []).length) return; /* structure rail stays as the honest fallback */
      root.innerHTML = sequenceCopyHTML(sc);
      /* version pills swap the shown subject+body within their step */
      root.querySelectorAll(".seq-pill").forEach(function (pill) {
        pill.addEventListener("click", function () {
          var step = pill.closest(".seq-step");
          if (!step) return;
          var version = pill.getAttribute("data-version");
          step.querySelectorAll(".seq-pill").forEach(function (p) {
            var on = p === pill;
            p.classList.toggle("is-active", on);
            p.setAttribute("aria-pressed", on ? "true" : "false");
          });
          step.querySelectorAll(".seq-version-panel").forEach(function (panel) {
            panel.hidden = panel.getAttribute("data-version") !== version;
          });
        });
      });
    };
    if (STATE.seqcopy[id]) { apply(STATE.seqcopy[id]); return; }
    var fetchIt = function (isRetry) {
      getJSON("/api/cockpit/sequence-copy?id=" + encodeURIComponent(id)).then(function (sc) {
        var healthy = sc && !sc.degraded && (sc.steps || []).length;
        if (healthy) STATE.seqcopy[id] = sc;
        else if (!isRetry) setTimeout(function () { if (!STATE.seqcopy[id]) fetchIt(true); }, 7000);
        apply(sc);
      }).catch(function () {
        if (!isRetry) setTimeout(function () { if (!STATE.seqcopy[id]) fetchIt(true); }, 7000);
      });
    };
    fetchIt(false);
  }

  function versionTableHTML(versions, note, meetings) {
    /* meetings land on the email STEP, never the version (Smartlead cannot
       attribute a booking to a variant) — so the count renders once, on the
       step's first row, and other rows of that step show a dot. */
    var hasMeet = !!(meetings && meetings.by_step);
    function rateSpan(n, d) { return (d && n) ? ' <span class="ring-caption">' + (n / d * 100).toFixed(1) + '%</span>' : ''; }
    function perPos(v) { return (v.positives > 0 && v.sent) ? fmtInt(Math.round(v.sent / v.positives)) : '<span class="ring-caption">' + (v.sent < 300 ? 'early' : '—') + '</span>'; }
    /* group by email step: each step is a band header carrying the step-level
       meetings (a booking sits on the step, not a single variant — per-variant
       attribution arrives with the per-lead trace), then its variants below,
       alphabetical, disabled ones flagged "off". */
    var byStep = {};
    versions.forEach(function (v) { var k = v.step != null ? String(v.step) : '?'; (byStep[k] = byStep[k] || []).push(v); });
    var stepKeys = Object.keys(byStep).sort(function (a, b) { return (parseInt(a, 10) || 0) - (parseInt(b, 10) || 0); });
    /* best opener: Email-1, active, with positives, fewest sends per positive */
    var best = null;
    (byStep['1'] || []).forEach(function (v) {
      if (v.disabled || v.inline || !(v.positives > 0) || !v.sent) return;
      var pp = v.sent / v.positives;
      if (best === null || pp < best.pp) best = { label: v.label, pp: pp };
    });
    var rows = stepKeys.map(function (sk) {
      var vs = byStep[sk].slice().sort(function (a, b) { return String(a.label || '~').localeCompare(String(b.label || '~')); });
      var stepSent = vs.reduce(function (s, v) { return s + (v.sent || 0); }, 0);
      var stepMeet = hasMeet ? (meetings.by_step[sk] || 0) : null;
      var perMeet = (stepMeet && stepSent) ? fmtInt(Math.round(stepSent / stepMeet)) : (stepMeet != null ? '—' : '');
      var band = '<tr class="vp-band"><td class="vp-l" colspan="5">Email ' + esc(sk) +
        ' <span class="ring-caption">' + vs.length + ' variant' + (vs.length === 1 ? '' : 's') + '</span></td>' +
        '<td class="tnum" data-label="Meetings">' + (stepMeet != null ? fmtInt(stepMeet) : '') + '</td>' +
        '<td class="tnum" data-label="Sent / meeting">' + perMeet + '</td></tr>';
      var body = vs.map(function (v) {
        var label = v.inline ? 'inline' : (v.label || '?');
        var isBest = best && sk === '1' && !v.disabled && !v.inline && v.label === best.label;
        return '<tr>' +
          '<td data-label="Version">' + esc(label) +
            (v.disabled ? ' <span class="ring-caption">off</span>' : '') +
            (isBest ? ' <span class="vp-best">best</span>' : '') + '</td>' +
          '<td class="tnum" data-label="Sent">' + fmtInt(v.sent) + '</td>' +
          '<td class="tnum" data-label="Replies">' + fmtInt(v.replies) + rateSpan(v.replies, v.sent) + '</td>' +
          '<td class="tnum" data-label="Positives">' + fmtInt(v.positives) + rateSpan(v.positives, v.sent) + '</td>' +
          '<td class="tnum" data-label="Sent / positive">' + perPos(v) + '</td>' +
          '<td class="tnum" data-label="Meetings"></td>' +
          '<td class="tnum" data-label="Sent / meeting"></td></tr>';
      }).join('');
      return band + body;
    }).join('');
    var meetNote = '';
    if (hasMeet) {
      meetNote = fmtInt(meetings.total || 0) + ' meeting' + (meetings.total === 1 ? '' : 's') + " on this campaign — one per person. Meetings sit on the email step, not a single variant: Smartlead doesn't record which variant a booked lead was sent, so a booking can't be tied to one.";
      if (meetings.unattributed > 0) meetNote += ' ' + fmtInt(meetings.unattributed) + ' not tied to a step yet.';
    }
    return '<div class="leads-table-wrap"><table class="leads-table version-perf-table">' +
      '<thead><tr><th>Version</th><th class="tnum">Sent</th><th class="tnum">Replies</th><th class="tnum">Positives</th><th class="tnum">Sent / positive</th><th class="tnum">Meetings</th><th class="tnum">Sent / meeting</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>' +
      (meetNote ? '<p class="sample-footer">' + esc(meetNote) + '</p>' : '') +
      (note ? '<p class="sample-footer">' + esc(note) + '</p>' : '');
  }

  var CLG = null; /* grid state for the open campaign page */

  function clgVal(l, k) {
    if (k === "replied") return l.replied ? "Yes" : "";

          '<span class="thlbl">' + esc(c.lbl) + "</span>" +
          '<span class="sortarrow">' + (CLG.sort === c.k && CLG.dir === "desc" ? clgSvg.caretDown : clgSvg.caretUp) + "</span>" +
          '<button class="filt-btn' + (CLG.filters[c.k] ? " active" : "") + '" title="Filter" data-filtcol="' + esc(c.k) + '">' + clgSvg.filt + "</button>" +
          "</div></th>";
      }).join("") + "</tr></thead>";
    var coh = CLG.mode === "repliers";
    var tbody = "<tbody>" + slice.map(function (l, i) {

        '<td class="gutter">' + fmtInt(start + i) + "</td>" +
        visCols.map(function (c) {

    var grand = coh ? (CLG.cohortTotal != null ? CLG.cohortTotal : base)
                    : (CLG.total != null ? CLG.total : CLG.rows.length);

      '<button class="btn sm clg-quick' + (coh ? " on" : "") + '" id="clg-repliers" title="Everyone who replied, across the whole campaign">' +
      (CLG.cohortLoading ? "Checking&hellip;" : "Repliers" + (CLG.cohortTotal != null ? ' <span class="tnum">(' + fmtInt(CLG.cohortTotal) + ")</span>" : "")) + "</button>" +
      '<div class="filterbar">' + chips + "</div>" +
