<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10 Tools · Carousel</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  /* ========== PRINT: only the slides, one per page ========== */
  @page { size: 1080px 1350px; margin: 0; }
  @media print {
    @page { size: 1080px 1350px; margin: 0; }
    html, body {
      background: #ffffff !important;
      overflow: visible !important;
      height: auto !important; width: auto !important;
      margin: 0 !important; padding: 0 !important;
    }
    body * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    *, *::before, *::after {
      animation-delay: -99s !important; animation-duration: .001s !important;
      animation-iteration-count: 1 !important; animation-fill-mode: both !important;
      animation-play-state: running !important; transition-duration: 0s !important;
    }
    #prev, #next, .dots, .nav { display: none !important; }
    #stage { position: static !important; inset: auto !important; display: block !important; }
    #frame {
      width: 1080px !important; height: auto !important;
      transform: none !important; overflow: visible !important;
      border-radius: 0 !important; box-shadow: none !important; margin: 0 !important;
    }
    #track {
      display: block !important; height: auto !important;
      transform: none !important; transition: none !important; width: 1080px !important;
    }
    .slide {
      width: 1080px !important; height: 1350px !important; flex: none !important;
      break-inside: avoid !important; page-break-inside: avoid !important;
      break-after: page !important; page-break-after: always !important;
      overflow: hidden !important;
    }
    .slide:last-child { break-after: auto !important; page-break-after: auto !important; }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #17120f;
    font-family: var(--font-sans);
    overflow: hidden;
  }

  /* ---- stage / scaling ---- */
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #frame {
    width: 1080px; height: 1350px;
    transform-origin: center center;
    overflow: hidden;
    border-radius: 8px;
    box-shadow: 0 40px 120px -30px rgba(0,0,0,0.6);
    position: relative;
  }
  #track {
    display: flex; height: 100%;
    transition: transform 480ms cubic-bezier(0.2,0.7,0.2,1);
    will-change: transform;
  }
  .slide {
    width: 1080px; height: 1350px; flex: none;
    position: relative;
  }

  /* ---- shared slide chrome ---- */
  .tool {
    background: var(--nav-cream);
    color: var(--nav-ink);
    padding: 84px 80px 64px;
    display: flex; flex-direction: column; height: 100%;
  }
  .row-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
  .cat {
    font-family: var(--font-mono);
    font-size: 24px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--nav-ink-3);
    font-weight: 500;
    padding-top: 8px;
  }
  .badge {
    font-family: var(--font-mono);
    font-size: 28px;
    font-weight: 500;
    color: var(--nav-ink);
    border: 2px solid var(--nav-ink);
    border-radius: 8px;
    padding: 8px 18px;
    box-shadow: 4px 4px 0 rgba(20,17,14,0.14);
    flex: none;
  }
  .name {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 104px;
    line-height: 0.98;
    letter-spacing: -0.03em;
    margin: 40px 0 0;
  }
  .tag {
    font-family: var(--font-mono);
    font-style: italic;
    font-size: 30px;
    color: var(--nav-ink-2);
    margin: 22px 0 0;
  }
  image-slot.thumb {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 2862 / 1340;
    margin: 48px 0 0;
    background: transparent;
    border: 0;
  }
  .logo-mark {
    width: 96px; height: 96px;
    border-radius: 18px;
    object-fit: contain;
    background: var(--nav-cream-50);
    border: 1px solid var(--border);
    display: block;
    margin-bottom: 28px;
  }
  .desc {
    font-size: 36px;
    line-height: 1.42;
    letter-spacing: -0.015em;
    color: var(--nav-ink-2);
    margin: 44px 0 0;
    max-width: none;
    text-wrap: pretty;
  }
  .foot {
    margin-top: auto;
    padding-top: 40px;
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid var(--divider);
  }
  .foot .brand { display: flex; align-items: center; gap: 16px; }
  .foot .brand img { height: 26px; width: auto; display: block; }
  .foot .brand span {
    font-family: var(--font-mono); font-size: 20px;
    color: var(--nav-ink-3); letter-spacing: 0.02em;
  }
  .foot .count {
    font-family: var(--font-mono); font-size: 22px;
    color: var(--nav-ink-3); letter-spacing: 0.06em;
  }

  /* ---- outro slides ---- */
  .outro {
    padding: 84px 80px 64px;
    display: flex; flex-direction: column; height: 100%;
    position: relative; overflow: hidden;
  }
  .outro.cream { background: var(--nav-cream); color: var(--nav-ink); }
  .outro.ink   { background: var(--nav-ink);   color: var(--nav-cream); }
  .outro .eyebrow {
    font-family: var(--font-mono);
    font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase;
    font-weight: 500; display: inline-flex; align-items: center; gap: 14px;
  }
  .outro.cream .eyebrow { color: var(--nav-ink-3); }
  .outro.ink   .eyebrow { color: rgba(249,240,231,0.6); }
  .outro .eyebrow::before {
    content: ""; width: 10px; height: 10px; border-radius: 999px;
    background: var(--nav-orange);
  }
  .outro h2 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 104px;
    line-height: 0.98;
    letter-spacing: -0.035em;
    margin: 36px 0 0;
    text-wrap: balance;
  }
  .outro h2 em { font-style: italic; color: var(--nav-orange); }
  .outro .lede {
    font-size: 32px; line-height: 1.4; letter-spacing: -0.015em;
    margin: 44px 0 0; max-width: 22ch; text-wrap: pretty;
  }
  .outro.cream .lede { color: var(--nav-ink-2); }
  .outro.ink   .lede { color: rgba(249,240,231,0.78); }

  /* radial accent on cream slides */
  .outro.cream::after {
    content: "";
    position: absolute; left: -260px; bottom: -260px;
    width: 720px; height: 720px; border-radius: 999px;
    background: radial-gradient(circle at 60% 40%, rgba(255,77,0,0.16), transparent 64%);
    pointer-events: none; z-index: 0;
  }
  .outro > * { position: relative; z-index: 1; }

  /* stats */
  .stats {
    display: grid; grid-template-columns: 1fr; gap: 36px;
    margin-top: 80px;
  }
  .stat {
    display: flex; flex-direction: column; gap: 8px;
    border-top: 1px solid rgba(249,240,231,0.18);
    padding-top: 22px;
  }
  .outro.cream .stat { border-top-color: rgba(20,17,14,0.16); }
  .stat .num {
    font-family: var(--font-display);
    font-weight: 400; font-size: 112px; line-height: 0.95;
    letter-spacing: -0.04em;
  }
  .stat .num.accent { color: var(--nav-orange); }
  .stat .lab {
    font-size: 26px; letter-spacing: -0.01em;
  }
  .outro.cream .stat .lab { color: var(--nav-ink-2); }
  .outro.ink   .stat .lab { color: rgba(249,240,231,0.7); }

  /* CTA slide */
  .cta-mega {
    margin-top: 56px;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 156px;
    line-height: 0.92;
    letter-spacing: -0.04em;
    text-wrap: balance;
  }
  .cta-mega em { font-style: italic; color: var(--nav-orange); }
  .cta-pill {
    margin-top: auto;
    display: inline-flex; align-items: center; gap: 22px;
    align-self: flex-start;
    padding: 26px 36px 26px 42px;
    background: var(--nav-orange);
    color: var(--nav-cream);
    border-radius: 999px;
    font-size: 40px; font-weight: 500; letter-spacing: -0.01em;
    font-family: var(--font-sans);
    text-decoration: none;
  }
  .cta-pill .arrow {
    width: 44px; height: 44px; border-radius: 999px;
    background: var(--nav-cream); color: var(--nav-orange);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 500;
  }
  .cta-prompt {
    margin-top: 56px;
    font-family: var(--font-mono);
    font-size: 28px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(249,240,231,0.55);
    font-weight: 500;
  }
  .cta-url-big {
    margin-top: 14px;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 88px;
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--nav-orange);
    word-break: break-word;
  }
  .cta-url {
    margin-top: 28px; font-family: var(--font-mono);
    font-size: 22px; letter-spacing: 0.02em;
  }
  .outro.ink .cta-url { color: rgba(249,240,231,0.55); }

  /* outro foot — borrows the same row */
  .outro .foot {
    margin-top: auto; padding-top: 40px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .outro.cream .foot { border-top: 1px solid var(--divider); }
  .outro.ink   .foot { border-top: 1px solid rgba(249,240,231,0.18); }
  .outro .foot .brand { display: flex; align-items: center; gap: 16px; }
  .outro .foot .brand img { height: 26px; width: auto; display: block; }
  .outro .foot .brand span {
    font-family: var(--font-mono); font-size: 20px; letter-spacing: 0.02em;
  }
  .outro.cream .foot .brand span { color: var(--nav-ink-3); }
  .outro.ink   .foot .brand span { color: rgba(249,240,231,0.5); }
  .outro .foot .count {
    font-family: var(--font-mono); font-size: 22px; letter-spacing: 0.06em;
  }
  .outro.cream .foot .count { color: var(--nav-ink-3); }
  .outro.ink   .foot .count { color: rgba(249,240,231,0.5); }

  /* ---- cover ---- */
  .cover {
    background: var(--nav-cream);
    color: var(--nav-ink);
    padding: 80px 80px 64px;
    display: flex; flex-direction: column; height: 100%;
    position: relative;
    overflow: hidden;
  }
  .cover::after {
    content: "";
    position: absolute; right: -200px; top: -200px;
    width: 640px; height: 640px; border-radius: 999px;
    background: radial-gradient(circle at 30% 30%, rgba(255,77,0,0.16), transparent 64%);
    pointer-events: none; z-index: 0;
  }
  .cc-badge {
    align-self: flex-end;
    width: 192px; height: 192px;
    position: relative; z-index: 2;
    transform: rotate(12deg);
    transform-origin: center;
    margin-right: 8px;
  }
  .cc-badge img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .cover .kicker {
    font-family: var(--font-mono);
    font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--nav-ink-3);
    margin: 40px 0 0;
    position: relative; z-index: 2;
  }
  .cover h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 136px;
    line-height: 0.96;
    letter-spacing: -0.035em;
    margin: 32px 0 0;
    position: relative; z-index: 2;
    text-wrap: balance;
  }
  .cover h1 em {
    font-style: normal;
    color: var(--nav-orange);
  }
  /* teaser — small "featured tools" logo strip, anchored to the bottom */
  .teaser-label {
    font-family: var(--font-mono);
    font-size: 22px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--nav-ink-3);
    margin: auto 0 0;
    position: relative; z-index: 2;
  }
  .cover .foot { margin-top: 22px; }
  .teaser {
    display: flex; flex-wrap: nowrap;
    gap: 14px;
    margin: 22px 0 0;
    position: relative; z-index: 2;
  }
  .teaser image-slot {
    display: block; width: 78px; height: 78px; flex: none;
    border: 1px solid var(--border);
    background: var(--nav-light-brown);
  }
  .cover .foot { border-top: 1px solid var(--divider); }
  .cover .foot .brand img { height: 28px; }
  .cover .foot .brand span,
  .cover .foot .count { color: var(--nav-ink-3); }

  /* ---- controls (outside scaled frame) ---- */
  .nav {
    position: fixed; top: 50%; transform: translateY(-50%);
    width: 64px; height: 64px; border-radius: 999px;
    background: rgba(249,240,231,0.1);
    border: 1px solid rgba(249,240,231,0.2);
    color: var(--nav-cream);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 50;
    backdrop-filter: blur(8px);
    transition: background 160ms, opacity 160ms;
    -webkit-tap-highlight-color: transparent;
  }
  .nav:hover { background: rgba(249,240,231,0.2); }
  .nav svg { width: 26px; height: 26px; }
  #prev { left: 28px; }
  #next { right: 28px; }
  .nav[disabled] { opacity: 0.25; pointer-events: none; }

  .dots {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 50;
    padding: 10px 16px; border-radius: 999px;
    background: rgba(23,18,15,0.5); backdrop-filter: blur(8px);
  }
  .dot {
    width: 9px; height: 9px; border-radius: 999px;
    background: rgba(249,240,231,0.3);
    cursor: pointer; transition: background 160ms, transform 160ms;
  }
  .dot.active { background: var(--nav-orange); transform: scale(1.25); }

  @media (max-width: 700px) {
    .nav { width: 48px; height: 48px; }
    #prev { left: 10px; } #next { right: 10px; }
  }
</style>
</head>
<body>
  <div id="stage"><div id="frame"><div id="track"></div></div></div>

  <button id="prev" class="nav" aria-label="Previous">
    <svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button id="next" class="nav" aria-label="Next">
    <svg viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="dots" id="dots"></div>

  <script src="carousel/image-slot.js"></script>
  <script>
    const TOOLS = [
      { n:'01', cat:'Total Addressable Market', name:'AI-ARK',        logo:'AI Ark', tag:'map your TAM from an ICP', desc:'AI-ARK is an alternative to Apollo. In Claude we hand it an ICP, and then it maps out the total addressable market. The way it works is that it converts your instructions into filters, and then it fires it to AI-ARK.' },
      { n:'02', cat:'Sales Signals',           name:'Prospeo',        tag:'ideate campaigns off sales signals', desc:'Prospeo has some pretty amazing filters based on sales signals, for example which companies had a CTO who recently departed. Each week we use Claude Code to ideate new campaign ideas using these Prospeo filters.' },
      { n:'03', cat:'Hiring Signals',          name:'TheirStack',     tag:'evergreen campaigns around hiring', desc:'We use TheirStack to create evergreen campaigns around hiring. Claude is used to ideate which jobs are worth tracking, as well as the qualifying of each prospect we find at the companies who are hiring.' },
      { n:'04', cat:'Outreach & Optimization', name:'Smartlead',      tag:'daily campaign optimization reports', desc:'Smartlead sends the outreach and feeds Claude a daily optimization report. Instead of digging through every campaign\u2019s analytics, you get a short list: replace this, swap that. You approve it, then action it.' },
      { n:'05', cat:'Email Verification',      name:'MillionVerifier',tag:'verify in-flight, kill bounces', desc:'Claude runs daily deliverability audits and verifies emails before they send. If a campaign starts bouncing, it pauses the campaign, verifies the unverified addresses, auto-removes the bad ones, and carries on without you having to export, verify, and re-import.' },
    ];

    const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
    const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
    const asset = t => encodeURI(t.logo || t.name); // logo files may be named differently than the tool

    const track = document.getElementById('track');
    const total = TOOLS.length;

    // cover
    const cover = document.createElement('div');
    cover.className = 'slide';
    cover.innerHTML = `
      <div class="cover">
        <div class="cc-badge"><img src="assets/claude-code-mascot.png" alt="Claude Code"></div>
        <div class="kicker">A go-to-market field guide</div>
        <h1>5 tools we run <em>inside Claude Code.</em></h1>
        <div class="teaser-label">Featured inside</div>
        <div class="teaser">
          ${TOOLS.map(t => `<image-slot id="teaser-${slug(t.name)}" shape="rounded" radius="16"
              src="assets/tools/logo/${asset(t)}.png" fit="cover"
              placeholder="${esc(t.name)}"></image-slot>`).join('')}
        </div>
        <div class="foot">
          <div class="brand"><img src="assets/logo-navreo.png" alt="navreo"><span>· swipe to explore</span></div>
          <div class="count">5 tools</div>
        </div>
      </div>`;
    track.appendChild(cover);

    // tool slides
    TOOLS.forEach((t, i) => {
      const s = document.createElement('div');
      s.className = 'slide';
      s.innerHTML = `
        <div class="tool">
          <image-slot class="logo-mark" id="logo-${slug(t.name)}" shape="rounded" radius="18"
            src="assets/tools/logo/${asset(t)}.png" fit="contain" position="50% 50%"
            placeholder="${esc(t.name)}"></image-slot>
          <div class="row-top">
            <div class="cat">${esc(t.cat)}</div>
            <div class="badge">${t.n}</div>
          </div>
          <h2 class="name">${esc(t.name)}</h2>
          <div class="tag">${esc(t.tag)}</div>
          <image-slot class="thumb" id="thumb-${slug(t.name)}" shape="rounded" radius="18"
            src="assets/tools/${asset(t)}.png" fit="contain" position="50% 50%"
            placeholder="Drop a ${esc(t.name)} screenshot"></image-slot>
          <p class="desc">${esc(t.desc)}</p>
          <div class="foot">
            <div class="brand"><img src="assets/logo-navreo.png" alt="navreo"></div>
          </div>
        </div>`;
      track.appendChild(s);
    });

    // outro slides
    const outros = [
      `<div class="slide"><div class="outro cream">
        <div class="eyebrow">Who we are</div>
        <h2>Go-to-market systems that scale your revenue, <em>not your headcount.</em></h2>
        <p class="lede">Navreo builds outbound, content, and intent systems for B2B teams. Your pipeline runs on a system, not on referrals.</p>
        <div class="foot">
          <div class="brand"><img src="assets/logo-navreo.png" alt="navreo"><span>· navreo.ai</span></div>
          <div class="count">Wrap-up</div>
        </div>
      </div></div>`,

      `<div class="slide"><div class="outro ink">
        <div class="eyebrow">How we help</div>
        <h2>Built once. <em>Compounds for years.</em></h2>
        <div class="stats">
          <div class="stat"><div class="num accent">$15m+</div><div class="lab">Sales pipeline generated last year</div></div>
          <div class="stat"><div class="num">1,500+</div><div class="lab">Hours saved for clients monthly</div></div>
          <div class="stat"><div class="num">50+</div><div class="lab">B2B teams and businesses coached</div></div>
        </div>
        <div class="foot">
          <div class="brand"><img src="assets/logo-navreo-white.png" alt="navreo"><span>· navreo.ai</span></div>
          <div class="count">Wrap-up</div>
        </div>
      </div></div>`,

      `<div class="slide"><div class="outro ink">
        <div class="eyebrow">Book a call</div>
        <div class="cta-mega">More calls. <em>Not more headcount.</em></div>
        <div class="cta-prompt">Book a free call at</div>
        <div class="cta-url-big">navreo.ai/book-a-call</div>
        <div class="foot">
          <div class="brand"><img src="assets/logo-navreo-white.png" alt="navreo"><span>· last slide</span></div>
          <div class="count">Thanks for swiping</div>
        </div>
      </div></div>`,
    ];
    for (const html of outros) {
      const wrap = document.createElement('div');
      wrap.innerHTML = html.trim();
      track.appendChild(wrap.firstChild);
    }

    const slides = track.children.length;

    // dots
    const dotsEl = document.getElementById('dots');
    for (let i=0;i<slides;i++){
      const d = document.createElement('div');
      d.className = 'dot';
      d.addEventListener('click', ()=>go(i));
      dotsEl.appendChild(d);
    }

    // state
    let idx = parseInt(localStorage.getItem('carousel-idx')||'0',10);
    if (isNaN(idx) || idx<0 || idx>=slides) idx = 0;

    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');

    function render(){
      track.style.transform = `translateX(${-idx*1080}px)`;
      [...dotsEl.children].forEach((d,i)=>d.classList.toggle('active', i===idx));
      prevBtn.toggleAttribute('disabled', idx===0);
      nextBtn.toggleAttribute('disabled', idx===slides-1);
      localStorage.setItem('carousel-idx', idx);
    }
    function go(i){ idx = Math.max(0, Math.min(slides-1, i)); render(); }
    window.go = go;

    prevBtn.addEventListener('click', ()=>go(idx-1));
    nextBtn.addEventListener('click', ()=>go(idx+1));
    window.addEventListener('keydown', e=>{
      if (e.key==='ArrowRight') go(idx+1);
      if (e.key==='ArrowLeft') go(idx-1);
    });

    // swipe
    let sx=0, sy=0, dragging=false;
    const stage = document.getElementById('stage');
    stage.addEventListener('pointerdown', e=>{ dragging=true; sx=e.clientX; sy=e.clientY; });
    window.addEventListener('pointerup', e=>{
      if(!dragging) return; dragging=false;
      const dx=e.clientX-sx, dy=e.clientY-sy;
      if (Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)) go(idx + (dx<0?1:-1));
    });

    // scaling
    function fit(){
      const pad = 0.92;
      const s = Math.min(window.innerWidth/1080, window.innerHeight/1350) * pad;
      document.getElementById('frame').style.transform = `scale(${s})`;
    }
    window.addEventListener('resize', fit);
    fit(); render();
  </script>
</body>
</html>
