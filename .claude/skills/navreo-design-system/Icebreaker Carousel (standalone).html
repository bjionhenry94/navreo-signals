  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

   /* tertiary text / labels */\n  --nav-white:        #FFFFFF;\n  --nav-black:        #000000;\n\n  /* Tinted scale derived from the four brand colors */\n  --nav-cream-50:     #FCF7F1;\n  --nav-cream-100:    #F9F0E7;\n  --nav-cream-200:    #F4E8DC;\n  --nav-light-100:    #F2E5D9;\n  --nav-light-200:    #E8D7C4;\n  --nav-light-300:    #DCC6AE;\n  --nav-brown-300:    #C0B0A0;\n  --nav-brown-400:    #A89684;\n  --nav-brown-500:    #8A7868;\n  --nav-brown-600:    #5C4E40;\n  --nav-orange-100:   #FFE4D6;\n  --nav-orange-300:   #FF8A4D;\n  --nav-orange-500:   #FF4D00;   /* canonical */\n  --nav-orange-600:   #DB4100;\n  --nav-orange-700:   #A83100;\n\n  /* ============ Semantic ============ */\n  --bg:               var(--nav-cream);\n  --bg-elevated:      var(--nav-cream-50);\n  --bg-sunken:        var(--nav-light-brown);\n  --bg-inverse:       var(--nav-ink);\n\n  --fg:               var(--nav-ink);\n  --fg-muted:         var(--nav-ink-2);\n  --fg-subtle:        var(--nav-ink-3);\n  --fg-on-orange:     var(--nav-cream);\n  --fg-on-dark:       var(--nav-cream);\n\n  --accent:           var(--nav-orange);\n  --accent-hover:     var(--nav-orange-600);\n  --accent-press:     var(--nav-orange-700);\n  --accent-soft:      var(--nav-orange-100);\n\n  --border:           rgba(20,17,14,0.10);\n  --border-strong:    rgba(20,17,14,0.22);\n  --border-on-dark:   rgba(249,240,231,0.14);\n  --divider:          var(--nav-light-200);\n\n  --focus-ring:       0 0 0 3px rgba(255,77,0,0.32);\n\n  /* status (derived; warm-leaning to fit palette) */\n  --success:          #2E7D5B;\n  --warning:          #C28A00;\n  --danger:           #C2371F;\n\n  /* ============ Type ============ */\n  --font-sans:  \"DM Sans\", \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --font-display: \"Acid Grotesk\", \"DM Sans\", \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --font-mono:  \"JetBrains Mono\", ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n\n  /* fluid type — clamps for 360→1440 viewports */\n  --fs-12: 0.75rem;\n  --fs-13: 0.8125rem;\n  --fs-14: 0.875rem;\n  --fs-15: 0.9375rem;\n  --fs-16: 1rem;\n  --fs-18: 1.125rem;\n  --fs-20: 1.25rem;\n  --fs-24: 1.5rem;\n  --fs-32: 2rem;\n  --fs-40: 2.5rem;\n  --fs-56: 3.5rem;\n  --fs-80: 5rem;\n  --fs-display: clamp(3rem, 8vw, 6.5rem); /* @kind font */\n\n  --lh-tight: 1.02;  /* @kind font */\n  --lh-snug:  1.15;  /* @kind font */\n  --lh-base:  1.45;  /* @kind font */\n  --lh-loose: 1.6;   /* @kind font */\n\n  --tracking-tight: -0.03em;  /* @kind font */\n  --tracking-snug:  -0.015em; /* @kind font */\n  --tracking-base:  0;        /* @kind font */\n  --tracking-wide:  0.04em;   /* @kind font */\n  --tracking-mark:  0.12em;   /* @kind font */\n\n  --fw-light: 300;     /* @kind font */\n  --fw-regular: 400;   /* @kind font */\n  --fw-medium: 500;    /* @kind font */\n  --fw-semibold: 600;  /* @kind font */\n  --fw-bold: 700;      /* @kind font */\n\n  /* ============ Spacing (4-pt grid) ============ */\n  --sp-0:  0;    /* @kind spacing */\n  --sp-1:  4px;\n  --sp-2:  8px;\n  --sp-3:  12px;\n  --sp-4:  16px;\n  --sp-5:  20px;\n  --sp-6:  24px;\n  --sp-8:  32px;\n  --sp-10: 40px;\n  --sp-12: 48px;\n  --sp-16: 64px;\n  --sp-20: 80px;\n  --sp-24: 96px;\n  --sp-32: 128px;\n\n  /* ============ Radius ============ */\n  --r-none: 0;     /* @kind radius */\n  --r-xs:   2px;\n  --r-sm:   4px;\n  --r-md:   8px;\n  --r-lg:   12px;\n  --r-xl:   18px;\n  --r-2xl:  28px;\n  --r-pill: 999px;\n\n  /* ============ Shadows / Elevation ============\n     Warm-tinted, low contrast. Navreo prefers borders + flat fills\n     over deep shadows; reserve elevated shadow for menus/popovers. */\n  --shadow-0: none;\n  --shadow-1: 0 1px 0 rgba(20,17,14,0.04), 0 1px 2px rgba(20,17,14,0.05);\n  --shadow-2: 0 2px 4px rgba(20,17,14,0.05), 0 6px 16px -6px rgba(20,17,14,0.10);\n  --shadow-3: 0 4px 8px rgba(20,17,14,0.06), 0 18px 40px -12px rgba(20,17,14,0.18);\n  --shadow-inset: inset 0 0 0 1px rgba(20,17,14,0.08);\n\n  /* ============ Motion ============ */\n  --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);     /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);  /* @kind other */\n  --dur-1: 120ms;  /* @kind other */\n  --dur-2: 180ms;  /* @kind other */\n  --dur-3: 260ms;  /* @kind other */\n  --dur-4: 420ms;  /* @kind other */\n\n  /* ============ Layout ============ */\n  --max-w-prose: 68ch;            /* @kind other */\n  --max-w-page:  1280px;          /* @kind spacing */\n  --gutter: clamp(20px, 4vw, 56px); /* @kind spacing */\n}\n\n/* ---------- Base reset (opt-in: add class .navreo to <body>) ---------- */\n.navreo, .navreo * { box-sizing: border-box; }\n.navreo {\n  background: var(--bg);\n  color: var(--fg);\n  font-family: var(--font-sans);\n  font-size: var(--fs-16);\n  line-height: var(--lh-base);\n  letter-spacing: var(--tracking-snug);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* ---------- Type scale: utility classes ---------- */\n.t-display {\n  font-family: var(--font-display);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-display);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--tracking-tight);\n  text-wrap: balance;\n}\n.t-h1 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-regular);\n  font-size: clamp(2.5rem, 5vw, 4rem);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--tracking-tight);\n  text-wrap: balance;\n}\n.t-h2 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-regular);\n  font-size: clamp(1.75rem, 3vw, 2.5rem);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--tracking-tight);\n  text-wrap: balance;\n}\n.t-h3 {\n  font-weight: var(--fw-medium);\n  font-size: var(--fs-24);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--tracking-snug);\n}\n.t-h4 {\n  font-weight: var(--fw-medium);\n  font-size: var(--fs-20);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--tracking-snug);\n}\n.t-body {\n  font-size: var(--fs-16);\n  line-height: var(--lh-base);\n  letter-spacing: var(--tracking-snug);\n}\n.t-body-lg {\n  font-size: var(--fs-20);\n  line-height: var(--lh-base);\n  letter-spacing: var(--tracking-snug);\n  text-wrap: pretty;\n}\n.t-small {\n  font-size: var(--fs-14);\n  line-height: var(--lh-base);\n}\n.t-caption {\n  font-size: var(--fs-13);\n  line-height: var(--lh-base);\n  color: var(--fg-subtle);\n}\n.t-eyebrow {\n  font-size: var(--fs-12);\n  font-weight: var(--fw-medium);\n  letter-spacing: var(--tracking-mark);\n  text-transform: uppercase;\n  color: var(--fg-subtle);\n}\n.t-mono {\n  font-family: var(--font-mono);\n  font-size: var(--fs-13);\n  letter-spacing: 0;\n}\n\n/* ---------- Semantic mapping when used directly ---------- */\n.navreo h1 { font: var(--fw-regular) clamp(2.5rem, 5vw, 4rem)/var(--lh-tight) var(--font-display); letter-spacing: var(--tracking-tight); }\n.navreo h2 { font: var(--fw-regular) clamp(1.75rem, 3vw, 2.5rem)/var(--lh-snug) var(--font-display); letter-spacing: var(--tracking-tight); }\n.navreo h3 { font: var(--fw-medium) var(--fs-24)/var(--lh-snug) var(--font-sans); letter-spacing: var(--tracking-snug); }\n.navreo h4 { font: var(--fw-medium) var(--fs-20)/var(--lh-snug) var(--font-sans); letter-spacing: var(--tracking-snug); }\n.navreo p  { font-size: var(--fs-16); line-height: var(--lh-base); text-wrap: pretty; max-width: var(--max-w-prose); }\n.navreo small { font-size: var(--fs-13); color: var(--fg-subtle); }\n.navreo code, .navreo pre { font-family: var(--font-mono); font-size: var(--fs-13); }\n<\u002Fstyle>\n<style>\n  /* ========== PRINT: only the slides, one per page ========== */\n  @page { size: 1080px 1350px; margin: 0; }\n  @media print {\n    @page { size: 1080px 1350px; margin: 0; }\n    html, body {\n      background: #ffffff !important;\n      overflow: visible !important;\n      height: auto !important; width: auto !important;\n      margin: 0 !important; padding: 0 !important;\n    }\n    body * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }\n    *, *::before, *::after {\n      animation-delay: -99s !important; animation-duration: .001s !important;\n      animation-iteration-count: 1 !important; animation-fill-mode: both !important;\n      animation-play-state: running !important; transition-duration: 0s !important;\n    }\n    #prev, #next, .dots, .nav { display: none !important; }\n    #stage { position: static !important; inset: auto !important; display: block !important; }\n    #frame {\n      width: 1080px !important; height: auto !important;\n      transform: none !important; overflow: visible !important;\n      border-radius: 0 !important; box-shadow: none !important; margin: 0 !important;\n    }\n    #track {\n      display: block !important; height: auto !important;\n      transform: none !important; transition: none !important; width: 1080px !important;\n    }\n    .slide {\n      width: 1080px !important; height: 1350px !important; flex: none !important;\n      break-inside: avoid !important; page-break-inside: avoid !important;\n      break-after: page !important; page-break-after: always !important;\n      overflow: hidden !important;\n    }\n    .slide:last-child { break-after: auto !important; page-break-after: auto !important; }\n  }\n\n  * { box-sizing: border-box; }\n  html, body { margin: 0; height: 100%; }\n  body {\n    background: #17120f;\n    font-family: var(--font-sans);\n    overflow: hidden;\n  }\n\n  /* ---- stage / scaling ---- */\n  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }\n  #frame {\n    width: 1080px; height: 1350px;\n    transform-origin: center center; overflow: hidden;\n    border-radius: 8px; box-shadow: 0 40px 120px -30px rgba(0,0,0,0.6); position: relative;\n  }\n  #track { display: flex; height: 100%; transition: transform 480ms cubic-bezier(0.2,0.7,0.2,1); will-change: transform; }\n  .slide { width: 1080px; height: 1350px; flex: none; position: relative; }\n\n  /* ============ ANGLE CARD ============ */\n  .angle {\n    background: var(--nav-cream); color: var(--nav-ink);\n    padding: 74px 78px 60px; display: flex; flex-direction: column; height: 100%;\n  }\n  .row-top { display: flex; align-items: center; justify-content: space-between; gap: 24px; }\n  .iccat { display: flex; align-items: center; gap: 22px; }\n  .ic {\n    width: 86px; height: 86px; flex: none; border-radius: 22px;\n    background: var(--nav-orange-100); color: var(--nav-orange);\n    display: flex; align-items: center; justify-content: center;\n  }\n  .ic svg { width: 46px; height: 46px; }\n  .cat {\n    font-family: var(--font-mono); font-size: 22px; letter-spacing: 0.08em;\n    text-transform: uppercase; color: var(--nav-ink-3); font-weight: 500; line-height: 1.25; max-width: 320px;\n  }\n  .badge {\n    font-family: var(--font-mono); font-size: 28px; font-weight: 500;\n    color: var(--nav-ink); border: 2px solid var(--nav-ink); border-radius: 8px;\n    padding: 8px 18px; box-shadow: 4px 4px 0 rgba(20,17,14,0.14); flex: none;\n  }\n  .angle.net .ic { background: rgba(255,77,0,0.12); }\n  .angle.net .badge { color: var(--nav-orange); border-color: var(--nav-orange); box-shadow: 4px 4px 0 rgba(255,77,0,0.2); }\n  .name {\n    font-family: var(--font-display); font-weight: 400; font-size: 104px;\n    line-height: 0.95; letter-spacing: -0.035em; margin: 40px 0 0;\n  }\n\n  /* ---- the signal → line diagram ---- */\n  .diagram { margin-top: 40px; }\n  .blab {\n    font-family: var(--font-mono); font-size: 20px; letter-spacing: 0.12em;\n    text-transform: uppercase; font-weight: 500;\n    display: flex; align-items: center; gap: 11px; margin-bottom: 16px;\n  }\n  .blab::before { content: \"\"; width: 9px; height: 9px; border-radius: 999px; }\n  .signal { background: var(--nav-cream-50); border: 1px solid var(--border); border-radius: 20px; padding: 28px 32px; }\n  .signal .blab { color: var(--nav-ink-3); }\n  .signal .blab::before { background: var(--nav-dark-brown); }\n\n  /* signal building blocks */\n  .av {\n    width: 60px; height: 60px; flex: none; border-radius: 999px;\n    background: var(--nav-orange-100); color: var(--nav-orange);\n    font-family: var(--font-mono); font-weight: 500; font-size: 24px;\n    display: flex; align-items: center; justify-content: center;\n  }\n  .row { display: flex; align-items: center; gap: 20px; }\n  .row + .row { margin-top: 16px; border-top: 1px solid var(--divider); padding-top: 16px; }\n  .ttl { font-family: var(--font-display); font-weight: 400; font-size: 42px; line-height: 1; letter-spacing: -0.02em; }\n  .meta { font-family: var(--font-mono); font-size: 21px; color: var(--nav-ink-3); margin-top: 8px; }\n  .grow { flex: 1; min-width: 0; }\n  .pill {\n    font-family: var(--font-mono); font-size: 19px; letter-spacing: 0.08em; text-transform: uppercase;\n    font-weight: 500; color: var(--nav-orange); background: var(--nav-orange-100);\n    padding: 8px 16px; border-radius: 999px; flex: none;\n  }\n  .live { width: 18px; height: 18px; border-radius: 999px; background: var(--nav-orange); flex: none;\n    box-shadow: 0 0 0 6px rgba(255,77,0,0.18); }\n  .bars { display: flex; align-items: flex-end; gap: 10px; height: 76px; flex: none; }\n  .bars i { width: 24px; background: var(--nav-orange); border-radius: 6px 6px 0 0; display: block; }\n  .techs { display: flex; flex-wrap: wrap; gap: 14px; }\n  .tech {\n    font-family: var(--font-mono); font-size: 26px; padding: 14px 22px; border-radius: 12px;\n    border: 1px solid var(--border-strong); color: var(--nav-ink-3); background: var(--nav-white);\n  }\n  .tech.on { background: var(--nav-orange); color: var(--nav-cream); border-color: var(--nav-orange); font-weight: 500; }\n\n  .conn { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 16px 0; }\n  .conn svg { width: 36px; height: 36px; color: var(--nav-orange); }\n  .conn span {\n    font-family: var(--font-mono); font-size: 18px; letter-spacing: 0.14em;\n    text-transform: uppercase; color: var(--nav-ink-3);\n  }\n\n  .line-card { background: var(--nav-ink); color: var(--nav-cream); border-radius: 20px; padding: 30px 36px; }\n  .line-card .blab { color: rgba(249,240,231,0.6); }\n  .line-card .blab::before { background: var(--nav-orange); }\n  .line-card .line { font-size: 36px; line-height: 1.38; letter-spacing: -0.012em; text-wrap: pretty; }\n  .line-card .line b { font-weight: 600; color: var(--nav-orange-300); }\n\n  .foot {\n    margin-top: auto; padding-top: 32px;\n    display: flex; align-items: center; justify-content: space-between;\n    border-top: 1px solid var(--divider);\n  }\n  .foot .brand { display: flex; align-items: center; gap: 16px; }\n  .foot .brand img { height: 26px; width: auto; display: block; }\n  .foot .brand span { font-family: var(--font-mono); font-size: 20px; color: var(--nav-ink-3); letter-spacing: 0.02em; }\n  .foot .count { font-family: var(--font-mono); font-size: 22px; color: var(--nav-ink-3); letter-spacing: 0.06em; }\n\n  /* ============ EXPLAINER (cream/ink reusable) ============ */\n  .outro { padding: 80px 78px 60px; display: flex; flex-direction: column; height: 100%; position: relative; overflow: hidden; }\n  .outro.cream { background: var(--nav-cream); color: var(--nav-ink); }\n  .outro.ink   { background: var(--nav-ink);   color: var(--nav-cream); }\n  .outro .eyebrow {\n    font-family: var(--font-mono); font-size: 24px; letter-spacing: 0.14em; text-transform: uppercase;\n    font-weight: 500; display: inline-flex; align-items: center; gap: 14px;\n  }\n  .outro.cream .eyebrow { color: var(--nav-ink-3); }\n  .outro.ink   .eyebrow { color: rgba(249,240,231,0.6); }\n  .outro .eyebrow::before { content: \"\"; width: 10px; height: 10px; border-radius: 999px; background: var(--nav-orange); }\n  .outro h2 {\n    font-family: var(--font-display); font-weight: 400; font-size: 100px;\n    line-height: 0.98; letter-spacing: -0.035em; margin: 32px 0 0; text-wrap: balanc n      <div class=\"outro ink\">\n        <div class=\"eyebrow\">How it works<\u002Fdiv>\n        <h2 class=\"sm\">A waterfall. <em>First signal with data wins.<\u002Fem><\u002Fh2>\n        <div class=\"wf\">\n          <div class=\"wstep\"><span class=\"wn\">1<\u002Fspan><span class=\"wlogo\"><img src=\"assets/tools/logo/TheirStack.png\" alt=\"TheirStack\"><\u002Fspan><div class=\"wnm\">The hire<\u002Fdiv><div class=\"wwh\">a live sales role<\u002Fdiv><\u002Fdiv>\n          <div class=\"wstep\"><span class=\"wn\">2<\u002Fspan><span class=\"wlogo\"><img src=\"assets/tools/logo/Prospeo.png\" alt=\"Prospeo\"><\u002Fspan><div class=\"wnm\">The new role<\u002Fdiv><div class=\"wwh\">joined recently<\u002Fdiv><\u002Fdiv>\n          <div class=\"wstep\"><span class=\"wn\">3<\u002Fspan><span class=\"wlogo\"><img src=\"assets/tools/logo/Prospeo.png\" alt=\"Prospeo\"><\u002Fspan><span class=\"wlogo\"><img src=\"assets/tools/logo/PredictLeads.png\" alt=\"PredictLeads\"><\u002Fspan><div class=\"wnm\">The raise<\u002Fdiv><div class=\"wwh\">funding in the last 6 months<\u002Fdiv><\u002Fdiv>\n          <div class=\"wstep\"><span class=\"wn\">4<\u002Fspan><span class=\"wlogo\"><img src=\"assets/tools/logo/TheirStack.png\" alt=\"TheirStack\"><\u002Fspan><div class=\"wnm\">The tech stack<\u002Fdiv><div class=\"wwh\">a relevant tool · opt-in<\u002Fdiv><\u002Fdiv>\n          <div class=\"wstep\"><span class=\"wn\">5<\u002Fspan><span class=\"wlogo\"><img src=\"assets/tools/logo/Prospeo.png\" alt=\"Prospeo\"><\u002Fspan><span class=\"wlogo\"><img src=\"assets/tools/logo/AI%20Ark.png\" alt=\"AI Ark\"><\u002Fspan><span class=\"wlogo\"><img src=\"assets/tools/logo/Apollo.io.png\" alt=\"Apollo\"><\u002Fspan><div class=\"wnm\">The colleague<\u002Fdiv><div class=\"wwh\">another decision-maker<\u002Fdiv><\u002Fdiv>\n          <div class=\"wstep last\"><span class=\"wn\">6<\u002Fspan><span class=\"wlogo gen\">${ICONS.net}<\u002Fspan><div class=\"wnm\">The safety net<\u002Fdiv><div class=\"wwh\">always fires<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"winner\">${DOWN}<span>no data? <b>fall to the next — the safety net (6) always catches.<\u002Fb><\u002Fspan><\u002Fdiv>\n        <div class=\"reorder\">We moved from Clay to Claude Code so we can <b>reorder the angles per campaign<\u002Fb> in seconds — no rebuild.<\u002Fdiv>\n        <div class=\"foot\">\n          <div class=\"brand\"><img src=\"assets/logo-navreo-white.png\" alt=\"navreo\"><span>· navreo.ai<\u002Fspan><\u002Fdiv>\n          <div class=\"count\">The waterfall<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n    track.appendChild(how);\n\n    // angle cards\n    ANGLES.forEach((a) => {\n      const s = document.createElement('div');\n      s.className = 'slide';\n      s.innerHTML = `\n        <div class=\"angle${a.net ? ' net' : ''}\">\n          <div class=\"row-top\">\n            <div class=\"iccat\"><span class=\"ic\">${ICONS[a.icon]}<\u002Fspan><div class=\"cat\">${a.cat}<\u002Fdiv><\u002Fdiv>\n            <div class=\"badge\">${a.n}<\u002Fdiv>\n          <\u002Fdiv>\n          <h2 class=\"name\">${a.name}<\u002Fh2>\n          <div class=\"diagram\">\n            <div class=\"signal\">\n              <div class=\"blab\">${a.sigLabel}<\u002Fdiv>\n              ${a.signal}\n            <\u002Fdiv>\n            <div class=\"conn\">${DOWN}<span>generates<\u002Fspan><\u002Fdiv>\n            <div class=\"line-card\">\n              <div class=\"blab\">The line we send<\u002Fdiv>\n              <div class=\"line\">${a.line}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          ${a.net\n            ? '<div class=\"source netsrc\">No data needed \\u2014 the fallback always fires<\u002Fdiv>'\n            : `<div class=\"source\"><span class=\"sl\"><img src=\"assets/tools/logo/${encodeURI(SRC[a.n].file)}.png\" alt=\"${SRC[a.n].logo}\"><\u002Fspan><div><div class=\"scap\">Data source<\u002Fdiv><div class=\"snm\">${SRC[a.n].logo} \\u00b7 ${SRC[a.n].cap}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`}\n          <div class=\"foot\">\n            <div class=\"brand\"><img src=\"assets/logo-navreo.png\" alt=\"navreo\"><span>· angle ${a.n} of ${total}<\u002Fspan><\u002Fdiv>\n            <div class=\"count\">Icebreakers<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>`;\n      track.appendChild(s);\n    });\n\n    // the stack — tools we use (logo slots)\n    const stack = document.createElement('div');\n    stack.className = 'slide';\n    stack.innerHTML = `\n      <div class=\"outro cream\">\n        <div class=\"eyebrow\">The stack<\u002Fdiv>\n        <h2 class=\"sm\">Six tools. <em>One workflow.<\u002Fem><\u002Fh2>\n        <div class=\"stackg\">\n          <div class=\"scard run\">\n            <span class=\"ltile\"><img src=\"assets/claude-code-mascot.png\" alt=\"Claude Code\"><\u002Fspan>\n            <div><div class=\"sn\">Claude Code<\u002Fdiv><div class=\"sr\">Runs the whole waterfall — reorder any campaign in seconds<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"sgrid\">\n            <div class=\"scard\"><span class=\"ltile\"><image-slot id=\"stk-prospeo\" shape=\"rounded\" radius=\"14\" fit=\"contain\" src=\"assets/tools/logo/Prospeo.png\" placeholder=\"Prospeo\"><\u002Fimage-slot><\u002Fspan><div><div class=\"sn\">Prospeo<\u002Fdiv><div class=\"sr\">Prospect list · funding · tenure<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"scard\"><span class=\"ltile\"><image-slot id=\"stk-aiark\" shape=\"rounded\" radius=\"14\" fit=\"contain\" src=\"assets/tools/logo/AI%20Ark.png\" placeholder=\"AI Ark\"><\u002Fimage-slot><\u002Fspan><div><div class=\"sn\">AI Ark<\u002Fdiv><div class=\"sr\">Alternate prospect data<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"scard\"><span class=\"ltile\"><image-slot id=\"stk-theirstack\" shape=\"rounded\" radius=\"14\" fit=\"contain\" src=\"assets/tools/logo/TheirStack.png\" placeholder=\"TheirStack\"><\u002Fimage-slot><\u002Fspan><div><div class=\"sn\">TheirStack<\u002Fdiv><div class=\"sr\">Live hiring signals<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div class=\"scard\"><span class=\"ltile\"><image-slot id=\"stk-predictleads\" shape=\"rounded\" radius=\"14\" fit=\"contain\" placeholder=\"PredictLeads\"><\u002Fimage-slot><\u002Fspan><div><div class=\"sn\">PredictLeads<\u002Fdiv><div class=\"sr\">Funding signals<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"scard send\">\n            <span class=\"ltile\"><image-slot id=\"stk-smartlead\" shape=\"rounded\" radius=\"14\" fit=\"contain\" src=\"assets/tools/logo/Smartlead.png\" placeholder=\"Smartlead\"><\u002Fimage-slot><\u002Fspan>\n            <div><div class=\"sn\">Smartlead<\u002Fdiv><div class=\"sr\">Sends the personalised campaign<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"foot\">\n          <div class=\"brand\"><img src=\"assets/logo-navreo.png\" alt=\"navreo\"><span>· navreo.ai<\u002Fspan><\u002Fdiv>\n          <div class=\"count\">The stack<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n    track.appendChild(stack);\n\n    // outro — never empty principle\n    const principle = document.createElement('div');\n    principle.className = 'slide';\n    principle.innerHTML = `\n      <div class=\"outro cream\">\n        <div class=\"eyebrow\">What actually fires<\u002Fdiv>\n        <h2 class=\"sm\">One list of <em>20,000 leads.<\u002Fem><\u002Fh2>\n        <div class=\"bd\">\n          <div class=\"bdhead\"><div>Angle<\u002Fdiv><div><\u002Fdiv><div class=\"r\">Share<\u002Fdiv><div class=\"r\">Leads<\u002Fdiv><\u002Fdiv>\n          <div class=\"bdrow\"><div class=\"bdnm\"><img src=\"assets/tools/logo/TheirStack.png\" alt=\"\">The hire<\u002Fdiv><div class=\"bdbar\"><i style=\"width:26%\"><\u002Fi><\u002Fdiv><div class=\"bdpct\">13%<\u002Fdiv><div class=\"bdcnt\">2,600<\u002Fdiv><\u002Fdiv>\n          <div class=\"bdrow\"><div class=\"bdnm\"><img src=\"assets/tools/logo/Prospeo.png\" alt=\"\">The new role<\u002Fdiv><div class=\"bdbar\"><i style=\"width:16%\"><\u002Fi><\u002Fdiv><div class=\"bdpct\">8%<\u002Fdiv><div class=\"bdcnt\">1,600<\u002Fdiv><\u002Fdiv>\n          <div class=\"bdrow\"><div class=\"bdnm\"><img src=\"assets/tools/logo/Prospeo.png\" alt=\"\">The raise<\u002Fdiv><div class=\"bdbar\"><i style=\"width:12%\"><\u002Fi><\u002Fdiv><div class=\"bdpct\">6%<\u002Fdiv><div class=\"bdcnt\">1,200<\u002Fdiv><\u002Fdiv>\n          <div class=\"bdrow\"><div class=\"bdnm\"><img src=\"assets/tools/logo/AI%20Ark.png\" alt=\"\">The tech stack<\u002Fdiv><div class=\"bdbar\"><i style=\"width:18%\"><\u002Fi><\u002Fdiv><div class=\"bdpct\">9%<\u002Fdiv><div class=\"bdcnt\">1,800<\u002Fdiv><\u002Fdiv>\n          <div class=\"bdrow\"><div class=\"bdnm\"><img src=\"assets/tools/logo/Prospeo.png\" alt=\"\">The colleague<\u002Fdiv><div class=\"bdbar\"><i style=\"width:28%\"><\u002Fi><\u002Fdiv><div class=\"bdpct\">14%<\u002Fdiv><div class=\"bdcnt\">2,800<\u002Fdiv><\u002Fdiv>\n          <div class=\"bdrow net\"><div class=\"bdnm\">The safety net<\u002Fdiv><div class=\"bdbar\"><i style=\"width:100%\"><\u002Fi><\u002Fdiv><div class=\"bdpct\">50%<\u002Fdiv><div class=\"bdcnt\">10,000<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"bdnote\">~50% lean on the safety net — <b>which is exactly why it has to be good.<\u002Fb><\u002Fdiv>\n        <div class=\"foot\">\n          <div class=\"brand\"><img src=\"assets/logo-navreo.png\" alt=\"navreo\"><span>· navreo.ai<\u002Fspan><\u002Fdiv>\n          <div class=\"count\">The breakdown<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n    track.appendChild(principle);\n\n    // CTA\n    const cta = document.createElement('div');\n    cta.className = 'slide';\n    cta.innerHTML = `\n      <div class=\"outro ink\">\n        <div class=\"eyebrow\">What we do<\u002Fdiv>\n        <div class=\"cta-mega\">Book more. <em>Not more hires.<\u002Fem><\u002Fdiv>\n        <p class=\"ctalede\">We build go-to-market systems that help B2B sales teams book more meetings, without growing the team.<\u002Fp>\n        <div class=\"cta-prompt\">Book a free call at<\u002Fdiv>\n        <div class=\"cta-url-big\">navreo.ai/book-a-call<\u002Fdiv>\n        <div class=\"foot\">\n          <div class=\"brand\"><img src=\"assets/logo-navreo-white.png\" alt=\"navreo\"><span>· last slide<\u002Fspan><\u002Fdiv>\n          <div class=\"count\">Thanks for swiping<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n    track.appendChild(cta);\n\n    const slides = track.children.length;\n\n    // dots\n    const dotsEl = document.getElementById('dots');\n    for (let i=0;i<slides;i++){\n      const d = document.createElement('div');\n      d.className = 'dot';\n      d.addEventListener('click', ()=>go(i));\n      dotsEl.appendChild(d);\n    }\n\n    let idx = parseInt(localStorage.getItem('ib-carousel-idx')||'0',10);\n    if (isNaN(idx) || idx<0 || idx>=slides) idx = 0;\n\n    const prevBtn = document.getElementById('prev');\n    const nextBtn = document.getElementById('next');\n\n    function render(){\n      track.style.transform = `translateX(${-idx*1080}px)`;\n      [...dotsEl.children].forEach((d,i)=>d.classList.toggle('active', i===idx));\n      prevBtn.toggleAttribute('disabled', idx===0);\n      nextBtn.toggleAttribute('disabled', idx===slides-1);\n      localStorage.setItem('ib-carousel-idx', idx);\n    }\n    function go(i){ idx = Math.max(0, Math.min(slides-1, i)); render(); }\n    window.go = go;\n\n    prevBtn.addEventListener('click', ()=>go(idx-1));\n    nextBtn.addEventListener('click', ()=>go(idx+1));\n    window.addEventListener('keydown', e=>{\n      if (e.key==='ArrowRight') go(idx+1);\n      if (e.key==='ArrowLeft') go(idx-1);\n    });\n\n    // swipe\n    let sx=0, sy=0, dragging=false;\n    const stage = document.getElementById('stage');\n    stage.addEventListener('pointerdown', e=>{ dragging=true; sx=e.clientX; sy=e.clientY; });\n    window.addEventListener('pointerup', e=>{\n      if(!dragging) return; dragging=false;\n      const dx=e.clientX-sx, dy=e.clientY-sy;\n      if (Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)) go(idx + (dx<0?1:-1));\n    });\n\n    // scaling\n    function fit(){\n      const pad = 0.92;\n      const s = Math.min(window.innerWidth/1080, window.innerHeight/1350) * pad;\n      document.getElementById('frame').style.transform = `scale(${s})`;\n    }\n    window.addEventListener('resize', fit);\n    fit(); render();\n  <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
