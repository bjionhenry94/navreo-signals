<!doctype html>
<!-- @dsCard group="Colors" name="Orange scale" subtitle="Single accent — primary CTAs, focus, key data" viewport="900x280" -->
<html><head><meta charset="utf-8"><title>Orange scale</title>
<link rel="stylesheet" href="_card.css">
<style>
  .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .stop {
    aspect-ratio: 1 / 1.1;
    border-radius: 10px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border: 1px solid var(--border);
  }
  .stop .name { font-weight: 500; font-size: 12px; }
  .stop .hex { font-family: var(--font-mono); font-size: 10.5px; opacity: 0.7; }
</style></head>
<body>
  <div class="label" style="margin-bottom:10px">Orange — primary accent scale</div>
  <div class="scale">
    <div class="stop" style="background:#FFE4D6"><span class="name">100</span><span class="hex">#FFE4D6</span></div>
    <div class="stop" style="background:#FF8A4D"><span class="name" style="color:#fff">300</span><span class="hex" style="color:#fff">#FF8A4D</span></div>
    <div class="stop" style="background:#FF4D00"><span class="name" style="color:#fff">500 ✦</span><span class="hex" style="color:#fff">#FF4D00</span></div>
    <div class="stop" style="background:#DB4100"><span class="name" style="color:#fff">600</span><span class="hex" style="color:#fff">#DB4100</span></div>
    <div class="stop" style="background:#A83100"><span class="name" style="color:#fff">700</span><span class="hex" style="color:#fff">#A83100</span></div>
  </div>
</body></html>
