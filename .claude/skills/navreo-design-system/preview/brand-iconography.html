<!doctype html>
<!-- @dsCard group="Brand" name="Iconography" subtitle="Lucide · 1.75 stroke · substitute set" viewport="900x200" -->
<html><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="_card.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { padding: 24px; }
  .row3 { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .icon { color: var(--nav-ink); }
  .icon svg { display: block; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--nav-ink-3); margin-top: 14px; }
</style></head>
<body>
  <div class="row3">
    <i class="icon" data-lucide="arrow-up-right" width="24" height="24"></i>

    <i class="icon" data-lucide="settings" width="24" height="24"></i>

    <i class="icon" data-lucide="x" width="24" height="24"></i>
    <i class="icon" data-lucide="folder" width="24" height="24"></i>
    <i class="icon" data-lucide="file-text" width="24" height="24"></i>
    <i class="icon" data-lucide="bell" width="24" height="24"></i>
    <i class="icon" data-lucide="user" width="24" height="24"></i>
    <i class="icon" data-lucide="trash-2" width="24" height="24"></i>
    <i class="icon" data-lucide="globe" width="24" height="24"></i>
    <i class="icon" data-lucide="zap" width="24" height="24"></i>

  <div class="meta">Lucide · 1.75 stroke · 24px · inherits text color · ⚠ substitute set, no project icon font provided</div>
  <script>lucide.createIcons();</script>
</body></html>
