<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4-pt grid · 4 → 128" viewport="720x360" -->
<html><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="_card.css">

  .bar { height: 10px; background: var(--nav-orange); border-radius: 2px; }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--nav-ink-3); margin-left: auto; }
</style></head>
<body>
  <div class="row3"><div class="tag">--sp-1</div><div class="bar" style="width:4px"></div><div class="px">4</div></div>

</body></html>
