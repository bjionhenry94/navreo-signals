<!doctype html>
<!-- @dsCard group="Components" name="Inputs" subtitle="Default · focus · error · disabled" viewport="900x320" -->
<html><head><meta charset="utf-8"><title>Inputs</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 24px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; max-width: 360px; }
  label { font-size: 12px; font-weight: 500; color: var(--nav-ink-2); letter-spacing: -0.005em; }
  .input {
    height: 42px; padding: 0 14px; border-radius: 8px;
    background: var(--nav-cream-50);
    border: 1px solid rgba(20,17,14,0.10);
    font: 14px var(--font-sans); color: var(--nav-ink);
    letter-spacing: -0.01em;
  }
  .input.focus { border-color: rgba(20,17,14,0.4); box-shadow: 0 0 0 3px rgba(255,77,0,0.32); outline: none; }
  .input.error { border-color: #C2371F; box-shadow: 0 0 0 3px rgba(194,55,31,0.18); }
  .help { font-size: 12px; color: var(--nav-ink-3); }
  .help.err { color: #C2371F; }
  .row3 { display: flex; gap: 18px; }
</style></head>
<body>
  <div class="row3">
    <div class="field" style="flex:1">
      <label>Email</label>
      <input class="input" placeholder="you@navreo.ai" value="ada@navreo.ai" />
      <span class="help">We never share this.</span>
    </div>
    <div class="field" style="flex:1">
      <label>Workspace</label>
      <input class="input focus" placeholder="acme-co" value="acme-co" />
      <span class="help">Lowercase, dashes only.</span>
    </div>
  </div>
  <div class="row3">
    <div class="field" style="flex:1">
      <label>API key</label>
      <input class="input error" value="nav_pk_••• invalid" />
      <span class="help err">That key was revoked.</span>
    </div>
    <div class="field" style="flex:1">
      <label>Region</label>
      <input class="input" value="us-east" disabled style="opacity:0.55"/>
      <span class="help">Locked to your plan.</span>
    </div>
  </div>
</body></html>
