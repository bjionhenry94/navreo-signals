<!doctype html>
<!-- @dsCard group="Components" name="Stat numbers" subtitle="Hero counters — numbers carry the story" viewport="1100x260" -->
<html><head><meta charset="utf-8"><title>Stat numbers</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 28px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  .stat { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid rgba(20,17,14,0.18); padding-top: 14px; }
  .num { font-weight: 500; font-size: 76px; line-height: 0.95; letter-spacing: -0.04em; }
  .num.accent { color: var(--nav-orange); }
  .lab { font-size: 14px; color: var(--nav-ink-2); letter-spacing: -0.005em; }
</style></head>
<body>
  <div class="grid">
    <div class="stat"><div class="num">1,500+</div><div class="lab">Hours saved for clients monthly</div></div>
    <div class="stat"><div class="num accent">$15m+</div><div class="lab">Sales pipeline generated last year</div></div>
    <div class="stat"><div class="num">50+</div><div class="lab">Sales teams &amp; businesses coached</div></div>
  </div>
</body></html>
