<!doctype html>
<!-- @dsCard group="Spacing" name="Radii" subtitle="0 · 2 · 4 · 8 · 12 · 18 · 28" viewport="900x180" -->
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
  .cell { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .shape { width: 64px; height: 64px; background: var(--nav-light-brown); border: 1px solid var(--border); }
  .name { font-family: var(--font-mono); font-size: 10.5px; color: var(--nav-ink-3); }
</style></head>
<body>
  <div class="grid">
    <div class="cell"><div class="shape" style="border-radius:0"></div><div class="name">none · 0</div></div>
    <div class="cell"><div class="shape" style="border-radius:2px"></div><div class="name">xs · 2</div></div>
    <div class="cell"><div class="shape" style="border-radius:4px"></div><div class="name">sm · 4</div></div>
    <div class="cell"><div class="shape" style="border-radius:8px"></div><div class="name">md · 8</div></div>
    <div class="cell"><div class="shape" style="border-radius:12px"></div><div class="name">lg · 12</div></div>
    <div class="cell"><div class="shape" style="border-radius:18px"></div><div class="name">xl · 18</div></div>
    <div class="cell"><div class="shape" style="border-radius:28px"></div><div class="name">2xl · 28</div></div>
  </div>
</body></html>
