<!doctype html>
<!-- @dsCard group="Type" name="Headings" subtitle="H1–H4 with metrics" viewport="900x380" -->
<html><head><meta charset="utf-8"><title>Headings</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 24px; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .row3 { display: flex; align-items: baseline; gap: 18px; border-bottom: 1px solid var(--divider); padding-bottom: 10px; }
  .row3:last-child { border-bottom: 0; }
  .meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--nav-ink-3); margin-left: auto; flex: none; }
  .h1 { font-weight: 500; font-size: 56px; line-height: 1.02; letter-spacing: -0.03em; }
  .h2 { font-weight: 500; font-size: 36px; line-height: 1.1; letter-spacing: -0.025em; }
  .h3 { font-weight: 500; font-size: 24px; line-height: 1.2; letter-spacing: -0.015em; }
  .h4 { font-weight: 500; font-size: 20px; line-height: 1.25; letter-spacing: -0.01em; }
</style></head>
<body>
  <div class="stack">
    <div class="row3"><div class="h1">Heading one</div><div class="meta">56 / 57 · −0.03em · 500</div></div>
    <div class="row3"><div class="h2">Heading two</div><div class="meta">36 / 40 · −0.025em · 500</div></div>
    <div class="row3"><div class="h3">Heading three</div><div class="meta">24 / 29 · −0.015em · 500</div></div>
    <div class="row3"><div class="h4">Heading four</div><div class="meta">20 / 25 · −0.01em · 500</div></div>
  </div>
</body></html>
