  <div class="row3"><div class="tag">300 light</div><div class="sample" style="font-weight:300">navreo light</div></div>

  <div class="row3"><div class="tag">500 medium ✦</div><div class="sample" style="font-weight:500">navreo medium</div></div>
  <div class="row3"><div class="tag">600 semibold</div><div class="sample" style="font-weight:600">navreo semibold</div></div>
